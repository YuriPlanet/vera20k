[package]
name = "vera20k-wasm-ext"
version = "0.1.0"
edition = "2024"
description = "Sandbox for VERA20k Wasm extension modules (RFC 0001): load checks, metering and the vera:sim host boundary"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Saved module state (memory pages, globals) travels in the game snapshot.
serde = { workspace = true }
# Load checks and the load-time rewrite (metering, call depth, NaN
# canonicalization), shared by every runtime so all count the same work.
wasmparser = "0.245"
wasm-encoder = { version = "0.245", default-features = false, features = ["std", "wasmparser"] }

# Desktop runs the rewritten module with Wasmtime.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
wasmtime = { version = "51", default-features = false, features = ["cranelift", "runtime", "std"] }

# The browser build runs the same rewritten module with the browser's own
# WebAssembly engine (RFC 0001 open question 1).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
wat = "1"

[lints]
workspace = true
