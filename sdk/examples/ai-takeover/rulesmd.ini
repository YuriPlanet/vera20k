; AI Takeover: the INI the ai-takeover module needs.
; A mod's rulesmd.ini replaces the retail one, so in a real mod add this
; section to a full copy of rulesmd.ini.

; Controller=yes lets the lobby offer a "mod AI" option for every computer
; seat: such a house starts the match with all four ControlDomains bits
; held by this module, so the native AI never runs for it (RFC 0001 6i).
; Without it the module still claims every computer house on its first
; frame.
[VeraWasm]
Controller=yes
