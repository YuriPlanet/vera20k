[package]
name = "ai-takeover"
version = "0.1.0"
edition = "2024"
publish = false
description = "A demo mod: takes over a computer house (RFC 0001 section 6i) and plays it with a small scripted AI"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
