[package]
name = "orders-rules"
version = "0.1.0"
edition = "2024"
publish = false
description = "RFC 0001 example: on_rules changes a type, on_frame orders a computer house"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
