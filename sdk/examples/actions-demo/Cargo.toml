[package]
name = "actions-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "RFC 0001 example: atomic and stock actions from Rust"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
