[package]
name = "ini-aura"
version = "0.1.0"
edition = "2024"
publish = false
description = "An INI-configured aura mod: the module registers INI names, the modder writes the auras"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
