; Control Bench: what the bench's map adds to XMP03T4.MAP. The map the
; bench plays, ControlBench.map, is the retail XMP03T4.MAP with these
; sections merged in (the engine test control_bench_reaches_every_mark
; makes it in the mod's folder). XMP03T4 has no TeamTypes: these are the
; triggers area's reinforcements (triggers/teams.rs), both for the player's
; house (Americans).

[TeamTypes]
0=BenchTeam
1=BenchChronoTeam

[BenchTeam]
Name=Bench reinforcement
House=Americans
TaskForce=BenchForce
Script=BenchScript
Waypoint=A
Max=5
Priority=5
TechLevel=0
VeteranLevel=1
Group=-1

[BenchChronoTeam]
Name=Bench Chrono reinforcement
House=Americans
TaskForce=BenchChronoForce
Script=BenchScript
Waypoint=A
Max=5
Priority=5
TechLevel=0
VeteranLevel=1
Group=-1

[TaskForces]
0=BenchForce
1=BenchChronoForce

[BenchForce]
Name=One Tank Destroyer
0=1,TNKD
Group=-1

[BenchChronoForce]
Name=One Sniper
0=1,SNIPE
Group=-1

[ScriptTypes]
0=BenchScript

; Guard where they stand (script action 5).
[BenchScript]
Name=Bench guard
0=5,0
