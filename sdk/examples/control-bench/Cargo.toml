[package]
name = "control-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "A benchmark mod: one module that reaches nearly every Wasm control point and logs a DEMO-OK mark for each"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
