; Control Bench: the INI the bench's module reads (INI registration and INI
; triggers). Each area keeps to its own block below.

; ------------------------------------------------------------- basics

; ------------------------------------------------------------- triggers
; An INI trigger (RFC 0001 "Binding a trigger to a type"): the Allied attack
; dog's tag reaches a trigger on Birth, whose module action is the crate's
; named action benchIniDog; the module creates one dog in its arena.
[ADOG]
Wasm.Tags=BenchTrigDogTag

[BenchTrigDogTag]
Trigger=BenchTrigDogBirth

[BenchTrigDogBirth]
Event=Birth
Where=Subject.HealthPercent>0
Action1=Wasm:benchIniDog(Subject,dog)
Repeat=Repeating
