[package]
name = "minimal-rules"
version = "0.1.0"
edition = "2024"
publish = false
description = "Feasibility module for RFC 0001: pays a house every 15 frames from Rust"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
