[package]
name = "playtest"
version = "0.1.0"
edition = "2024"
publish = false
description = "A rules.wasm to try in a skirmish: credits every 30 s, half damage for human players' basic units"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
