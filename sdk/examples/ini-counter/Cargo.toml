[package]
name = "ini-counter"
version = "0.1.0"
edition = "2024"
publish = false
description = "A demo mod: counters configured in INI (Demo.Counters) turn trained units into free rewards"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
