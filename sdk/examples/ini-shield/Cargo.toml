[package]
name = "ini-shield"
version = "0.1.0"
edition = "2024"
publish = false
description = "An INI demo mod: shields a modder sets up in rulesmd.ini through INI names the module registers"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
