; INI Shield: the INI a modder writes for the ini-shield module.
; A mod's rulesmd.ini replaces the retail one, so in a real mod add these
; sections to a full copy of rulesmd.ini (an existing section such as [HTNK]
; just gains the two keys).

; ---------------------------------------------------------- Shield types
; A registry the module registered: each entry names a section below.
[Demo.ShieldTypes]
0=HeavyShield
1=LightShield

; Strength = shield points, taken from the damage before the unit's health
; Regen    = points regained every 15 frames (one second at normal speed)
; Delay    = frames after the last hit before regeneration starts
[HeavyShield]
Strength=200
Regen=10
Delay=150

[LightShield]
Strength=60
Regen=5
Delay=90

; ------------------------------------------------------- Shielded units
; Demo.Shield= names a shield type; Wasm.Tags= gives the type the tag below.

; Allied
[E1]
Demo.Shield=LightShield
Wasm.Tags=DemoShieldTag

[GGI]
Demo.Shield=LightShield
Wasm.Tags=DemoShieldTag

[MTNK]
Demo.Shield=HeavyShield
Wasm.Tags=DemoShieldTag

[FV]
Demo.Shield=HeavyShield
Wasm.Tags=DemoShieldTag

[SREF]
Demo.Shield=HeavyShield
Wasm.Tags=DemoShieldTag

[SHAD]
Demo.Shield=LightShield
Wasm.Tags=DemoShieldTag

; Soviet
[E2]
Demo.Shield=LightShield
Wasm.Tags=DemoShieldTag

[FLAKT]
Demo.Shield=LightShield
Wasm.Tags=DemoShieldTag

[HTNK]
Demo.Shield=HeavyShield
Wasm.Tags=DemoShieldTag

[HTK]
Demo.Shield=HeavyShield
Wasm.Tags=DemoShieldTag

[APOC]
Demo.Shield=HeavyShield
Wasm.Tags=DemoShieldTag

; ---------------------------------------------------------- The trigger
[DemoShieldTag]
Trigger=DemoShieldRecharge

; When a unit's shield breaks, give it 40 shield points back at once.
[DemoShieldRecharge]
Event=Wasm:Demo.ShieldBroken
Action1=Wasm:restoreShield(Subject,40)
Repeat=Repeating
