[package]
name = "meteor-storm"
version = "0.1.0"
edition = "2024"
publish = false
description = "A playtest mod: meteors on ore fields, cells, timers and stock actions"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
