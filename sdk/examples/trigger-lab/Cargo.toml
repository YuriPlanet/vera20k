[package]
name = "trigger-lab"
version = "0.1.0"
edition = "2024"
publish = false
description = "A playtest mod: a tour of trigger events, polls and trigger options"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vera20k-sdk = { path = "../../rust/vera20k-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
