; IniAura: auras written in INI, implemented by rules.wasm.
; These sections go into a full copy of rulesmd.ini (Options > Mods > New Mod):
; add the keys under [MTNK], [HTNK], [E1] and [E2] to the sections already there.

[VeraWasm]
Api=1.0
Budget=200000

; The aura types (a registry the module registered).
[Demo.AuraTypes]
1=CommandAura
2=SlowField

; Allies, and the emitter itself, within 5 cells fire 25% harder.
[CommandAura]
Radius=5
Property=FirepowerMultiplier
Op=multiply
Value=1.25
Affects=allies
Interval=30

; Enemies within 6 cells move at 60% speed.
[SlowField]
Radius=6
Property=SpeedMultiplier
Op=multiply
Value=0.6
Affects=enemies
Interval=45

; Which types emit which auras (a key the module registered), and the tag
; that greets a unit when an aura first covers it.
[MTNK]
Demo.Aura=CommandAura,SlowField
Wasm.Tags=AuraHelloTag

[HTNK]
Demo.Aura=CommandAura,SlowField
Wasm.Tags=AuraHelloTag

[E1]
Demo.Aura=CommandAura
Wasm.Tags=AuraHelloTag

[E2]
Demo.Aura=CommandAura
Wasm.Tags=AuraHelloTag

[AuraHelloTag]
Trigger=AuraHello

; Demo.AuraEntered is an event the module registered and raises.
[AuraHello]
Event=Wasm:Demo.AuraEntered
Action1=SpawnAnim(Subject,RING1)
Action2=Wasm:auraHello(Subject,welcome)
Repeat=Repeating
