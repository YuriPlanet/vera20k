; INI Academy: the INI a modder writes for the ini-academy module.
; A mod's rulesmd.ini replaces the retail one, so in a real mod add these
; sections to a full copy of rulesmd.ini (an existing section such as
; [NABNKR] just gains the key).

; -------------------------------------------------------- Academy types
; A registry the module registered: each entry names a section below.
[Demo.AcademyTypes]
0=EliteAcademy
1=BootCamp

; Rank    = the rank a unit gets on entering: Rookie, Veteran or Elite
;           (default Elite); a unit already at that rank or above keeps it
; Allowed = the TechnoTypes that may be promoted, comma-separated;
;           empty or missing: any unit that can enter
; Eject   = yes: the building throws its occupants back out after a
;           promotion (default no)
[EliteAcademy]
Rank=Elite
Eject=yes

[BootCamp]
Rank=Veteran
Allowed=E1,E2,GGI
Eject=no

; ---------------------------------------------------------- Academies
; Demo.Academy= on a garrisonable building (CanBeOccupied=yes) names its
; academy type.

; Soviet Battle Bunker
[NABNKR]
Demo.Academy=EliteAcademy

; Civilian buildings
[CATEXS02]
Demo.Academy=EliteAcademy

[CAPRS03]
Demo.Academy=EliteAcademy

[CARUS03]
Demo.Academy=BootCamp

[CASTL04]
Demo.Academy=BootCamp

; -------------------------------------------------------- Graduation
; Demo.Promoted happens on the promoted unit (Other is the building).
[E1]
Wasm.Tags=AcademyTag

[E2]
Wasm.Tags=AcademyTag

[GGI]
Wasm.Tags=AcademyTag

[AcademyTag]
Trigger=AcademyGraduation

[AcademyGraduation]
Event=Wasm:Demo.Promoted
Action1=Wasm:academyHello(Subject,welcome)
Repeat=Repeating
