; IniCounter: the sections this demo adds to a mod's rulesmd.ini.
; A mod's rulesmd.ini replaces the game's whole file, so start from a full copy
; (Options > Mods > New Mod) and add these; put the Wasm.Tags lines into the
; existing [HTNK] and [MTNK] sections.

[VeraWasm]
Api=1.0

; ---------------------------------------------------------------- Counters
; A registry the module registers: each entry names a counter section.
[Demo.Counters]
1=SovietDraft
2=AlliedDraft

; While a Soviet house owns a radar, every 3 conscripts it trains earn it a
; free Rhino tank at its war factory. Stage=4 is for the demo: the module
; gives a computer house a radar, a war factory and 4 conscripts by itself.
[SovietDraft]
Count=E2
Threshold=3
Requires=NARADR
Reward=HTNK
Factory=NAWEAP
Houses=Russians,Confederation,Africans,Arabs
Stage=4

; The same for the Allies: GIs, the Air Force Command, a Grizzly tank.
[AlliedDraft]
Count=E1
Threshold=3
Requires=GAAIRC
Reward=MTNK
Factory=GAWEAP
Houses=Americans,Alliance,French,Germans,British
Stage=4

; ------------------------------------------------------------ INI triggers
; Every reward raises the object event Demo.RewardArrived on the new tank.
; An INI trigger hears it through the tank type's Wasm.Tags. The global event
; Demo.RewardGranted is heard by a trigger made in code: INI triggers are
; bound to the types that carry their tag, and a global event's trigger
; takes no binding.
[HTNK]
Wasm.Tags=DemoRewardTag

[MTNK]
Wasm.Tags=DemoRewardTag

[DemoRewardTag]
Trigger=DemoRewardArrived

[DemoRewardArrived]
Event=Wasm:Demo.RewardArrived
Action1=Wasm:onRewardArrived
Repeat=Repeating
