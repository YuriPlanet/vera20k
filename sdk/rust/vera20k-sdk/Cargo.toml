[package]
name = "vera20k-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for VERA20K simulation and client modules (rules.wasm, ui.wasm), RFC 0001 preview"

[lib]
path = "src/lib.rs"

[features]
default = ["panic-handler"]
# A no_std module needs a panic handler; turn this off when the module
# brings its own or uses std.
panic-handler = []
