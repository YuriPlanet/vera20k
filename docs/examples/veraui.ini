; A sample interface layout for VERA20k.
;
; Copy it into your mod's folder (Mods/<your mod>) as veraui.ini and start a
; match. docs/interface-layout.md explains every section and key.
;
; The Allies and the Soviets keep the original pictures and move a few parts:
; Repair and Sell trade places, Diplomacy and Options trade places, and the
; tabs run from right to left.
;
; Yuri gets a wider sidebar with three columns of build pictures and a top
; strip without its buttons. It needs wider pictures of your own to look
; finished: the original ones stay 168 wide.

[Layouts]
GDI=SwappedAllied
Nod=SwappedSoviet
ThirdSide=Roomy

[SwappedAllied]
Version=1

[SwappedAllied.Repair]
X=84

[SwappedAllied.Sell]
X=20

[SwappedAllied.Diplomacy]
X=83

[SwappedAllied.Options]
X=11

[SwappedAllied.Tabs]
X=113
Step=-29

[SwappedSoviet]
Version=1

[SwappedSoviet.Repair]
X=85

[SwappedSoviet.Sell]
X=33

[SwappedSoviet.Diplomacy]
X=86

[SwappedSoviet.Options]
X=14

[SwappedSoviet.Tabs]
X=116
Step=-32

[Roomy]
Version=1

[Roomy.Side]
Width=232

[Roomy.Top]
Parts=None

[Roomy.Cameos]
