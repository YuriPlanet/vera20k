; A sample interface layout for VERA20k.
;
; Copy it into your mod's folder (Mods/<your mod>) as veraui.ini and start a
; match. docs/interface-layout.md explains every section and key.
;
; The Allies keep the original pictures and mirror the screen: the sidebar is
; on the left and the command bar on top, Repair and Sell trade places,
; Diplomacy and Options trade places, and the tabs run from right to left.
;
; The Soviets get the sidebar along the bottom of the screen, its panels side
; by side: the radar, then Repair, Sell and the tabs, then two rows of build
; pictures.
;
; Yuri gets a wider sidebar with three columns of build pictures and a top
; strip without its buttons. It needs wider pictures of your own to look
; finished: the original ones stay 168 wide. His timers sit at the top right
; of the battlefield, and his tooltips stay in the bottom-left corner of the
; screen.

[Layouts]
GDI=Mirrored
Nod=Low
ThirdSide=Roomy

[Mirrored]
Version=1

[Mirrored.Side]
Hold=Left

[Mirrored.Bar]
Hold=Top

[Mirrored.Repair]
X=84

[Mirrored.Sell]
X=20

[Mirrored.Diplomacy]
X=83

[Mirrored.Options]
X=11

[Mirrored.Tabs]
X=113
Step=-29

[Low]
Version=1

[Low.Side]
Hold=Bottom
Height=160

; The money, the top buttons and the radar stay where they are: the first 168
; pixels of the band. The middle panel and the build pictures move beside
; them, each to the top of the band.
[Low.Middle]
X=168
Y=0

[Low.Cameos]
X=336
Y=0

[Low.Power]
X=336
Y=0

[Roomy]
Version=1

[Roomy.Side]
Width=232

[Roomy.Top]
Parts=None

[Roomy.Cameos]
Columns=3

; A box 140 tall at the top of the battlefield. The timers stack up from its
; bottom-right corner.
[Roomy.Timers]
Hold=TopRight
Y=8
Height=140

[Roomy.Tooltip]
Hold=BottomLeft
X=8
Y=8
