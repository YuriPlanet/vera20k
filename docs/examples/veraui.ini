; A sample interface layout for VERA20k.
;
; Copy it into your game folder as veraui.ini and start a match. It keeps the
; original pictures and moves a few parts: Repair and Sell trade places,
; Diplomacy and Options trade places, and the tabs run from right to left.
;
; docs/interface-layout.md explains every section and key.

[Layouts]
GDI=SwappedAllied
Nod=SwappedSoviet
ThirdSide=SwappedSoviet

[SwappedAllied]
Version=1

[SwappedAllied.Repair]
X=84

[SwappedAllied.Sell]
X=20

[SwappedAllied.Diplomacy]
X=83

[SwappedAllied.Options]
X=11

[SwappedAllied.Tabs]
X=113
Step=-29

[SwappedSoviet]
Version=1

[SwappedSoviet.Repair]
X=85

[SwappedSoviet.Sell]
X=33

[SwappedSoviet.Diplomacy]
X=86

[SwappedSoviet.Options]
X=14

[SwappedSoviet.Tabs]
X=116
Step=-32
