[package]
name = "vera20k"
version = "0.1.0"
edition = "2024"
description = "Vera20k Engine — a from-scratch Rust engine for Red Alert 2: Yuri's Revenge"
autobins = false
# Shipped as release builds (.github/workflows/release.yml), never on crates.io.
publish = false

# Main game client
[[bin]]
name = "vera20k"
path = "src/main.rs"

[[bin]]
name = "parity-digest"
path = "src/bin/parity-digest.rs"

# Release-build simulation tick benchmark at scale (see its module doc).
[[bin]]
name = "sim-bench"
path = "src/bin/sim-bench.rs"

[[bin]]
name = "mix-browser"
path = "src/bin/mix-browser.rs"
required-features = ["tools-ui"]

# Headless, JSON-emitting asset browser for automated callers.
[[bin]]
name = "asset"
path = "src/bin/asset.rs"

[[bin]]
name = "extract-ini"
path = "src/bin/extract-ini.rs"

[[bin]]
name = "bik-player"
path = "src/bin/bik-player.rs"
required-features = ["tools-ui"]

[[bin]]
name = "extract-bridge-frames"
path = "src/bin/extract-bridge-frames.rs"

[[bin]]
name = "inspect-water-tiles"
path = "src/bin/inspect-water-tiles.rs"

[features]
# Development builds carry the Ctrl+Shift dev chord. The release workflow builds
# with `--no-default-features`, so shipped binaries do not.
default = ["dev-overlays"]
# The Ctrl+Shift dev chord: renderer-native diagnostic overlays (grid, heightmap,
# pathgrid, inspector, fog), the debug pause and quicksave/quickload. Captures
# rely on it (literal Ctrl+Shift+M/N quicksave/quickload). It needs no egui.
dev-overlays = []
# Optional in-engine diagnostic overlay (egui panels). Player UI uses the retail
# UI owners. Implies `dev-overlays` so a dev build keeps its world overlays.
dev-ui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dev-overlays"]
# Standalone asset/video tools; this does not enable the engine overlay.
tools-ui = ["dep:eframe", "dep:rfd"]

[dependencies]
# --- GPU rendering ---
# Retain wgpu 27 for the optional diagnostic renderer's egui-wgpu 0.33.
wgpu = "27"
# winit 0.30 is the latest stable. 0.31 is still in beta.
# Uses the ApplicationHandler trait pattern (deferred window creation).
winit = "0.30"
# raw-window-handle + windows-sys let us clip the OS cursor to the game window
# with the Win32 ClipCursor API . That is reliable on frameless
# windows, where winit's CursorGrabMode::Confined mis-computes the clip rect and
# pins the pointer in place ("mouse won't move").
raw-window-handle = "0.6"
# `Win32_UI_WindowsAndMessaging` covers ClipCursor/GetClientRect;
# `Win32_Graphics_Gdi` adds ClientToScreen (maps the client rect into screen coords).
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
# pollster bridges wgpu's async initialization inside winit's sync event loop.
pollster = "0.4"
# bytemuck enables safe transmutation of structs to GPU-friendly byte slices.
bytemuck = { version = "1", features = ["derive"] }

# --- Optional development and standalone tool UI ---
egui = { version = "0.33", optional = true }
egui-wgpu = { version = "0.33", optional = true }
# default-features=false drops the `links` feature which pulls in webbrowser → url → icu crates
# that are currently incompatible with Rust 1.93+. We don't need egui hyperlink-opening.
egui-winit = { version = "0.33", default-features = false, optional = true }
# eframe is egui's standalone app framework — used by tool binaries (mix-browser GUI).
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
# Native file-open dialog — used by the bik-player binary.
rfd = { version = "0.14", optional = true }

# --- Math ---
# glam provides fast vector/matrix math for rendering (screen coords, camera).
glam = "0.29"
# Fixed-point arithmetic for simulation positions and other fixed-width mechanisms.
# Native floating-point mechanisms document their numeric contract at their owner.
fixed = { version = "1", features = ["serde"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
ron = "0.8"
# toml for config.toml parsing (game settings, asset paths).
toml = "0.8"

# --- Binary parsing ---
# nom parses RA2's binary asset formats (.mix, .shp, .vxl, .pal, .tmp, .hva).
# All parsers are written from scratch — no third-party RA2-specific crates.
nom = "7"
memmap2 = "0.9"

# --- Error handling ---
# thiserror for structured library errors (AssetError, RulesError, etc.)
thiserror = "2"
# anyhow for application-level error propagation (main.rs, app facade)
anyhow = "1"

# --- Logging ---
log = "0.4"
env_logger = "0.11"

# --- Parallel simulation work ---
# The persistent worker pool behind `sim::parallel::map`; its threads keep their
# thread-local search scratch between frames. Already in the lock via `image`.
rayon = "1.11"

# --- Image processing ---
# Used for texture atlas creation and debug image output, not for asset parsing.
image = "0.25"

# --- Crypto (for MIX archive header decryption) ---
# RA2 .mix files encrypt their file index with Blowfish. The key is RSA-encrypted.
# We use well-known RustCrypto/num crates — NOT any RA2-specific packages.
# Blowfish block cipher — decrypts the file index in RA2 .mix archives.
blowfish = "0.9"
# Big integer arithmetic — RSA modular exponentiation to extract the Blowfish key.
# Simpler than the full `rsa` crate since RA2 uses raw/textbook RSA (no PKCS padding).
num-bigint = "0.4"
num-traits = "0.2"

# --- Audio ---
# rodio is the standard Rust audio playback crate, maintained by the rust-audio org
# (same team behind cpal). Covers all RA2 needs: SFX, music, volume control.
rodio = "0.22"

# --- Unix saved-list timestamps ---
# Local time and the user's locale (src/util/native_file_time.rs). The
# lockfile already carries libc 0.2.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# --- macOS application icon ---
# macOS has no per-window icon; the Dock shows NSApplication's icon image, which
# `app::window_icon` sets at startup. These are the objc2 0.6 / AppKit 0.3 versions
# already in the lock (via arboard/glutin); default features are off because they
# enable every AppKit framework class.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[lints.clippy]
# A side effect inside `debug_assert!` vanishes from release builds. This
# hid every scheduler anim (wakes, explosions) in shipped binaries for weeks.
debug_assert_with_mut_call = "deny"
# Native ports keep gamemd's inputs explicit (the object, its rules and the
# world state the body reads) instead of bundling them into one-use structs.
too_many_arguments = "allow"

# --- Build speed ---
# Optimize all code at opt-level 1 in dev builds. The game rebuilds sprite
# instances, sorts them, and iterates over thousands of cells every frame —
# unoptimized Rust is 10-50x slower than opt-level 1.
[profile.dev]
opt-level = 1
# Emit line-table debuginfo only (keeps panic/backtrace line numbers) instead of
# full debuginfo. On Windows/MSVC, PDB generation dominates link time once codegen
# is cheap at opt-level 1, so this is the biggest safe build-speed win. Reversible;
# does not affect runtime behavior or lockstep determinism.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# `cargo test` inherits the dev profile (dependencies stay at opt-level 1) but
# compiles vera20k unoptimized. Measured on an M4 Mac mini on 2026-09-26:
# incremental lib test builds fell from 78-117 s to 24-59 s, while the full lib
# suite's run time rose from 12 s to 55-93 s. Run timing benchmarks with --release.
[profile.test]
opt-level = 0

# Published builds (.github/workflows/release.yml): whole-program optimization
# across every crate, compiled as one unit. It rebuilds everything for this
# profile and links slowly, so day-to-day timing and play stay on --release.
[profile.shipping]
inherits = "release"
lto = "fat"
codegen-units = 1
