name: Python tools

# Manual only: run it from the Actions tab or with
# `gh workflow run python-tools.yml --ref <branch>`.
# Cross-platform checks are maintainer-run and do not block pull-request merges.
on:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-test.txt
      # test_cargo_run resolves the locked dependency graph offline from Cargo's cache.
      - run: cargo fetch --locked
      - run: python -m tools.run_tests
      - run: python tools/skill_sync.py --check
