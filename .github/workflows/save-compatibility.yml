name: Player save compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: save-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-released-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target/owned-worktrees'
      - name: Install audio build dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Trace the production writer without test-support
        run: |
          python3 -m tools.cargo_run -- build --locked -p vera20k-core --no-default-features --bin snapshot-layout
          binary=$(python3 -m tools.cargo_run --resolve snapshot-layout --profile debug)
          layout=$("$binary")
          [[ "$layout" =~ ^[0-9]+$ ]]
          echo "VERA20K_STOCK_WRITER_LAYOUT=$layout" >> "$GITHUB_ENV"
      - name: Test the save menus, translations and released worlds
        run: >-
          python3 -m tools.cargo_run -- test --locked -p vera20k --no-default-features
          --lib app::persistence::resource_load::release_save_tests:: --
          app::persistence::save_write_tests:: ui::shell::saved_file_input::
          i18n::tests::shipped_languages_are_complete
