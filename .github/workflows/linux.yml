name: Linux

# Linux x86-64 (also what the Steam Deck runs).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Pull requests: one group per branch, superseded runs are cancelled.
  # main: one group per commit, so no run is ever cancelled or replaced
  # (GitHub keeps only one pending run per group) and the README status
  # badges always come from a finished run.
  group: linux.yml-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
