name: Linux

# Linux x86-64 (also what the Steam Deck runs).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux.yml-${{ github.ref }}
  # Cancel superseded pull-request runs only: every run on main finishes,
  # so the README status badges never show "cancelled".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
