name: Linux ARM

# Linux on ARM64 (Raspberry Pi 5, ARM servers, Asahi Linux).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-arm.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-24.04-arm
