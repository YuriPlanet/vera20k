name: macOS

# macOS on Apple Silicon (ARM64): the pinned golden values here also check cross-architecture determinism.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos.yml-${{ github.ref }}
  # Cancel superseded pull-request runs only: every run on main finishes,
  # so the README status badges never show "cancelled".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: macos-latest
