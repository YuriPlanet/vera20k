name: Windows ARM

# Windows on ARM64 (Snapdragon laptops).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-arm.yml-${{ github.ref }}
  # Cancel superseded pull-request runs only: every run on main finishes,
  # so the README status badges never show "cancelled".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: windows-11-arm
