name: WebAssembly

# An independent fourth build option, run by hand like the desktop workflows:
# no pull request starts it. Before a change to a file holding a browser switch
# (`feature = "wasm"` or `target_arch = "wasm32"`), run the wasm check in
# docs/wasm.md#checks locally.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [single-player, network, lan]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target/owned-worktrees'
      - name: Install matching browser binding tool
        run: |
          version=$(python3 -c 'import tomllib; lock = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build browser package
        env:
          WASM_MODE: ${{ matrix.mode }}
          WASM_PROFILE: wasm
        run: |
          if [ "$WASM_MODE" = lan ]; then
            python3 tools/wasm/build.py --profile "$WASM_PROFILE" --network --lan
          elif [ "$WASM_MODE" = network ]; then
            python3 tools/wasm/build.py --profile "$WASM_PROFILE" --network
          else
            python3 tools/wasm/build.py --profile "$WASM_PROFILE"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.mode == 'lan' && 'vera20k-wasm-lan' || matrix.mode == 'network' && 'vera20k-wasm-net' || 'vera20k-wasm' }}
          path: target/wasm-dist/
          if-no-files-found: error
