name: WebAssembly

# An independent fourth build option; existing desktop workflows are unchanged.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/owned-worktrees'
      - name: Install matching browser binding tool
        run: |
          version=$(python3 -c 'import tomllib; lock = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build browser package
        run: python3 tools/wasm/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: vera20k-wasm
          path: target/wasm-dist/
          if-no-files-found: error
