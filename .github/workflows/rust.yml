name: CI

# Runs what a fresh clone can run: no retail game data is available here, so
# tests that need the gitignored `ini/` print SKIPPED and pass. Maintainers run
# the full suite locally with `ini/` present before merging.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # rust-lld ships with rustup and links the large test binary much faster
  # than link.exe (the maintainer's checkouts use it too). Windows-only key.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

# Tests and lints run as separate jobs so they build in parallel. Each runs on
# all three platforms. Linux and macOS stay informational (continue-on-error)
# until they have been green for a while. The macOS runners are ARM64, the only
# non-x86 job, so its pinned golden values also check cross-architecture
# determinism.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: true
          - os: macos-latest
            experimental: true
          # ARM Linux and ARM Windows (free for public repos): more CPU/OS
          # combinations for the same pinned values. Tests only; lints do not
          # depend on the CPU, so the three clippy jobs cover them.
          - os: ubuntu-24.04-arm
            experimental: true
          - os: windows-11-arm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # About twice the slowest normal run (a cold-cache Windows build takes
    # ~21 min), so a hung test fails fast without false timeouts.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Library tests
        run: cargo test -p vera20k --lib

  lint:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: true
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # Clippy checks the binaries too, so it replaces a separate
      # `cargo check --bins` pass. It reports warnings without failing.
      - name: Clippy (library and binaries)
        run: cargo clippy -p vera20k --lib --bins
