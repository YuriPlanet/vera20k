name: Clippy

# Lints the library and binaries on the three main platforms (clippy also
# checks that the binaries compile, so there is no separate `cargo check`).
# Tests run in the per-platform workflows (windows.yml, linux.yml, ...).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  lint:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # Reports warnings without failing.
      - name: Clippy (library and binaries)
        run: cargo clippy -p vera20k --lib --bins
