name: Clippy

# Lints both libraries and the binaries on the three main platforms (clippy also
# checks that they compile, so there is no separate `cargo check`, and no binary
# can stop compiling unnoticed). The libraries' unit tests compile in the local
# full `cargo test --workspace --lib` run each change gets before it merges.
# Like the per-platform library tests, this is manual only. Run it from the
# Actions tab or with `gh workflow run rust.yml --ref <branch>`.
# Cross-platform checks are maintainer-run and do not block pull-request merges.
on:
  workflow_dispatch:

env:
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  lint:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # Reports warnings without failing.
      - name: Clippy (libraries and binaries)
        run: cargo clippy --workspace --lib --bins
