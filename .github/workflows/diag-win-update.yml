name: Diag Windows update

# Temporary: runs the Release workflow's failing "Update the newest release to
# this dev build" step from run 42857214415's artifacts, with a watcher that
# prints processes, memory and logs while it runs. Never merged.
on:
  push:
    branches: [feature/diag-win-update]

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Fetch the run's Windows installer and test programs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42857214415 --repo "$GITHUB_REPOSITORY" -n windows-x64 -D release
          gh run download 42857214415 --repo "$GITHUB_REPOSITORY" -n windows-x64-update-programs -D .
          tar -xf update-programs.tar
          ls -la release update-programs/newest-release update-programs/newest-release/installer
      # The Release workflow's two update-test steps, as it runs them.
      - name: Update the installed older build to this dev build
        shell: bash
        timeout-minutes: 8
        env:
          VERSION: '0.3.0'
        run: |
          set -euo pipefail
          release=(release/*)
          python -m tools.update_test run --key update-programs/key/signing-key.pem \
            --release "${release[0]}" --version "$VERSION" --program "update-programs/older/vera20k.exe"
      - name: What the first step left
        shell: bash
        run: |
          ls -laR "$LOCALAPPDATA/VERA20k" || true
          ls -la "$APPDATA/Microsoft/Windows/Start Menu/Programs" | grep -i vera || true
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9C9BFC32-A7B8-48ED-A428-72333354BDDB}_is1' || true
      - name: Update the newest release to this dev build, watched
        shell: bash
        timeout-minutes: 8
        env:
          VERSION: '0.3.0'
        run: |
          set -uo pipefail
          release=(release/*)
          installed=(update-programs/newest-release/installer/*)
          (
            python -u -m tools.update_test run --key update-programs/key/signing-key.pem \
              --release "${release[0]}" --installed "${installed[0]}" --version "$VERSION" \
              --program "update-programs/newest-release/vera20k.exe" --scenario update
            echo "### harness exit $?"
            touch step2.done
          ) &
          pwsh -NoProfile -File .github/diag/watch.ps1
          wait
