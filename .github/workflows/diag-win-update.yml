name: Diag Windows update

# Temporary: runs the Release workflow's failing "Update the newest release to
# this dev build" step from run 42857214415's artifacts, with a watcher that
# prints processes, memory and logs while it runs. Never merged.
on:
  push:
    branches: [feature/diag-win-update]

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Fetch the run's Windows installer and test programs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42857214415 --repo "$GITHUB_REPOSITORY" -n windows-x64 -D release
          gh run download 42857214415 --repo "$GITHUB_REPOSITORY" -n windows-x64-update-programs -D .
          tar -xf update-programs.tar
          ls -la release update-programs/newest-release update-programs/newest-release/installer
      - name: Update v0.2.9 to the dev build, watched
        shell: pwsh
        run: |
          $release = (Get-ChildItem release | Select-Object -First 1).FullName
          $installed = (Get-ChildItem update-programs/newest-release/installer | Select-Object -First 1).FullName
          $arguments = @('-u', '-m', 'tools.update_test', 'run', '--key', 'update-programs/key/signing-key.pem',
            '--release', $release, '--installed', $installed, '--version', '0.3.0',
            '--program', 'update-programs/newest-release/vera20k.exe', '--scenario', 'update')
          $harness = Start-Process python -ArgumentList $arguments -RedirectStandardOutput harness.out `
            -RedirectStandardError harness.err -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 150; $i++) {
            $os = Get-CimInstance Win32_OperatingSystem
            "=== $(Get-Date -Format HH:mm:ss) t=$($i * 4)s freeMB=$([int]($os.FreePhysicalMemory / 1024)) commitFreeMB=$([int]($os.FreeVirtualMemory / 1024)) procs=$((Get-Process).Count) harnessExited=$($harness.HasExited)"
            Get-Process | Where-Object { $_.ProcessName -match 'vera20k|setup|python|is-|unins' } | ForEach-Object {
              "  proc $($_.ProcessName) pid=$($_.Id) wsMB=$([int]($_.WorkingSet64 / 1MB)) cpu=$([int]$_.CPU) threads=$($_.Threads.Count) started=$($_.StartTime.ToString('HH:mm:ss'))"
            }
            Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 3 | ForEach-Object {
              "  top $($_.ProcessName) pid=$($_.Id) wsMB=$([int]($_.WorkingSet64 / 1MB))"
            }
            Get-Content harness.out -Tail 2 -ErrorAction SilentlyContinue | ForEach-Object { "  harness: $_" }
            Get-ChildItem $env:TEMP -Directory -Filter 'vera20k-update-test-*' -ErrorAction SilentlyContinue | ForEach-Object {
              Get-ChildItem $_.FullName -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
                "  --- $($_.FullName.Substring($env:TEMP.Length)) size=$($_.Length)"
                Get-Content $_.FullName -Tail 8 -ErrorAction SilentlyContinue | ForEach-Object { "      $_" }
              }
            }
            if ($harness.HasExited -and $i -gt 3) { break }
            Start-Sleep 4
          }
          "=== harness output"
          Get-Content harness.out, harness.err -ErrorAction SilentlyContinue
