name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.1.0
          ndk: 28.2.13676358

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate debug keystore
        run: |
          mkdir -p android/.android
          keytool -genkeypair -keystore android/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build native library (libvera20k_android.so)
        env:
          CARGO_PROFILE_SHIPPING_STRIP: symbols
        run: |
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build \
            --profile shipping -p vera20k-android --no-default-features

      - name: Configure local.properties and assemble debug APK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vera20k-android-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
