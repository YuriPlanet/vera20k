name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. android-v0.4.0-test)'
        required: true
        default: 'android-latest'
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK base
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK & NDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;28.2.13676358"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate debug keystore
        run: |
          mkdir -p android/.android
          keytool -genkeypair -keystore android/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build native library
        env:
          CARGO_PROFILE_SHIPPING_STRIP: symbols
        run: |
          # --platform 26 is required because AAudio links -laaudio introduced in API 26
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build \
            --profile shipping -p vera20k-android --no-default-features

      - name: Assemble debug APK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleDebug

      - name: Rename APK with tag/SHA
        id: apk_info
        run: |
          APK_SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          SAFE_TAG=$(echo "$TAG_NAME" | tr '/ ' '_')
          OUT_APK="vera20k-android-${SAFE_TAG}-${GITHUB_SHA::7}.apk"
          cp "$APK_SRC" "$OUT_APK"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_info.outputs.tag_name }}
          name: VERA20K Android (${{ steps.apk_info.outputs.tag_name }})
          files: ${{ steps.apk_info.outputs.apk_path }}
          make_latest: false
