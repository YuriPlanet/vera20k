name: Android ARM64 APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-android-apk.yml'
  workflow_call:
    inputs:
      release:
        description: Build an unsigned release APK for the signing job
        type: boolean
        required: true
      version_code:
        description: Android versionCode for this release build
        type: string
        required: true
      stamp:
        description: UTC build time from the Release workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Test builds and releases can run from main at the same time.
  group: android-apk-${{ inputs.release && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Match android/app/build.gradle.kts.
      NDK_VERSION: '28.2.13676358'
      BUILD_TOOLS_VERSION: '36.1.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK & NDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build native library
        env:
          CARGO_PROFILE_SHIPPING_STRIP: symbols
          VERA20K_COMMIT: ${{ inputs.release && github.sha || '' }}
        run: |
          # cargo-ndk otherwise picks the runner's default NDK. AAudio needs API 26.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build \
            --locked --profile shipping -p vera20k-android --no-default-features

      - name: Assemble and verify debug APK
        if: ${{ !inputs.release }}
        run: |
          mkdir -p android/.android
          keytool -genkeypair -keystore android/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ./android/gradlew -p android :app:assembleDebug
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          unzip -tq "$apk" lib/arm64-v8a/libvera20k_android.so
          mv "$apk" vera20k-android-arm64-debug.apk

      - name: Upload test APK
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: vera20k-android-arm64-debug.apk
          archive: false
          if-no-files-found: error

      - name: Fetch release notices
        if: inputs.release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-third-party-licenses
          path: android/app/src/release/assets

      - name: Assemble and verify unsigned release APK
        id: release
        if: inputs.release
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          STAMP: ${{ inputs.stamp }}
        run: |
          set -euo pipefail
          test "$VERSION_CODE" = "$(python3 .github/release/android/apk.py version-code "$STAMP")"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          assets=android/app/src/release/assets
          cp LICENSE-GPL "$assets/"
          sed -e "s/@VERSION@/$version/g" -e "s/@BUILD@/$STAMP/g" -e "s/@COMMIT@/$GITHUB_SHA/g" \
            .github/release/README.txt.in > "$assets/README.txt"
          ./android/gradlew -p android "-PveraVersionCode=$VERSION_CODE" :app:assembleRelease
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 .github/release/android/apk.py check-unsigned "$apk" --version "$version" --version-code "$VERSION_CODE"
          unzip -tq "$apk" assets/LICENSE-GPL assets/THIRD_PARTY_LICENSES.html assets/NOTICE-Android assets/README.txt
          mv "$apk" vera20k-android-arm64-unsigned.apk

      - name: Test release signing with a disposable certificate
        if: inputs.release && github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_SIGNING_PASSWORD: disposable-ci-password
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          signer=.github/release/android/apk.py
          cp "$signer" "$scratch/apk.py"
          keytool -genkeypair -keystore "$scratch/test.p12" -storetype PKCS12 -alias vera20k \
            -storepass:env ANDROID_SIGNING_PASSWORD -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=VERA20k disposable CI'
          keytool -exportcert -keystore "$scratch/test.p12" -alias vera20k -storepass:env ANDROID_SIGNING_PASSWORD \
            | sha256sum | cut -d' ' -f1 > "$scratch/certificate.sha256"
          args=(--version "$VERSION" --version-code "$VERSION_CODE")
          ANDROID_SIGNING_KEYSTORE="$(base64 < "$scratch/test.p12" | tr -d '\r\n')" \
            python3 "$scratch/apk.py" sign vera20k-android-arm64-unsigned.apk "$scratch/test.apk" "${args[@]}"
          python3 "$scratch/apk.py" verify "$scratch/test.apk" "${args[@]}"
          if python3 "$signer" verify "$scratch/test.apk" "${args[@]}" 2>"$scratch/official-check"; then
            echo '::error::The release verifier accepted the disposable certificate.'
            exit 1
          fi
          grep -F 'APK must have one signer matching the official Android certificate' "$scratch/official-check"

      - name: Upload unsigned APK for signing
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: vera20k-android-arm64-unsigned.apk
          if-no-files-found: error
