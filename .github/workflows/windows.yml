name: Windows

# Windows x86-64: the main development platform.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      os: windows-latest
