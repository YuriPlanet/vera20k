name: Android

# An independent fifth build option, like WebAssembly: the desktop workflows are
# unchanged and never compile this target. The check is not required; it reports
# a break on the pull request that caused it.
#
# Every action here is pinned to a commit. Four of them are the ones the other
# workflows already pin; `gradle/actions/setup-gradle` is the one addition, and
# it is pinned to the commit of its v6.4.1 tag. The Android SDK setup is shell
# rather than another third-party action, so nothing else has to be trusted.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'crates/vera20k-android/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'build.rs'
      - 'src/**'

# A new push to the same pull request replaces its unfinished run.
concurrency:
  group: android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A checkout-local SDK: the runner's image ships one, but not the platform,
      # build-tools and NDK versions this project pins.
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/28.2.13676358
      NDK_VERSION: '28.2.13676358'
      BUILD_TOOLS_VERSION: '36.1.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The runner image's default JDK is 17, which AGP 8.11 accepts; using it
      # keeps one more action out of the file.
      - name: Java
        run: java -version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # This workflow runs plain cargo from the repository root, so the
          # cache covers the default target directory.
          workspaces: '. -> target'
          # Pull requests read main's cache without evicting the long-lived ones.
          save-if: ${{ github.event_name != 'pull_request' }}

      # cmdline-tools 12 rather than the current 23: since 23 `sdkmanager` only
      # forwards to a self-bootstrapping `android` CLI that downloads its own
      # runtime on first use, which is extra network and an extra failure mode in
      # a build that only needs to install three packages.
      - name: Install the Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          local_sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$local_sdkmanager"
          yes | "$local_sdkmanager" --licenses > /dev/null || true
          "$local_sdkmanager" --install \
            "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          # The debug keystore lives in the checkout (build.gradle.kts points it
          # there), and AGP only generates one at the default location. keytool
          # does not create the git-ignored folder.
          mkdir -p android/.android
          keytool -genkeypair -keystore android/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # --platform 26 is required, not cosmetic: cpal's AAudio backend links
      # -laaudio, which exists only from API 26 in the NDK sysroot; cargo-ndk
      # otherwise links at its default level and fails.
      #
      # `fast` rather than `shipping`: shipping's fat LTO rebuilds the whole
      # workspace for this profile, which is minutes of runner time for an
      # artifact whose job is to prove the package builds and installs.
      - name: Native library
        run: |
          cargo ndk -t arm64-v8a --platform 26 \
            -o android/app/src/main/jniLibs \
            build --profile fast -p vera20k-android --no-default-features

      # Caches the Gradle distribution, the AGP/Kotlin dependencies and the
      # build outputs. Without it every run re-downloads the plugin graph.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Pull requests read main's cache without evicting the long-lived ones,
          # matching the rust-cache policy above.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # The import tests run on the JVM; no device or emulator is needed.
      - name: Assemble the APK and run the import tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Verify the package
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          # Android 15 requires 16 KB-aligned native libraries in the package.
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > /tmp/zipalign.log || { cat /tmp/zipalign.log; exit 1; }
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | grep -E 'package:|sdkVersion|native-code'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vera20k-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
