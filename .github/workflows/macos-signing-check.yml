name: Check macOS signing

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed main-branch Release run containing macos-unsigned
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: macos-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an existing trusted Release build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          run_id = os.environ["BUILD_RUN"]
          repository = os.environ["REPOSITORY"]
          if not run_id.isdecimal():
              raise SystemExit("Expected a numeric Release run ID.")
          run = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repository}/actions/runs/{run_id}"]))
          expected = {"path": ".github/workflows/release.yml", "event": "workflow_dispatch",
                      "head_branch": "main", "status": "completed"}
          if (any(run.get(key) != value for key, value in expected.items())
                  or run["repository"]["full_name"] != repository
                  or run["head_repository"]["full_name"] != repository):
              raise SystemExit("Only a completed main-branch Release build from this repository is allowed.")
          print(f"Checking Release build {run_id} at {run['head_sha']}")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned
          path: unsigned
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Sign and notarize the existing image without publishing
        shell: bash
        env:
          MACOS_SIGNING_KEYCHAIN: ${{ secrets.MACOS_SIGNING_KEYCHAIN }}
          MACOS_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          images=(unsigned/*.dmg)
          test "${#images[@]}" -eq 1
          name="$(basename "${images[0]}")"
          python3 .github/release/macos/notarize.py sign "${images[0]}" "ready/$name" \
            --records notarization --identity "$MACOS_SIGNING_IDENTITY" --team "$APPLE_TEAM_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-signing-check
          path: |
            notarization/*.json
            ready/*.dmg
          if-no-files-found: warn
