BRIEF:ALL03MD=Hiện tại chúng tôi đã phá hủy thành công nguồn thu nhập chính của Yuri, kẻ điên này đã quyết định thực hiện một cách tiếp cận trực tiếp hơn. Yuri đã thiết lập Hầm Tên Lửa Hạt Nhân ở Seattle và đang sử dụng nó để moi tiền và chuyên môn kỹ thuật của tập đoàn MassiveSoft. Chúng ta phải cứu thành phố và MassiveSoft khỏi mối đe dọa hạt nhân của Yuri.\n\nMục tiêu 1: Phá hủy Hầm Tên Lửa Hạt Nhân của Yuri\nMục tiêu 2: Giải phóng khuôn viên MassiveSoft
