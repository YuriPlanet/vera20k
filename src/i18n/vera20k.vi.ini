COOP:Camp11=Xô Viết đã xâm lược Texas! Chặn chúng lại.
COOP:Camp11v=Nhật ký Chỉ huy - Texas, Hoa Kỳ: Đơn vị đầu tiên của Xô Viết tiến vào Hoa Kỳ là Sư đoàn Súng trường Cơ giới số 2 của Nga. Chúng nhanh chóng thiết lập các căn cứ ở Nam Texas để từ đó có thể tấn công vào các tài sản chiến lược của Mỹ trên khắp miền Tây Nam. Lực lượng Mỹ nhanh chóng bị áp đảo và có vẻ như các sư đoàn Nga và Cuba sẽ chiếm tất cả các thành phố lớn ở miền Nam nước Mỹ. Chỉ có một số chỉ huy Mỹ cứng rắn cản đường.
COOP:Camp12=Lực lượng Xô Viết và Cuba đang tấn công vào Alabama. Phá hủy chúng.
COOP:Camp12v=Nhật ký Chỉ huy - Alabama, Hoa Kỳ: Trong tuần thứ 2 của cuộc chiến, mặc dù bị thua đậm, các lực lượng Xô Viết và Cuba đã cố gắng liên kết các chiến tuyến của chúng ở Alabama. Mặc dù các nguồn lực của chúng gần như cạn kiệt, các chỉ huy Mỹ vẫn cố gắng kháng cự quyết liệt.
COOP:Camp13=Lực lượng Cuba đã xâm lược Florida. Đẩy chúng trở lại biển.
COOP:Camp13v=Nhật ký Chỉ huy - Florida, Hoa Kỳ: Trong khi lực lượng Nga hoành hành khắp Miền Nam Cổ, các lực lượng Cuba nhanh chóng xâm chiếm Florida. Các cuộc tấn công đầu tiên của chúng đã thành công, tuy nhiên người Cuba đã vấp phải sự kháng cự tận gốc khi các chỉ huy của Mỹ tìm cách sản xuất được một số Xe Công Trình từ những kẻ chạy theo phong tỏa châu Âu.
COOP:Camp14=Lực lượng Xô Viết đe dọa Atlanta. Tìm và phá hủy cơ sở cung cấp của chúng.
COOP:Camp14v=Nhật ký Chỉ huy - Georgia, Hoa Kỳ: Vào tuần thứ 4 của cuộc chiến, các lực lượng Nga và Cuba đã tập trung tại vùng nông thôn của Gruzia. Nhiệm vụ của chúng rất đơn giản, thu thập tài nguyên, bổ sung cho hai sư đoàn Xô Viết bị hư hỏng nặng và sau đó hoành hành vào thành phố bất khả chiến bại Atlanta. Chính sách của Xô Viết rất rõ ràng, quân phản kháng phải bị trừng phạt và quân nổi dậy của Mỹ phải bị dạy cho một bài học. Trước khi Xô Viết sẵn sàng, một điệp viên Anh đã gửi thông báo về cuộc tấn công cho các chỉ huy Mỹ và trận chiến đã được tham gia.
COOP:Camp15=Xô Viết có một mạng lưới các căn cứ dọc theo biên giới Mexico. Tiêu diệt chúng để kết thúc chiến tranh.
COOP:Camp15v=Nhật ký Chỉ huy - Texas, Hoa Kỳ: Khi Xô Viết bị đẩy lùi khỏi Hoa Kỳ, những người sống sót cuối cùng trong trận chiến Texas đã vây hãm một pháo đài chiến đấu hùng mạnh của Nga ở biên giới Mexico. Từ căn cứ này, Xô Viết có thể thực hiện các cuộc không kích và hạt nhân vào sâu trong nước Mỹ. Căn cứ của Xô Viết phải bị phá hủy, bất kể giá nào.
COOP:Camp21=Đánh một đòn cho tự do, lực lượng của ngài ở Romania, tiêu diệt tất cả các lực lượng Xô Viết.
COOP:Camp21v=Nhật ký Chỉ huy - Đông Âu: Trong khi Xô Viết đang tấn công Mỹ, người châu Âu vẫn im lặng. Khi Xô Viết tấn công Chicago, người châu Âu cầu nguyện chiến tranh sẽ không đến bờ bến của họ, nhưng khi Xô Viết tấn công Paris, ngay cả người chỉ huy thận trọng nhất cũng biết rằng đã đến lúc chiến tranh. Đó là một lực lượng kết hợp của Pháp và Đức đã đánh đòn đầu tiên vào Đông Âu, do các chỉ huy châu Âu hiếu chiến nhất trên lục địa chỉ huy.
COOP:Camp22=Xô Viết đã phản công vào Đức. Ngài phải phòng thủ giữ vị trí.
COOP:Camp22v=Nhật ký Chỉ huy - Đông Âu: Mặc dù đạt được thành công ban đầu, quân Đồng minh sớm nhận ra mình bị bao vây tứ phía bởi các lực lượng cố thủ của Xô Viết. Các đơn vị Xô Viết nhanh chóng cắt đứt mọi cơ hội rút lui ở Romania và lực lượng viễn chinh Đồng minh buộc phải chiến đấu trở lại chiến tuyến hữu nghị.
COOP:Camp23=Ngài đã được lệnh giành quyền kiểm soát Biển Đen và các bến cảng của nó.
COOP:Camp23v=Nhật ký Chỉ huy - Romania: Khi nhiều tuần kéo dài tới hàng tháng, quân Đồng Minh mệt mỏi khi châu Âu một lần nữa trở thành chiến trường nghiệt ngã cho các quốc gia hùng mạnh nhất trên trái đất. Háo hức quyết chiến trước kẻ thù, quân Đồng Minh đã cử các chỉ huy giỏi nhất của họ đến Địa Trung Hải để giành quyền kiểm soát các thành trì quan trọng trên đảo và chuẩn bị các hạm đội lớn cho một cuộc tấn công vào Biển Đen.
COOP:Camp24=Trong một cuộc tấn công bất ngờ, lực lượng của ngài đã được gửi đến Ba Lan. Đè bẹp những người Xô Viết không phòng bị.
COOP:Camp24v=Nhật ký Chỉ huy - Ba Lan: Khi Xô Viết bị phân tâm bởi một cuộc đổ bộ lớn trên bờ biển của họ, các lực lượng Đồng minh đã nắm bắt cơ hội để thực hiện một cuộc tấn công thiết giáp lớn vào Ba Lan. Vào tháng thứ 4, quân Đồng minh dẫn đầu lực lượng của họ vượt sông Rhine vào đêm khuya giữa mùa đông, đánh chiếm hoàn toàn các căn cứ của Xô Viết một cách bất ngờ.
COOP:Camp25=Cuộc hành trình vào Nga đã bắt đầu. Lực lượng của ngài đang ở Ucraina và phải đối mặt với một Hồng quân tuyệt vọng.
COOP:Camp25v=Nhật ký Chỉ huy - Ucraina, Liên Bang Xô Viết: Với phần lớn châu Âu vẫn còn yếu trong trận chiến, hai chỉ huy châu Âu đã tự ý chấm dứt chiến tranh ở châu Âu bằng cách tấn công vào Trụ sở chính của Xô Viết bên trong biên giới Nga. Khi không có sự cho phép hoặc chấp thuận từ chính phủ của họ, những chỉ huy này tập hợp những lực lượng còn lại và đánh những gì họ hy vọng sẽ là đòn cuối cùng.
COOP:Camp31=Tiêu diệt toàn bộ lực lượng Xô Viết dọc Biển Nhật Bản.
COOP:Camp31v=Nhật ký Chỉ huy - Nhật Bản: Chính phủ Hàn Quốc giữ thái độ trung lập trong vài tháng đầu tiên của cuộc chiến cho đến khi một phóng viên Hàn Quốc biết được rằng Xô Viết đã sử dụng Công nghệ Ngoại cảm để kiểm soát tâm trí các thành viên chủ chốt của ban lãnh đạo Hàn Quốc. Câu chuyện xảy ra khi Hàn Quốc lâm vào chiến tranh, và các chỉ huy của họ phải chiến đấu ở hầu hết các quốc gia ở Viễn Đông. Cuộc tấn công đầu tiên đã khiến Xô Viết gần như hoàn toàn bất ngờ khi người Hàn Quốc chiến đấu dọc theo bờ biển Nhật Bản để giành ưu thế hải quân ở Thái Bình Dương.
COOP:Camp32=Bảo vệ Việt Nam khỏi sự xâm lược của Xô Viết.
COOP:Camp32v=Nhật ký Chỉ huy - Việt Nam: Khi Xô Viết tiếp tục lan rộng khắp Đông Nam Á, tiêu diệt các nước nhỏ cản đường chúng, Quân đội Hàn Quốc đã điều động hai sư đoàn đến Việt Nam để bảo vệ nó trước một lực lượng tấn công lớn của Xô Viết. Các chỉ huy Hàn Quốc phải đối đầu với địch đông hơn gấp hai và biết rằng chỉ có lãnh đạo cấp trên mới cứu họ khỏi thất bại nhất định.
COOP:Camp33=Đất nước quê hương của ngài, Hàn Quốc đang bị đe dọa, hãy bảo vệ vùng đất của ngài bằng bất cứ giá nào.
COOP:Camp33v=Nhật ký Chỉ huy - Hàn Quốc: Ba tuần sau khi tuyên chiến với Xô Viết, các chỉ huy Hàn Quốc phải đối mặt với cuộc xâm lược đất nước của họ bởi một bộ phận bí mật của Xô Viết được giấu kín khỏi mạng lưới tình báo của họ bằng công nghệ tâm linh mạnh mẽ. Sử dụng những lực lượng còn lại trong nước, người Hàn Quốc hành quân đến biên giới của họ và chuẩn bị để khiến Xô Viết phải trả giá cho từng tấc đất.
COOP:Camp34=Xâm lược vùng băng giá của miền đông nước Nga và phá hủy các căn cứ của Xô Viết.
COOP:Camp34v=Nhật ký Chỉ huy - Cáp Nhĩ Tân, Xô Viết: Với việc hầu hết các lực lượng Xô Viết ở Viễn Đông đã vô hiệu hóa hoặc tiêu diệt, Bộ Tư lệnh tối cao Hàn Quốc đã ra lệnh cho các tướng lĩnh của họ chiến đấu với kẻ thù và các lực lượng Hàn Quốc đã xâm chiếm vùng đất băng giá của miền Đông nước Nga.
COOP:Camp35=Hoàn thành cuộc xâm lược của ngài vào Siberia và phá hủy các cơ sở tiếp tế của Xô Viết, nơi cung cấp nhiên liệu cho nỗ lực chiến tranh.
COOP:Camp35v=Nhật Ký Chỉ Huy - Siberia, Liên Bang Xô Viết: Bất chấp tổn thất nặng nề về trận chiến và cái lạnh giá buốt, lực lượng tiến công Hàn Quốc không hề bị nản lòng và tiến nhanh đến các mỏ dầu ở phía đông Siberia. Với việc Xô Viết xâm lược ở Mỹ đang diễn ra kém hiệu quả và Đồng minh châu Âu đang tấn công vào nước Nga, người Hàn Quốc đã có một cơ hội duy nhất để giáng một đòn tê liệt vào cỗ máy chiến tranh của Xô Viết. Hàn Quốc đã có cơ hội tạo ra sự khác biệt rất lớn trong cuộc chiến tổng thể.
COOP:Camp41=Quân đoàn của ngài đã xâm lược Ý. Tiêu diệt tất cả những ai chống lại ngài.
COOP:Camp41v=Nhật ký Chỉ huy - Ý: Trong khi người Nga thuyết phục được một số tư lệnh ở lãnh thổ hạ lưu tham gia chính nghĩa của chúng, hầu hết chỉ tham gia vào cuộc chiến vì lợi ích của riêng họ. Đó là cơ hội cho nhiều quốc gia hạ lưu săn mồi các nước láng giềng, mở rộng biên giới và giành lấy các nguồn lực cần thiết để duy trì nền kinh tế đang thất bại của họ. Trong khi các lực lượng Xô Viết chiến đấu trên toàn cầu, Irắc và Libya đã nắm bắt cơ hội cho một cuộc xâm lược chung vào miền nam nước Ý. Chỉ có một số lực lượng Pháp và Anh đáng thương chống lại họ.
COOP:Camp42=Hy Lạp là mục tiêu tiếp theo của chúng tôi. Tiêu diệt bất kỳ quân Đồng minh nào dám chống lại cuộc chinh phục của chúng ta.
COOP:Camp42v=Nhật ký Chỉ huy - Hy Lạp: Khi người Anh và Pháp tập hợp lực lượng của họ tại dãy Anpơ, các lực lượng kết hợp của quân đội Irắc và Libya đã tấn công Hy Lạp. Quân đội Grecian bị quân địch đánh tràn vào chỉ trong vài ngày nhưng một lực lượng kết hợp của Pháp và Anh được đưa đến bằng thuyền từ Ấn Độ và Malaysia thuộc Pháp đã xoay sở để kháng cự.
COOP:Camp43=Người Pháp và Anh đã phản công ở Ý. Phá hủy các căn cứ tiên tiến của chúng.
COOP:Camp43v=Nhật ký Chỉ huy - Ý: Đường tiếp tế của chúng mở rộng quá lớn và quân đội của chúng rải rác khắp miền nam châu Âu, người Libya và Irắc rất dễ bị Đồng minh phản công. Trong tuần thứ 3 của cuộc chiến, quân Pháp và Anh tấn công, tấn công vào các cảng ở miền nam nước Ý trong nỗ lực cắt đứt các lực lượng Irắc khỏi các tuyến tiếp tế hải quân của chúng.
COOP:Camp44=Đồng minh đã nhảy vào vị trí Đồng Bằng Ấn - Hằng màu mỡ ngay bên ngoài Bátđa. Phá hủy chúng.
COOP:Camp44v=Nhật ký Chỉ huy - Irắc: Sau cuộc tấn công thất bại, quân Đồng minh đã thử một canh bạc tuyệt vọng cuối cùng vào tuần thứ 4 của cuộc chiến. Trong khi các đội cảm tử của Libya truy lùng quân Đồng minh trong vùng chiến sự ở Ý, thì người Anh và Pháp đã tận dụng lực lượng còn lại của chúng và thực hiện một cuộc không kích lớn ở lưu vực sông màu mỡ bên ngoài Bátđa, với hy vọng thiết lập các căn cứ để bao vây thành phố.
COOP:Camp45=Người Pháp đã xây dựng một pháo đài đồ sộ ở phía bắc Hy Lạp. Đây là điểm kháng cự cuối cùng.
COOP:Camp45v=Nhật ký Chỉ huy - Hy Lạp: Được hỗ trợ bởi lực lượng phòng thủ căn cứ của Pháp, quân Đồng minh đã xây dựng một pháo đài lớn trong thành trì cuối cùng còn lại của chúng ở phía bắc Hy Lạp. Quân Pháp và Anh đã cầm cự gần ba tuần trước khi quân đội Irắc và Libya cử các chỉ huy thiện chiến nhất của họ đến để tìm cách xuyên thủng hàng phòng ngự của Đồng minh.
COOP:Camp51=Tiêu diệt các hạm đội và căn cứ hải quân của Nga ở Biển Bắc.
COOP:Camp51v=Nhật ký Chỉ huy - Biển Bắc: Trong khi quân đội Xô Viết đang bận đánh tan sự kháng cự của Mỹ trên Biển Đông, Hải quân Xô Viết đã đánh một trận đẫm máu để vượt qua Bắc Đại Tây Dương và cung cấp vật tư và tiếp viện cho quân đội của họ. Các trận chiến đầu tiên diễn ra trên các hòn đảo nhỏ ở Biển Bắc, nơi các lực lượng Đồng minh kết hợp cố gắng kìm hãm các nhóm chiến đấu của Xô Viết và phá hủy bất kỳ căn cứ nào mà Xô Viết đã xây dựng.
COOP:Camp52=Xô Viết đã xâm lược Na Uy. Chúng ta phải cứu đồng minh này khỏi sự thống trị của Xô Viết.
COOP:Camp52v=Nhật ký Chỉ huy - Na Uy: Thành công ban đầu của Đồng minh đã thúc đẩy Xô Viết phản ứng tàn bạo ngay lập tức. Bị đe dọa bởi lực lượng hải quân vượt trội của Đồng minh, Xô Viết xâm lược các quốc gia trung lập như Thụy Điển và Na Uy để đưa ra yêu sách về các cảng nước ấm cho phép họ xây dựng các hạm đội lớn và tấn công bất cứ nơi nào dọc theo bờ biển phía bắc của châu Âu. Đồng Minh đã tập hợp các chỉ huy giỏi nhất của họ và chỉ với một số lực lượng nhỏ, đã gửi họ đến Na Uy để kìm hãm đám đông Xô Viết.
COOP:Camp53=Một căn cứ bí mật của Xô Viết đã được phát hiện ở quần đảo Anh. Hãy tiêu diệt nó trước khi quá muộn.
COOP:Camp53v=Nhật ký Chỉ huy - Quần đảo Anh: Khi Xô Viết trở nên tuyệt vọng hơn trong việc cung cấp tài liệu chiến tranh cho các đội quân thất bại của chúng ở Mỹ, chúng bắt đầu thử các phương tiện ranh ma hơn để phá vỡ sự phong tỏa của Đồng minh ở Bắc Đại Tây Dương. Vào tháng thứ 3 của cuộc chiến, một lực lượng nhỏ của Xô Viết đã bí mật đổ bộ lên miền bắc nước Anh và thiết lập một căn cứ. Vào thời điểm quân Đồng minh phát hiện ra sự hiện diện của Xô Viết thì đã gần như quá muộn.
COOP:Camp54=Xô Viết đã tràn vào Đức. Ngăn chặn bước tiến của chúng và tiêu diệt lực lượng của chúng.
COOP:Camp54v=Nhật ký Chỉ huy - Đức: Khi cuộc chiến bước sang tháng thứ 4, quân Đồng minh đã trở nên táo bạo và bắt đầu các cuộc tấn công lớn vào Ba Lan từ Áo, tấn công vào các căn cứ của Xô Viết và giải phóng hàng nghìn thường dân Ba Lan. Xô Viết phản ứng nhanh chóng với ba sư đoàn thiết giáp tràn vào miền đông nước Đức, cắt đứt những kẻ tấn công của quân Đồng minh. Trận chiến nhanh chóng biến thành một căn cứ hỗn loạn với các cuộc đấu tay đôi trong căn cứ, với kết quả chắc chắn sẽ thay đổi cục diện cuộc chiến ở châu Âu.
COOP:Camp55=Chiến thắng đã gần kề, phá hủy các căn cứ hải quân của Xô Viết ở Baltic để kết thúc cuộc chiến tranh giành Bắc Đại Tây Dương.
COOP:Camp55v=Nhật ký Chỉ huy - Biển Bắc Baltic: Chiến thắng này đến chiến thắng khác đã đưa quân Đồng minh tiến vào Bắc Baltic, nơi họ hy vọng sẽ phá hủy các căn cứ hải quân của Xô Viết vốn liên tục tăng cường hạm đội Bắc Đại Tây Dương của Xô Viết. Đồng Minh thửa ra một số lực lượng từ các nhóm phong tỏa của họ cho cuộc tấn công, khiến họ đông hơn ba chọi một với số lượng mà họ hy vọng sẽ là trận chiến cuối cùng của chiến dịch Bắc Đại Tây Dương.
MSG:PlanningModeMergeX=Bấm vào giao điểm này để hợp nhất những đơn vị đã chọn vào kế hoạch này. Những đơn vị được hợp nhất sẽ thực hiện mệnh lệnh sau khi hợp nhất giao điểm.
MSG:PlanningModeLoopX=Bấm vào giao điểm này để tạo một vòng tuần tra. Vòng tuần tra sẽ hành quân khi mà còn ít nhất một thành viên trong đoàn.
MSG:PlanningModeDeleteX=Chọn vào giao điểm này để chọn nó. Một giao điểm đã chọn có thể đã xoá khi sử dụng phím delete.
MSG:PlanningModeAlreadyInLoopX=Bấm vào giao điểm này để chọn nó.
