LoadBrief:British=Lính Bắn Tỉa của Anh có thể dễ dàng loại bỏ bộ binh của đối phương ở khoảng cách lớn.
LoadBriefShort:British=Anh có thể huấn luyện LÍNH BẮN TỈA.
LoadBrief:USA=Hoa Kỳ có những người lính dù giỏi nhất thế giới. Xây dựng Trạm Chỉ Huy Không Quân để thả lính dù ở bất cứ đâu trên chiến trường.
LoadBriefShort:USA=Mỹ có thể sử dụng LÍNH NHẢY DÙ.
LoadBrief:French=Đại Pháo của Pháp là loại súng phòng thủ tối tân, bắn ở tầm xa gây sát thương lớn.
LoadBriefShort:French=Pháp có thể xây dựng ĐẠI PHÁO.
LoadBrief:Germans=Pháo Diệt Tăng của Đức có thể dễ dàng loại bỏ các phương tiện của đối phương. Súng xuyên giáp tiên tiến của nó rất yếu trước bộ binh và công trình của đối phương.
LoadBriefShort:Germans=Đức có thể chế tạo PHÁO DIỆT TĂNG.
LoadBrief:Korea=Đại Bàng Đen là những tiêm kích chiến đấu nguy hiểm nhất trên thế giới. Các Lực lượng Hàn Quốc luôn được bảo vệ cẩn thận bởi những người phi công tử thần này và những chiếc máy bay chiến đấu-ném bom sát thương của họ.
LoadBriefShort:Korea=Hàn Quốc có thể chế tạo ĐẠI BÀNG ĐEN.
LoadBrief:Russia=Tăng Tesla của Nga bắn ra một loại Luồng Sét Tesla tầm ngắn có thể làm ngắt mạch điện xe của đối phương và thậm chí bắn xuyên qua các bức tường của đối phương.
LoadBriefShort:Russia=Nga có thể chế tạo TĂNG ĐIỆN TESLA.
LoadBrief:Cuba=Khủng Bố Cuba là một kẻ cuồng tín vì chính nghĩa của Xô Viết và thực sự sẽ mang một quả bom tới thẳng kẻ thù trước khi cho nổ nó, huỷ diệt bản thân và bất cứ thứ gì gần đó.
LoadBriefShort:Cuba=Cuba có thể huấn luyện KHỦNG BỐ.
LoadBrief:Lybia=Xe Tải Bom Libya đánh bom cảm tử vào mục tiêu của kẻ thù, nổ ra một quả bom hạt nhân cỡ nhỏ.
LoadBriefShort:Lybia=Libya có thể chế tạo XE TẢI BOM.
LoadBrief:Iraq=Hủy Diệt Binh Irắc có thể đầu độc đất liền bằng bức xạ độc hại hoặc tiêu diệt quân địch bằng Pháo Phóng Xạ mạnh mẽ của mình.
LoadBriefShort:Iraq=Irắc có thể huấn luyện HỦY DIỆT BINH
