Brief:Sov07md=Với hy vọng trốn khỏi sự tấn công dữ dội của anh, Yuri đã rút lui về quê hương của tổ tiên mình ở Transylvania. Chúng tôi không thể cho phép hắn ta có bất kỳ thời gian nghỉ ngơi nào hoặc hắn ta sẽ tập hợp lực lượng của mình và quay lại một lần nữa để đe dọa tất cả chúng ta. Loại bỏ Yuri ngay bây giờ và mãi mãi!\n\nMục tiêu 1: Phá hủy Pháo đài của Yuri.
