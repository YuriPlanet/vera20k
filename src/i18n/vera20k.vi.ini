GUI:UnderParMsgAll01md=Quyết định nhanh chóng của ngài khiến cả Xô Viết và Yuri mất cảnh giác. Cuộc xâm lược của Xô Viết vào San Francisco đã bị cản trở, và các kế hoạch của Yuri đã bị xáo trộn. Làm tốt lắm, chỉ huy.
GUI:OverParMsgAll01md=Mặc dù chúng tôi đã ngăn cản cả hai kế hoạch của Xô Viết và Yuri, nhưng dân thường của San Francisco đã phải chịu những thiệt hại khủng khiếp.
Name:All01md=Chiến dịch: Time Lapse (Dấu Mốc Thời Gian)
LoadMsg:All01md=Chiến Dịch: Time Lapse (Dấu Mốc Thời Gian) - Vị Trí: San Francisco, California
BRIEF:ALL01MD=Chỉ còn là vấn đề thời gian trước khi Yuri đưa Máy Thống Trị Tâm Linh ở Alcatraz trở lại hoạt động. Cơ hội duy nhất của chúng ta là sử dụng Cỗ Máy Thời Gian của Giáo sư Einstein để đưa chúng ta quay ngược thời gian và ngăn chặn Yuri trước khi hắn ta có thể hoàn thành mạng lưới Thống Trị Tâm Linh trên toàn thế giới của mình.\n\nMục tiêu 1: Chiếm lấy các nhà máy điện để cung cấp năng lượng cho Cỗ Máy Thời Gian\nMục tiêu 2: Bảo vệ Cỗ Máy Thời Gian\nMục tiêu 3: Phá hủy Máy Thống Trị Tâm Linh trên Alcatraz
