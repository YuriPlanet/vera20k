LoadBrief:All02md=Mục tiêu 1: Tiêu diệt tất cả các Máy Nghiền trong thành phố\nMục tiêu 2: Phá hủy tất cả các công trình của Yuri\n\nGợi ý: Không phải tất cả thường dân đều bị kiểm soát tâm trí. Một số người trong số họ thậm chí có thể giúp chúng ta trong trận chiến sắp tới
BRIEF:ALL02MD=Yuri đã kiểm soát tâm trí dân số của Los Angeles và đang đưa dân thường vào Máy Nghiền để tài trợ cho dự án Máy Thống Trị Tâm Linh. Nếu chúng ta có thể loại bỏ Máy Nghiền, Yuri sẽ mất một nguồn kinh phí đáng kể.\n\nMục tiêu 1: Tiêu diệt tất cả các Máy Nghiền trong thành phố\nMục tiêu 2: Phá hủy tất cả các công trình của Yuri\n\nGợi ý: Không phải tất cả thường dân đều bị kiểm soát tâm trí. Một số người trong số họ thậm chí có thể giúp chúng ta trong trận chiến sắp tới
