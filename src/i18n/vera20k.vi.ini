Brief:All04md=Yuri đã bắt được Einstein trong một nỗ lực để xúc tiến việc hoàn thành Công nghệ Thống Trị Tâm Linh của hắn. Chúng ta bắt buộc phải giải cứu Einstein ngay lập tức và sau đó loại bỏ tất cả các lực lượng Yuri khỏi Ai Cập\n\nMục tiêu 1: Phá hủy Lò Sinh Học xung quanh Đại Kim Tự Tháp để giải cứu Einstein.\nMục tiêu 2: Phá hủy căn cứ của Yuri.
GUI:UnderParMsgAll04md=Với tốc độ và sự chính xác của ngài, Einstein đã được giải cứu và sự sắp đặt của Yuri không còn nữa. Yuri nhận ra bây giờ ngài là một lực lượng phải được tính đến.
GUI:OverParMsgAll04md=Ngài đã giải cứu Einstein nhưng Yuri đã có thể rút các lực lượng chủ chốt trước khi căn cứ của ông ta bị phá hủy.
