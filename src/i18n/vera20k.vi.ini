Brief:Sov02md=Chúng tôi đã thua trận Rừng Đen lần đầu tiên và đã bị quân Đồng minh đánh bại với sự trợ giúp từ Cỗ Máy Thời Không của Einstein. Lần này, chúng ta không được thất bại. Phá hủy Khu Nghiên Cứu của Einstein và Cỗ Máy Thời Không để đảm bảo chiến thắng của Xô Viết trong cuộc chiến chống lại quân Đồng minh của chúng ta.\n\nMục tiêu 1: Tiêu diệt các tiền đồn bảo vệ biên giới Đức.\nMục tiêu 2: Phá hủy Khu Nghiên Cứu của Einstein và Cỗ Máy Thời Không.
