NAME:COOPDESC1=- Vùng phi quân sự Texas -\nĐây là trận người Mỹ đấu với Xô Viết ở Tây Nam Hoa Kỳ. Người chơi phải đẩy Xô Viết và đồng minh Cuba của chúng ra khỏi vùng đồng bằng Texas. Chiến dịch kết thúc với việc phá hủy một pháo đài của Nga ngay bên trong biên giới Mexico. Độ khó là DỄ.
NAME:COOPDESC2=- Chiến Trường Châu Âu -\nGõ cửa trước của Xô Viết ở Đông Âu. Người chơi lựa chọn giữa Đồng minh Anh, Pháp và Đức. Trận chiến kết thúc bằng một cuộc tấn công xuyên biên giới Nga vào một tiền đồn lớn của Xô Viết. Độ Khó là DỄ.
NAME:COOPDESC3=- Người bảo vệ phương Đông -\nHàn Quốc phải ngăn chặn sự xâm lược của Xô Viết ở Đông Nam Á. Chiến dịch lên đến đỉnh điểm với việc các lực lượng Hàn Quốc xâm chiếm bờ biển đầy tuyết ở miền đông nước Nga. Độ Khó là TRUNG BÌNH.
NAME:COOPDESC4=- Lãnh chúa châu Phi -\nChiếm giữ các mỏ dầu ở Bắc Phi. Người chơi điều khiển phe Irắc và Libya, chiến đấu với quân Đồng minh châu Âu. Độ Khó là TRUNG BÌNH.
NAME:COOPDESC5=- Cơn bão đỏ -\nNgười chơi chọn giữa Đồng minh Mỹ và Châu Âu để chiến đấu với người Nga ở Biển Bắc và khắp Bắc Âu. Chiến dịch kết thúc bằng trận hải chiến ngoạn mục trên vùng biển Baltic lạnh giá. Độ Khó là KHÓ.
