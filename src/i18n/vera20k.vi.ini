Brief:Error=Úi, không có thông tin cho nhiệm vụ này. Kiểm tra MISSION.INI và RA2.STR để biết các ví dụ về cách thực hiện việc này.
Brief:SOV01=Thật là may mắn khi anh được tham gia đội tiên phong trong cuộc tấn công của Xô Viết vào Hoa Kỳ. Dẫn quân của anh qua Washington và phá hủy biểu tượng bị ghét nhất của sức mạnh quân sự Mỹ, Lầu Năm Góc.\n\nMục tiêu 1: Phá hủy Lầu Năm Góc.
Brief:SOV02=Người Mỹ đã dại dột tập hợp một hạm đội tại một bến cảng nhỏ ở bờ biển phía đông Florida. Được hỗ trợ bởi Tướng Vladimir trong chiếc Thiết Giáp Hạm của mình, anh sẽ buộc phải đổ bộ vào bờ biển quân thù và thiết lập một căn cứ. Khi đã sẵn sàng, anh sẽ tấn công chống lại những con lợn tư bản và nghiền nát chúng dưới gót sắt của công lý Xô Viết.\n\nMục tiêu 1: Đổ bộ và thiết lập căn cứ.\n\nMục tiêu 2: Tiêu diệt toàn bộ quân địch.
Brief:SOV03=Để hoàn thành Máy Thâu Tóm Tâm Linh, chúng tôi sẽ cần nắm bắt một số công nghệ của Mỹ. Dẫn lực lượng của anh vào New York và chiếm Viện Khí Tài của chúng. Sau đó xây dựng một Máy Thâu Tóm Tâm Linh để kiểm soát thành phố.\n\nMục tiêu 1: Đánh chiếm Viện Khí Tài của Mỹ.\n\nMục tiêu 2: Xây dựng và bảo vệ Máy Thâu Tóm Tâm Linh.
Brief:SOV04=Những người Hàn Quốc khờ khạo đã quyết định đứng về phía quân Đồng minh đang thất bại. Âm mưu hèn nhát của chúng để xâm chiếm lãnh thổ phía Đông của chúng ta chắc chắn sẽ thất bại. Bảo vệ tổ quốc, và khi anh đã sẵn sàng, hãy đẩy người Hàn Quốc trở lại đại dương.\n\nMục tiêu 1: Thiết lập cơ sở. Bảo vệ tổ quốc.\n\nMục tiêu 2: Tiêu diệt toàn bộ quân địch.
Brief:SOV05=Các quốc gia châu Âu đang có kế hoạch tham gia với những người Mỹ què quặt. Chúng ta không được để hành động vi phạm này không bị trừng phạt. Anh sẽ phải hủy diệt Paris xinh đẹp của chúng. Chúng tôi sẽ cho quân Đồng minh thấy ý nghĩa thực sự của sức mạnh bằng cách biến những tượng đài quý giá của chính chúng thành vũ khí hủy diệt hàng loạt.\n\nMục tiêu 1: Cung cấp năng lượng cho THÁP PARIS với 3 LÍNH ĐIỆN TESLA.\nMục tiêu 2: Bảo vệ THÁP PARIS khỏi cuộc tấn công của quân Đồng minh.\nMục tiêu 3: Đánh bại tất cả quân Đồng minh còn lại.
Brief:SOV06=Người Mỹ quỳ gối cầu xin sự thương xót. Những tàn tích cuối cùng của hạm đội của chúng tại Trân Châu Cảng bất lực chờ đợi cuộc tấn công không ngừng của anh. Tuy nhiên, chúng tôi có tin tức rằng người Hàn Quốc vẫn chưa bị đánh bại và có thể tìm cách tham gia với Hải quân Mỹ. Nhất định không được để chúng thành công.\n\nMục tiêu 1: Thiết lập căn cứ ở Quần đảo Hawaii.\n\nMục tiêu 2: Tiêu diệt Hải quân Đồng minh.
Brief:SOV07=Người Mỹ đã sử dụng Cỗ Máy Thời Không của chúng; một thiết bị cho phép chúng di chuyển binh lính qua những khoảng cách xa hoặc gần ngay lập tức. Bây giờ chúng có thể tấn công bất cứ nơi nào chúng muốn. Anh phải bảo vệ Viện Khí Tài của chúng tôi ở vùng núi Ural. Người Mỹ chắc chắn sẽ sớm tấn công vào đó trong một nỗ lực tuyệt vọng nhưng không thể ngăn chặn sự phát triển của chúng ta về loại xe tăng chiến đấu tối tân.\n\nMục tiêu 1: Bảo vệ Viện Khí Tài bằng mọi giá.
Brief:SOV08=Ngay cả trong giờ phút chiến thắng vĩ đại nhất của chúng tôi, Tướng Vladimir đã quay lưng. Bị cám dỗ bởi lối sống đơn giản của người Mỹ, hắn ta đã trở nên bất hảo và thuyết phục nhiều người cộng sản trung thành quay lại chống lại chúng ta. Anh phải đến Washington DC và đào Vladimir ra khỏi cái hố khốn khổ của hắn.\n\nMục tiêu 1: Đánh chiếm Nhà Trắng.
Brief:SOV09=Chiến thắng của chúng ta đang ở gần trong tầm tay. Tổng thống đã tẩu thoát thành công, nhưng chúng tôi đã theo dõi ông ta đến một pháo đài nhỏ bẩn thỉu có tên là 'The Alamo' ở San Antonio, Texas. Anh phải sử dụng Đội quân Tâm Linh của chúng tôi để kiểm soát Tổng thống và buộc ông ta đầu hàng Hoa Kỳ.\n\nMục tiêu 1: Sử dụng Kiểm Soát Tâm Trí để bắt Tổng thống.
Brief:SOV10=Trong những giờ phút tuyệt vọng cuối cùng của chúng, quân Đồng minh đã cố gắng tạo ra một chút công nghệ siêu việt cuối cùng. Chúng có một Máy Kiểm Soát Thời Tiết có thể sử dụng để tạo ra những cơn bão khủng khiếp có thể đánh chìm các hạm đội và san bằng các thành phố. Chúng tôi tin rằng chúng đã giấu vũ khí ngày tận thế của chúng ở Quần đảo Virgin thuộc Hoa Kỳ bị cô lập.\n\nMục tiêu 1: Đánh chiếm Viện Khí Tài của Mỹ để xác định vị trí của Máy Kiểm Soát Thời Tiết.\n\nMục tiêu 2: Phá hủy Máy Kiểm Soát Thời Tiết.
Brief:SOV11=Yuri đã chống lại chúng tôi. Chỉ có một câu trả lời cho sự phản quốc đó.\n\nMục tiêu 1: Phá hủy trụ sở của Yuri - Điện Kremlin.
Brief:SOV12=Chúng tôi đã tìm thấy thành trì yếu ớt cuối cùng của quân Đồng Minh. Cỗ Máy Thời Không của chúng, hiện đã hoạt động hoàn toàn, có thể di chuyển quân đội đến bất kỳ đâu trên thế giới. Chúng có thể tấn công chúng tôi ở New York, ở Prague, thậm chí ở Mátxcơva. Hồ sơ của Yuri cho thấy thiết bị được đặt gần Point Hope, Alaska. Anh phải sử dụng những lực lượng ít ỏi mà chúng tôi có trong khu vực và dẫn đầu một cuộc tấn công, trước khi quân Đồng minh sử dụng công nghệ hèn nhát của chúng. Đây là thời khắc cuối cùng, chỉ huy. Vinh quang đang chờ đợi.\n\nMục tiêu 1: Phá hủy Cỗ Máy Thời Không.
Brief:ALL01=Xô Viết đã bắt đầu cuộc xâm lược. Chúng đông hơn ta gấp mười. Ngài phải hỗ trợ đặc vụ Tanya ở New York. Chúng tôi đang điều động quân đội nhanh nhất có thể, thưa Chỉ huy, nhưng chúng tôi cần thời gian. Một căn cứ nhỏ của Mỹ, Fort Bradley, tại New York. Nếu ngài có thể tiếp cận được, họ có thể hỗ trợ ta bảo vệ New York. Tanya sẽ băng qua một chiến trường hỗn loạn. Theo dõi các mục tiêu cơ hội và để mắt tới các mục tiêu nhiệm vụ mới.\n\nMục tiêu 1: Tiêu diệt hạm đội Thiết Giáp Hạm của Xô Viết.\n\nMục tiêu 2: Liên lạc với Fort Bradley.\n\nMục tiêu 3: Giữ cho Tanya sống sót.
Brief:ALL02=Quân đội Xô Viết bao trùm nước Mỹ như một bệnh dịch. Chúng thậm chí đã xâm nhập vào trung tâm của chúng tôi để đánh chiếm Học Viện Không Quân ở Colorado. Học viện, các học viên sĩ quan và công nghệ độc quyền mà nó chứa đựng rất quan trọng đối với quốc phòng của chúng ta. Sử dụng Tanya để liên lạc với bất kỳ lực lượng Mỹ nào trong khu vực, giành lại Học Viện Không Quân của chúng tôi và đánh đuổi Xô Viết khỏi khu vực.\n\nMục tiêu 1: Đánh chiếm Học Viện Không Quân do Xô Viết chiếm đóng.\n\nMục tiêu 2: Tiêu diệt toàn bộ lực lượng của Xô Viết.\n\nMục tiêu 3: Giữ cho Tanya sống sót.
Brief:ALL03=Xô Viết đã xâm lược Washington DC và sử dụng công nghệ tâm linh độc ác của chúng để kiểm soát tâm trí các nhà lãnh đạo của chúng ta. Ngài phải giải cứu họ bằng cách phá hủy Máy Thâu Tóm Tâm Linh gần Nhà Trắng.\n\nMục tiêu 1: Phá hủy Máy Thâu Tóm Tâm Linh.
Brief:ALL04=Lực lượng Xô Viết tiếp tục hoành hành trên khắp nước Mỹ. Các nhân viên của chúng tôi đã phát hiện ra Máy Khuếch Đại Tâm Linh lớn ở Chicago. Nếu được kích hoạt, thiết bị này sẽ cho phép Xô Viết kiểm soát toàn bộ Bắc Mỹ.\n\nMục tiêu 1: Đổ bộ vào bờ và thiết lập căn cứ.\n\nMục tiêu 2: Phá hủy Máy Khuếch Đại Tâm Linh trước khi nó được kích hoạt.
Brief:ALL05=Các lực lượng châu Âu vẫn từ chối chiến đấu với chúng tôi, vì lo sợ một cuộc phản công hạt nhân của Xô Viết. Chúng tôi đã phát hiện ra vị trí của các tên lửa tầm trung của chúng ở Ba Lan. Đặc vụ Tanya đã bí mật vượt biên giới Ba Lan. Ngài sẽ chỉ đạo cô ấy phá hủy tên lửa hạt nhân của Xô Viết.\n\nMục tiêu 1: Xâm nhập Viện Khí Tài của Xô Viết.\n\nMục tiêu 2: Vô hiệu hóa 2 Hầm Tên Lửa Hạt Nhân của Xô Viết.\n\nMục tiêu 3: Giữ cho Tanya sống sót.
Brief:ALL06=Người Châu Âu đã nhập cuộc với chúng tôi và đã đến lúc phản công. Chúng tôi sẽ chiếm lại Washington DC và sau đó sẽ chiếm lại phần còn lại của đất nước chúng tôi từ đám cặn bã Xô Viết.\n\nMục tiêu 1: Củng cố và nắm quyền chỉ huy các lực lượng Đồng minh tại Lầu Năm Góc.\n\nMục tiêu 2: Tiêu diệt toàn bộ lực lượng Xô Viết ở Washington.
Brief:ALL07=Xô Viết vẫn bao phủ hầu hết toàn cầu. Chúng ta phải tiếp tục chiến đấu với chúng cho dù chúng có thể ở đâu. Một hạm đội Xô Viết đã được phát hiện trên đường đến Hawaii. Tiêu diệt hạm đội này và Thái Bình Dương sẽ là của chúng ta.\n\nMục tiêu 1: Tiêu diệt toàn bộ lực lượng Xô Viết.
Brief:ALL08=Ngay cả khi chúng ta quét sạch nước Mỹ khỏi lực lượng Xô Viết, chúng vẫn tiếp tục chơi với công nghệ tâm linh của mình, tuyệt vọng khi hy vọng rằng những món đồ chơi nhỏ bé của chúng sẽ tiêu diệt được chúng ta. Chúng tôi đã phát hiện ra một Máy Thâu Tóm Tâm Linh ở St. Louis. Đưa đặc vụ Tanya vào và phá hủy Máy Thâu Tóm Tâm Linh.\n\nMục tiêu 1: Phá hủy Máy Thâu Tóm Tâm Linh của Xô Viết.\n\nMục tiêu 2: Tiêu diệt tất cả các lực lượng Xô Viết trong St. Louis.\n\nMục tiêu 3: Đừng để Tanya bị giết.
Brief:ALL09=Xô Viết đã chiếm được một trong những căn cứ bờ biển phía tây của chúng tôi và cùng với nó là một trong những Trụ Lăng Kính của chúng tôi. Chúng tôi tin rằng chúng có thể đang cố gắng tái tạo công nghệ đó tại một cơ sở nghiên cứu bí mật của Xô Viết ở Yucatan. Một đội Biệt Kích Seal đang túc trực, Chỉ huy, đang chờ lệnh của ngài.\n\nMục tiêu 1: Nắm bắt hoặc tiêu diệt bất kỳ nỗ lực nào của Xô Viết nhằm tái tạo Công nghệ Lăng Kính của chúng tôi.\n\nMục tiêu 2: Xóa sổ căn cứ Xô Viết đang bảo vệ điểm nghiên cứu của chúng.
Brief:ALL10=Thành công trong cơn tuyệt vọng, các lực lượng Xô Viết đã phản công các đồng minh Châu Âu của chúng tôi ở Đức, tiến sâu vào Rừng Đen. Không nghi ngờ gì nữa, các chỉ huy của chúng hy vọng rằng chúng sẽ tìm thấy và chiếm được Khu Nghiên Cứu của Einstein. Tài năng đặc biệt của ngài đã được yêu cầu. Người Đức sợ rằng họ sẽ bị đánh bại nếu không có kỹ năng chiến lược của ngài.\n\nMục tiêu 1: Đảm bảo an toàn cho Khu Nghiên Cứu của Giáo sư Einstein.\n\nMục tiêu 2: Tiêu diệt toàn bộ lực lượng của Xô Viết.
Brief:ALL11=Einstein đã tìm thấy một nơi hoàn hảo cho Cỗ Máy Thời Không của mình. Thật không may, vị trí này rất gần với Cuba do Xô Viết kiểm soát. Xây dựng Cỗ Máy Thời Không và dọn sạch khu vực có tên lửa hạt nhân của Xô Viết. Chúng tôi gần như đã sẵn sàng cho cuộc tấn công cuối cùng vào Mátxcơva.\n\nMục tiêu 1: Xây dựng một Cỗ Máy Thời Không.\n\nMục tiêu 2: Vô hiệu hóa mối đe dọa hạt nhân của Xô Viết ở Cuba.
Brief:ALL12=Chiến tranh sắp kết thúc. Một nhóm tình nguyện viên được chọn lọc sẽ sử dụng Cỗ Máy Thời Không để xâm lược Mátxcơva từ khắp nơi trên thế giới. Khi ngài đã dọn được điện Kremlin, Tanya sẽ bắt giữ Romanov và chấm dứt sự xâm lược của Xô Viết. Ngài là người chỉ huy duy nhất đủ kỹ năng để thực hiện công việc này. Lực lượng của địch sẽ đông hơn chúng ta ít nhất gấp mười lần. Chúc may mắn.\n\nMục tiêu 1: Dọn dẹp khu vực để Lực lượng Thời Không có thể đến.\n\nMục tiêu 2: Tiêu diệt Đội Cận Vệ Đen Tinh Nhuệ của Romanov xung quanh Điện Kremlin.
Brief:TRN01=Đây là đào tạo cơ bản. Hãy lắng nghe trung sĩ của bạn và làm theo lời anh ta.
Brief:TRN02=Đây là ngày cuối cùng của khóa đào tạo cơ bản của bạn. Thời gian không còn nhiều và Xô Viết có thể sẽ sớm tấn công. Hãy lắng nghe trung sĩ của bạn, tìm hiểu những gì trong khả năng và chuẩn bị cho chiến tranh.
