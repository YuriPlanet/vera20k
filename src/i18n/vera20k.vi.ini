GUI:UnderParMsgSov03md=Máy Thống Trị Tâm Linh đã bị phá hủy và quân Đồng minh tin rằng chúng ta đã chiến đấu vì lợi ích chung. Một lũ ngu.
GUI:OverParMsgSov03md=Máy Thống Trị Tâm Linh đã bị vô hiệu hóa, nhưng tôi nghi rằng liệu quân Đồng minh có chắc chắn sẽ giúp chúng ta một lần nữa.
LoadMsg:Sov05md=Chiến Dịch: Escape Velocity (Vận Tốc Thoát Hiểm) - Vị Trí: Một hòn đảo chưa được khám phá ở Thái Bình Dương
LoadBrief:Sov05md=Mục tiêu 1: Chọn bãi đáp và xây dựng căn cứ.\nMục tiêu 2: Xác định vị trí và phá hủy Bến Tàu Ngầm Yuri.\nMục tiêu 3: Kết liễu tất cả lực lượng Yuri còn lại.
