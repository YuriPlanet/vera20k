GUI:UnderParMsgALL01=Cuộc phản công chớp nhoáng của ngài đã dập tắt cuộc xâm lược của Xô Viết.
GUI:OverParMsgALL01=Ngài hầu như không thành công trong việc kìm hãm bước tiến của Xô Viết.
GUI:UnderParMsgALL02=Trận đấu tăng của ngài đã làm cho Xô Viết choáng váng, kết thúc trận chiến sau vài giờ ngắn ngủi.
GUI:OverParMsgALL02=Cuộc tấn công thô bạo của ngài đã tiêu tốn hàng trăm sinh mạng nhưng đã giải phóng Học Viện Không Quân.
GUI:UnderParMsgALL03=Tổng thống đã được giải cứu rất lâu trước khi Xô Viết có thể khám phá ra bất kỳ bí mật quân sự quan trọng nào.
GUI:OverParMsgALL03=Tổng thống đã được giải cứu, mặc dù nhiều bí mật quân sự đã bị xâm phạm.
GUI:UnderParMsgALL04=Sự mất mát bi thảm của Chicago, tuy có sức tàn phá khủng khiếp, không thể so sánh với sự mất mát của cả đất nước chúng ta. Việc ngài phá hủy Máy Khuếch Đại nhanh chóng có nghĩa là Xô Viết không bao giờ có thời gian để kiểm tra toàn bộ sức mạnh của nó.
GUI:OverParMsgALL04=Máy Khuếch Đại đã bị phá hủy, nhưng không phải trước khi Xô Viết thu được dữ liệu thử nghiệm có giá trị về tác dụng của nó. Tuy nhiên, bất chấp sự mất mát bi thảm của Chicago, ngài đã cứu toàn bộ đất nước của chúng ta khỏi bị ảnh hưởng bởi vũ khí tâm linh mạnh nhất của Xô Viết.
GUI:UnderParMsgALL05=Các chỉ huy Xô Viết vẫn đang phân tích cuộc tấn công của ngài, cố gắng khám phá bí mật của các chiến lược bí mật tiên tiến của ngài.
GUI:OverParMsgALL05=Các tên lửa đã bị phá hủy. Các tên lửa khác của Xô Viết đã được chuyển sâu vào bên trong Liên Xô.
GUI:UnderParMsgALL06=Độ chính xác mà ngài đã tiêu diệt lực lượng Xô Viết và giải phóng Washington DC đã nằm trong những cuốn sách kỷ lục.
GUI:OverParMsgALL06=Washington DC đã được cứu, nhưng với một cái giá khủng khiếp về nhân lực và vật chất.
GUI:UnderParMsgALL07=Ngài đã bảo vệ Trân Châu Cảng với sự tàn bạo đến mức Thái Bình Dương là của chúng ta.
GUI:OverParMsgALL07=Trân Châu Cảng đã được cứu, nhưng quần đảo Hawaii đã bị tàn phá bởi cuộc tấn công dữ dội của Xô Viết.
GUI:UnderParMsgALL08=Ngài đã cứu công dân Saint Luois trước khi có thêm nhiều thiệt hại nặng nề hơn.
GUI:OverParMsgALL08=Saint Louis đã được cứu, nhưng hàng ngàn công dân Mỹ đã vĩnh viễn quay sang chủ nghĩa Xô Viết.
GUI:UnderParMsgALL09=Những người lính Xô Viết đã đặt biệt danh cho ngài là "Bóng ma" vì kỹ năng của ngài trong nhiệm vụ phá hoại lén lút.
GUI:OverParMsgALL09=Nhờ ngài, công nghệ của chúng tôi đã được phục hồi.
GUI:UnderParMsgALL10=Ấn tượng với hiệu quả của ngài, các Chỉ huy Đức đã yêu cầu ngài đào tạo các sĩ quan của họ về chiến lược và chỉ huy.
GUI:OverParMsgALL10=Phòng thí nghiệm Rừng Đen đã được cứu, công việc của Einstein vẫn có thể tiếp tục.
GUI:UnderParMsgALL11=Các chỉ huy Nga sợ lệnh của ngài hơn toàn bộ các sư đoàn quân Đồng minh. Nếu một người đàn ông có thể tạo ra sự khác biệt, ngài là người đàn ông đó.
GUI:OverParMsgALL11=Cỗ Máy Thời Không đã được xây dựng. Nhờ nỗ lực không mệt mỏi của ngài, quân Đồng minh đã sẵn sàng cho một chiến thắng cuối cùng.
GUI:UnderParMsgALL12=Kỹ năng chỉ huy huyền thoại của ngài sẽ đi vào lịch sử. Ngài là một trong những vị tướng vĩ đại nhất mọi thời đại.
GUI:OverParMsgALL12=Romanov bị bắt, cuộc chiến đã kết thúc. Chiến thắng là của ngài.
GUI:UnderParMsgSov01=Lầu Năm Góc đã bị nghiền nát nhanh chóng đến nỗi nhiều tướng lĩnh quan trọng của Mỹ đã bị các chiến sĩ vinh quang của ta bắt sống, làm tê liệt lực lượng vũ trang của chúng.
GUI:OverParMsgSov01=Nhờ có anh, Lầu Năm Góc đã bị phá hủy và quân đội Mỹ rơi vào hỗn loạn.
GUI:UnderParMsgSov02=Hạm đội Mỹ và căn cứ Hải quân bị phá hủy nhanh chóng nên quân lính của anh có thể bắt sống một số sĩ quan Mỹ.
GUI:OverParMsgSov02=Hạm đội Mỹ bị tiêu diệt. Mặc dù thương vong của chúng ta rất cao, điều này không đáng lo ngại miễn là anh tiếp tục mang lại chiến thắng.
GUI:UnderParMsgSov03=Máy Thâu Tóm Tâm Linh được xây dựng nhanh chóng đến nỗi cả một sư đoàn Thiết giáp của Mỹ đã bị bắt giữ bởi sức mạnh của nó trước khi chúng kịp trốn thoát.
GUI:OverParMsgSov03=Anh đã truyền bá sức mạnh của Thủ tướng Romanov. Thường dân Mỹ đang háo hức gia nhập quân đội của chúng ta.
GUI:UnderParMsgSov04=Cuộc xâm lược của Hàn Quốc đã bị đẩy lùi với sự dữ dội đến mức một số thành viên trong chính phủ của chúng đã bí mật nói với chúng tôi về hòa bình.
GUI:OverParMsgSov04=Trong một trận chiến kéo dài và đẫm máu, anh đã bảo vệ thành công Đất Mẹ Nga.
GUI:UnderParMsgSov05=Người Pháp sợ lệnh của anh hơn là sợ xe tăng của chúng tôi. Ở Paris, anh chỉ được biết đến với cái tên 'Người bán thịt'.
GUI:OverParMsgSov05=Anh đã biến Tháp Paris trở thành vũ khí kinh hoàng. Anh đã 'trừng phạt' Châu Âu đủ nhiều.
GUI:UnderParMsgSov06=Các Đô đốc quân Đồng minh hiện từ chối gửi tàu của chúng ra khơi, vì anh phá hủy Trân Châu Cảng quá nhanh.
GUI:OverParMsgSov06=Người Hàn Quốc và người Mỹ đã bị chia cắt. Thái Bình Dương là của chúng ta.
GUI:UnderParMsgSov07=Sự hiệu quả đến tàn nhẫn của anh đã khiến đồng chí được Hồng quân kính trọng và khiến giới lãnh đạo Xô Viết lo sợ về sự nổi tiếng của anh.
GUI:OverParMsgSov07=Viện Khí Tài đã an toàn. Đồng minh sẽ không dám tấn công vào bên trong Đất Mẹ Nga một lần nữa.
GUI:UnderParMsgSov08=Hãy cẩn thận với những kẻ phản bội: Cuộc tấn công bất ngờ và chính nghĩa của anh vào Washington D.C. đã khiến các đối thủ phải lo sợ về kỹ năng chiến lược của anh.
GUI:OverParMsgSov08=Vladimir đã bị trừng phạt vì tội ác của mình. Chiến thắng của anh đã không được chú ý trong giờ khắc đen tối này.
GUI:UnderParMsgSov09=Các nhà lãnh đạo thế giới run sợ khi nhắc đến đội quân ngoại cảm của chúng ta. Với anh khi chỉ huy, không ai được an toàn.
GUI:OverParMsgSov09=Tổng thống bây giờ đã được chúng ta thao túng. Anh sẽ được thưởng cho sự nhiệt tình của mình.
GUI:UnderParMsgSov10=Kỹ năng chiến lược của anh đang trở thành huyền thoại. Những người lính công khai nói rằng chính đồng chí sẽ là người mang lại chiến thắng cho họ.
GUI:OverParMsgSov10=Quân Đồng minh không thể cầm cự lâu hơn trước các cuộc tấn công nặng nề của anh. Anh sử dụng tốt mạng sống của những người lính của anh.
GUI:UnderParMsgSov11=Tên của anh đã được học sinh biết đến như một vị tướng vĩ đại nhất mà thế giới từng biết.
GUI:OverParMsgSov11=Khả năng phòng thủ của Yuri rất yếu và yếu ớt. Sư đoàn xe tăng của anh đã quét hắn ta sang một bên trong khi anh đã quét qua rất nhiều người khác.
GUI:UnderParMsgSov12=Lịch sử sẽ ghi tên anh trong số những chỉ huy vĩ đại nhất từng sống. Bây giờ thế giới là của anh để cai trị.
GUI:OverParMsgSov12=Quân Đồng minh đã bị đánh bại và thế giới đang cầu xin được tha cho cuộc tàn sát của lực lượng vũ trang của anh. Quyền lực tối cao là của riêng anh.
