Brief:Sov04md=Máy bay của Thủ Tướng Romanov đã bị bắn hạ bởi lực lượng của Yuri. Chúng tôi phải xác định vị trí của Thủ tướng và đưa ông ấy đến sân bay để có thể được giải cứu. Yuri đã xây dựng một hàng phòng thủ chắc chắn xung quanh sân bay mà chúng tôi cần phải loại bỏ trước khi giải cứu Thủ tướng an toàn.\n\nMục tiêu 1: Xác định vị trí của Thủ tướng Romanov và bảo vệ ông ấy.\nMục tiêu 2: Phá hủy căn cứ của Yuri canh gác sân bay.\nMục tiêu 3: Đưa Romanov đến sân bay khi đã an toàn.
GUI:UnderParMsgSov04md=Thủ tướng Romanov đã được giải cứu và sơ tán an toàn nhờ anh nhanh chóng và dứt khoát loại bỏ căn cứ của Yuri.
GUI:OverParMsgSov04md=Thủ tướng Romanov đã được giải cứu và sơ tán an toàn nhưng ông không hề vui. Mất quá nhiều thời gian để anh giải cứu ông ấy.
