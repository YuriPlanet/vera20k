MISSION:YuriMove=CẢNH BÁO - Yuri đang cố gắng đánh chiếm lại các Nhà Máy Điện
GUI:UnderParMsgAll03md=Âm mưu tống tiền thành phố Seattle của Yuri đã bị ngăn cản. Phản ứng nhanh như chớp của ngài đã ngăn chặn thiệt hại nặng nề cho dân số. Yuri sẽ phải tìm nơi khác để tài trợ cho nỗ lực chiến tranh của mình.
GUI:OverParMsgAll03md=Mặc dù Yuri đã bị đuổi khỏi Seattle, thành phố đã phải trả giá đắt cho chiến thắng của ngài. Phần lớn Seattle bây giờ nằm trong đống đổ nát phóng xạ, và thị trường phần mềm rơi vào tình trạng hỗn loạn.
LoadMsg:All06md=Chiến Dịch: Trick or Treaty (Trò Lừa hoặc Hiệp Ước) - Vị Trí: Luân Đôn, Anh
LoadBrief:All06md=Mục tiêu 1: Bảo vệ Quốc hội khỏi cuộc tấn công.\nMục tiêu 2: Phá hủy căn cứ của Yuri.
Brief:All06md=Thất bại trong việc nhân bản các nhà lãnh đạo thế giới, Yuri lên kế hoạch bắt giữ những người thật. Bảo vệ họ tại Nhà Quốc hội ở London, Anh...sau đó đối phó với Yuri.\n\nMục tiêu 1: Bảo vệ Quốc hội khỏi bị tấn công.\nMục tiêu 2: Phá hủy căn cứ của Yuri.
MISSION:YuriTimer=Lực lượng Yuri đến trong:
MISSION:ParlHint=Gợi ý: Sửa chữa Quốc hội bằng một Kỹ sư
GUI:UnderParMsgAll06md=Yuri không bao giờ có cơ hội. Các nhà lãnh đạo thế giới được an toàn và Yuri đã bị đuổi khỏi Luân Đôn. Làm tốt lắm, Tướng quân.
GUI:OverParMsgAll06md=Ta chiến thắng...nhưng cái giá phải trả là gì? Các nhà lãnh đạo thế giới lo sợ cho tính mạng của họ trong trận chiến và bỏ chạy ngay từ đầu. Hiệp ước được giữ...cho đến bây giờ.
MISSION:StopYuri=Mục tiêu: Tiêu diệt toàn bộ lực lượng Yuri
MISSION:MixUnits=Gợi ý: Kết hợp bộ binh Xô Viết với Xe Chiến Đấu Bộ Binh của chúng ta để có các đơn vị mạnh hơn
MISSION:PDHint=Gợi ý: Hãy chia quân ra để Máy Thống Trị Tâm Linh sẽ không thể kiểm soát số lượng lớn quân đội của ta.
MISSION:GMHint=Gợi ý: Rải bộ binh của chúng tôi ra để Yuri không thể sử dụng Thiết Bị Biến Đổi Gen trên đám đông.
GUI:UnderParMsgAll07md=Giờ đây, cả thế giới đều biết đến tài năng thực sự của ngài với tư cách là một người chỉ huy. Hình ảnh của ngài sẽ xuất hiện trên tem ở mọi quốc gia trên toàn cầu và một ngày lễ trên toàn thế giới đã được tuyên bố để vinh danh ngài.
GUI:OverParMsgAll07md=Thế giới sẽ không bao giờ biết được rằng nó đã đến gần với sự hủy diệt hoàn toàn như thế nào. Hãy hy vọng chúng ta đã diệt được mọi bản sao cuối cùng của Yuri.
LoadBrief:Sov01md=Mục tiêu 1: Tiêu diệt Hải quân Đồng Minh và Đại Pháo.\nMục tiêu 2: Phá hủy Lô Cốt xung quanh Cỗ Máy Thời Gian để chiếm lấy nó.\nMục tiêu 3: Chiếm lấy 4 Nhà Máy Điện để cung cấp năng lượng cho Cỗ Máy Thời Gian.\nMục tiêu 4: Kiểm soát Căn cứ Xô Viết và sử dụng nó để phá hủy Máy Thống Trị Tâm Linh.
Brief:Sov01md=Thế giới đang bị hủy hoại. Yuri đã tự tin cai trị mà không bị thách thức. Chỉ có một kế hoạch táo bạo của quân Đồng Minh là du hành ngược thời gian về thời điểm đứng giữa Yuri và sự thống trị hoàn toàn. Nhưng Yuri phải trả giá cho sự phản bội của mình dưới tay Xô Viết chứ không phải là quân Đồng Minh. Chúng ta phải nắm bắt Cỗ Máy Thời Gian và du hành trở lại quá khứ.\n\nMục tiêu 1: Tiêu diệt Hải quân Đồng Minh và Đại Pháo.\nMục tiêu 2: Phá hủy Lô Cốt xung quanh Cỗ Máy Thời Gian để chiếm lấy nó.\nMục tiêu 3: Chiếm lấy 4 Nhà Máy Điện để cung cấp năng lượng cho Cỗ Máy Thời Gian.\nMục tiêu 4: Kiểm soát Căn cứ Xô Viết và sử dụng nó để phá hủy Máy Thống Trị Tâm Linh.
