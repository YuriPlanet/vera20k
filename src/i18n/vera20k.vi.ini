MISSION:DestroyYuri06S=Mục tiêu: Phá hủy tất cả các công trình còn lại của Yuri
Brief:Sov06md=Yuri dự định phóng lên Mặt Trăng sau khi bắt đầu làn sóng Máy Thống Trị Tâm Linh trên Trái Đất. Chúng ta cần lắp đặt một căn cứ trên Mặt Trăng để có thể xây dựng một lực lượng tấn công có khả năng phá hủy các căn cứ trên Mặt Trăng của Yuri và Trung Tâm Chỉ Huy Mặt Trăng của hắn.\n\nMục tiêu 1: Tìm vị trí để xây dựng căn cứ.\nMục tiêu 2: Xác định vị trí và phá hủy Trung Tâm Chỉ Huy Mặt Trăng của Yuri.\nMục tiêu 3: Phá hủy căn cứ còn lại của Yuri.
GUI:UnderParMsgSov06md=Anh di chuyển quá nhanh đến nỗi Yuri không thể làm gì khác ngoài việc nhìn cơ sở mặt trăng của mình sụp đổ. Mặt trăng bây giờ là một phần của nhà nước Xô Viết huy hoàng.
GUI:OverParMsgSov06md=Căn cứ mặt trăng của Yuri đã bị phá hủy. Xin chúc mừng, Tướng quân.
GUI:ParTitleSov06md=Cấp bậc của bạn là: Trung tá
Name:Sov07md=Chiến dịch: Head Games (Trò Chơi Trí Não)
GUI:ParTitleSov07md=Cấp bậc của bạn là: Đại tá
GUI:UnderParMsgAll02md=Làm tốt lắm, chỉ huy. Hành động dứt khoát của ngài đã giảm thiểu thiệt hại dân sự trong thành phố và làm Yuri bị mất một nguồn thu nhập quan trọng để tài trợ cho các kế hoạch của hắn ta. Các đại lý Hollywood đã cung cấp các giao dịch để nhượng quyền thương hiệu về câu chuyện cuộc đời của ngài.
GUI:OverParMsgAll02md=Yuri đã mất một nguồn kinh phí quan trọng, nhưng không phải là không phải trả một cái giá rất đắt đối với dân thường của Los Angeles.
