LoadMsg:Sov03md=Chiến Dịch: Brain Wash (Tẩy Não) - Vị Trí: Luân Đôn, Anh
LoadBrief:Sov03md=Mục tiêu 1: Phá hủy Máy Thâu Tóm Tâm Linh.\nMục tiêu 2: Phá hủy Máy Thống Trị Tâm Linh.\nMục tiêu 3: Kết liễu lực lượng của Yuri.
Brief:Sov03md=Quân Đồng minh đã phát hiện ra Máy Thống Trị Tâm Linh ở Luân Đôn, Anh. Yuri đã nắm quyền kiểm soát lực lượng chủ lực của quân Đồng Minh để hỗ trợ bảo vệ Máy Thống Trị sắp hoàn thiện của mình. Giải phóng quân Đồng minh và hợp lực với họ để đánh bại Yuri...nhưng hãy cẩn thận, Máy Thống Trị có thể hoạt động bất cứ lúc nào.\n\nMục tiêu 1: Phá hủy Máy Thâu Tóm Tâm Linh.\nMục tiêu 2: Phá hủy Máy Thống Trị Tâm Linh.\nMục tiêu 3: Kết liễu lực lượng của Yuri.
