NAME:COOPDESC11=Các căn cứ của Xô Viết ở Cuba là mối đe dọa đối với Lục Địa Hoa Kỳ nên chúng phải bị loại bỏ. Chỉ huy 1 sẽ nắm quyền kiểm soát Bộ chỉ huy Không quân bí mật của chúng tôi gần bờ biển. Chỉ huy 2 sẽ bảo vệ thành phố Havana.
NAME:COOPDESC12=Yuri đã tìm cách thiết lập được căn cứ ở Hollywood Hills. Chỉ huy 1 sẽ phụ trách khu vực xung quanh LAX. Chỉ huy 2 sẽ nắm quyền chỉ huy các cơ sở năng lượng và dầu mỏ ở phía đông xa lộ.
NAME:COOPDESC13=Bạn đã đẩy thành công Yuri và các đồng minh Nga của ông ta trở lại Liên Xô. Đã đến lúc phải kết liễu chúng, các Chỉ huy. Thiết lập căn cứ của bạn và kết thúc cuộc chiến này.
NAME:COOPDESC21=Người Mỹ tin rằng chúng có thể giữ Seattle. Đè bẹp các vị trí phòng thủ của chúng và để chúng ta tiến tới những trận chiến vinh quang hơn. Chỉ huy 1 sẽ nắm quyền chỉ huy lực lượng hải quân của chúng tôi, trong khi Chỉ huy 2 chuẩn bị cho một cuộc tấn công bằng bọc thép nghiền nát chúng.
NAME:COOPDESC22=Kẻ phản bội Yuri đang xây dựng lại lực lượng của mình trên sa mạc Ai Cập. Chỉ huy 1 sẽ phụ trách căn cứ cũ của chúng ta dọc theo sông Nin. Chỉ huy 2 phải bảo vệ các mỏ dầu của chúng ta ở phía nam tiền tuyến của Yuri.
NAME:COOPDESC23=Có vẻ như Rừng Đen của Đức sẽ là nơi an nghỉ cuối cùng của cả hai kẻ thù của chúng ta. Cả hai tìm đến khu nghiên cứu của Einstein trong vô vọng với hy vọng nó sẽ cho họ hy vọng sống sót. Tình báo đã xác định chính xác vị trí của các lò phản ứng hạt nhân chắc chắn phải cung cấp năng lượng cho phòng thí nghiệm của Einstein. Đảm bảo vị trí của bạn và sau đó tìm kiếm và tiêu diệt kẻ thù của nhà nước Xô Viết một lần và mãi mãi.
NAME:COOPDESC31=Đồng minh đã xây dựng hệ thống phòng thủ xung quanh Nhà Trắng quý giá của chúng. Chúng trốn đằng sau công nghệ của họ như những đứa trẻ sợ hãi. Thiết lập căn cứ của bạn và chấm dứt những nỗ lực vô tâm tội nghiệp của chúng để đẩy lùi chúng tôi.
NAME:COOPDESC32=Hồng quân đã tìm cách đánh cắp công nghệ Lăng Kính của quân Đồng minh và đang cố gắng phát triển phiên bản Trụ Lăng Kính của riêng họ tại một cơ sở nghiên cứu bí mật nằm sâu trong rừng rậm Yucatan. Chúng tôi sẽ phát động một cuộc tấn công bất ngờ vào căn cứ của chúng và dập tắt hy vọng chiến thắng cuối cùng của Xô Viết. Chỉ huy 1 sẽ bắt đầu ở phía bắc của một mỏ dầu nhỏ. Chỉ huy hai sẽ bắt đầu ngay phía đông của một sân bay địa phương.
NAME:COOPDESC33=Đồng minh và Xô Viết đã liên minh chống lại chúng tôi. Chúng đã tập hợp lực lượng cuối cùng của chúng ở London. Chỉ huy 1 sẽ điều khiển giàn khoan dầu của chúng ta trong thành phố và Chỉ huy 2 sẽ điều khiển bệnh viện bên kia sông Thames. Chiến thắng này sẽ đảm bảo quyền làm chủ thế giới của Yuri.
NAME:COOPDESC41=Trước cuộc xâm lược của Xô Viết, Yuri đã thành lập hai căn cứ ở trung tâm thành phố New York. Không còn chịu sự kiểm soát của Yuri, Hồng quân đã liên minh với người Mỹ để đánh bại kẻ phản bội.
