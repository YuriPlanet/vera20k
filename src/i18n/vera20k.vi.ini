GUI:UnderParMsgSov05md=Cuộc tấn công chớp nhoáng của anh sẽ giữ bí mật cho hòn đảo bí ẩn này mãi mãi. Lực lượng của Yuri đang rút lui hoàn toàn. Tiến lên nào, Tướng quân - Đánh bại Yuri!
GUI:OverParMsgSov05md=Các tàu ngầm của Yuri không còn là mối đe dọa nữa, nhưng cuộc vây hãm kéo dài của Anh đã giúp Yuri có nhiều thời gian để lập một kế hoạch ranh ma khác.
