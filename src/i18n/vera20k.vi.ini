MISSION:PowerAtk=CẢNH BÁO - Các Nhà Máy Điện đang bị tấn công!
MISSION:Virus=Gợi ý: Lính Bắn Tỉa có tầm bắn xa hơn Độc Xạ Thủ
MISSION:Virus2=Gợi ý: Độc Xạ Thủ có phạm vi xa hơn Lính Bắn Tỉa
MISSION:Cloud=CẢNH BÁO - Bộ binh sẽ bị thiệt hại nếu đứng trong làm khói độc dược
MISSION:LowPower=Đánh chiếm các Nhà Máy Điện để đưa Máy Điều Khiển Thời Tiết hoạt động
