Brief:All05md=Yuri đã thành lập cơ sở nhân bản ở Sydney, Australia. Người ta tin rằng hắn ta có kế hoạch nhân bản các nhà lãnh đạo thế giới. Chúng ta phải chấm dứt hoạt động này bằng bất cứ giá nào.\n\nMục tiêu 1: Tìm và phá hủy Lò Nhân Bản của Yuri.\nMục tiêu 2: Tiêu diệt lực lượng còn lại của Yuri.
GUI:UnderParMsgAll05md=Cơ sở nhân bản của Yuri giờ đã trở thành đống đổ nát nhờ vào chiến thuật đáng kinh ngạc của ngài. Làm tốt lắm!
GUI:OverParMsgAll05md=Ngài đã phá hủy cơ sở nhân bản của Yuri, nhưng trận chiến kéo dài đã khiến Sydney bị tàn phá.
Name:All07md=Chiến dịch: Brain Dead (Chết Não)
LoadMsg:All07md=Chiến Dịch: Brain Dead (Chết Não) - Vị Trí: Nam Cực
LoadBrief:All07md=Mục tiêu 1: Xây dựng một Tháp Ra Đa của Xô Viết.\nMục tiêu 2: Phá hủy Máy Thống Trị Tâm Linh ở Nam Cực.\nMục tiêu 3: Tiêu diệt tất cả lực lượng Yuri.
BRIEF:ALL07MD=Chiến tranh sắp kết thúc, thưa chỉ huy. Âm mưu của Yuri giờ chỉ còn là đống đổ nát. Tuy nhiên, hắn ta vẫn còn một Máy Thống Trị Tâm Linh cuối cùng nằm đâu đó trong thành trì của hắn ta ở Nam Cực. Đưa Căn cứ Xô Viết bị bỏ hoang trên Tierra del Fuego trở lại hoạt động và xây dựng một Tháp Ra Đa để chúng tôi có thể xác định chính xác vị trí của Yuri. Sau đó, với sức mạnh tổng hợp của các lực lượng quân Đồng minh và Xô Viết, chấm dứt kế hoạch của Yuri một lần và mãi mãi.\n\nMục tiêu 1: Xây dựng một Tháp Ra Đa của Xô Viết.\nMục tiêu 2: Phá hủy Máy Thống Trị Tâm Linh ở Nam Cực.\nMục tiêu 3: Tiêu diệt tất cả lực lượng Yuri.
