; 網路對局：結束對局的提示框。VERA20k 自身的錯誤，接著另起一段給出日誌檔案的位置（{path}）；需要較新版本 VERA20k 的遊戲伺服器（{url} 是下載頁面）；與線上遊戲伺服器的連線中斷。
VERA:MatchInternalError=VERA20k 遇到了內部錯誤，本局無法繼續。玩家之間並沒有出現不同步。
VERA:LogFileDetails=日誌檔案中有詳細資訊：\n{path}
VERA:MatchNeedsNewerVera=這場線上對局需要較新版本的 VERA20k。請從 {url} 下載。
VERA:FederationLost=遊戲伺服器之間的連線已中斷。本局已結束，無人獲勝。你可以回到大廳開始新的一局。
VERA:GameServerConnectionFailed=與 VERA20k 遊戲伺服器的連線失敗，本局無法繼續。
VERA:MatchStartMismatch=這場對局無法開始，因為你的遊戲與另一位玩家的不一致。請確認所有人都使用相同的 VERA20k 版本和相同且未經修改的遊戲檔案，然後重試。從啟動器開始的對局還需要所有人的地形變形和超級武器上限設定相同。
