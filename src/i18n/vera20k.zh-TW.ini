VERA:GraphicsAdviceLinux=它需要 Vulkan 驅動程式。請安裝你的發行版的 Vulkan 軟體包（例如 Debian 和 Ubuntu 上的 mesa-vulkan-drivers，Arch 上的 vulkan-radeon 或 vulkan-intel，或者 NVIDIA 自己的驅動程式），並更新你的顯示卡驅動程式。虛擬機器通常不支援 Vulkan。
