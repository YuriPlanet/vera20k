VERA:GameMenuUnavailable=無法載入遊戲選單
VERA:GameFilesNeededText=VERA20K 需要《紅色警戒 2：尤里的復仇》才能執行。\n\n{advice}\n\n遊戲檔案：{game_files}\n日誌：{log}
VERA:GameFilesAdviceWindows=1. 把 vera20k.exe 複製到你的《紅色警戒 2：尤里的復仇》資料夾中，然後從那裡啟動它。\n\n2. 或者在 config.toml 中設定 [paths] ra2_dir。config.toml 可以放在你啟動它時所在的資料夾中，也可以放在 vera20k.exe 旁邊：\n{config}
VERA:GameFilesAdviceUnix=請在配置檔案\n{config}\n中把 [paths] ra2_dir 設為你的《尤里的復仇》資料夾，也就是包含 ra2md.mix、ra2.mix 和遊戲其餘檔案的資料夾，然後重新啟動 VERA20K。
