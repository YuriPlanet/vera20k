VERA:SettingsFolderUnusableText=VERA20K 把 VERA.INI 儲存在設定資料夾中：\n{folder}\n\n但無法在那裡建立、寫入或讀取這個檔案。請確保該資料夾可以寫入，或者在 {config} 中把 [paths] settings_dir 設為一個你可以寫入的資料夾。\n\n日誌：{log}
; 找不到遊戲檔案，或者找到了部分檔案但無法載入遊戲選單時的標題，然後是正文；{advice} 是後面兩段建議之一：Windows 的一段，或 macOS 和 Linux 的一段。Windows 的步驟保留開頭的“1.”和“2.”。
