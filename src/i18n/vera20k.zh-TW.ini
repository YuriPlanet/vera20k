VERA:GraphicsAdviceWindows=它需要 DirectX 12 或 Vulkan。請從 NVIDIA、AMD 或 Intel 更新你的顯示卡驅動程式。虛擬機器和遠端桌面會話通常沒有這樣的驅動程式。
