; Los cuadros de mensaje del propio sistema cuando VERA20k se detiene o no
; puede iniciarse: cada título y luego su texto. {panic} es el error interno,
; {advice} el consejo gráfico para este sistema (uno de los tres que lo
; siguen), {error} el motivo y {log} la línea del registro: LogFileDetails, o
; NoLogFile cuando no hay registro.
