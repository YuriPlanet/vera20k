VERA:ConfigUnreadableText=VERA20K no ha podido leer su archivo de ajustes:\n{config}\n\nDebe ser texto sin formato guardado como UTF-8. Corrige el problema indicado abajo, o quita el archivo de ahí y vuelve a iniciar VERA20K sin él.\n\nRegistro: {log}
