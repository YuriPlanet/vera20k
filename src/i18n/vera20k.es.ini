VERA:GameFilesAdviceWindows=1. Copia vera20k.exe en tu carpeta de Red Alert 2: Yuri's Revenge e inícialo desde ahí.\n\n2. O define [paths] ra2_dir en config.toml, ya sea en la carpeta desde la que lo inicias o junto a vera20k.exe:\n{config}
VERA:GameFilesAdviceUnix=Haz que [paths] ra2_dir de\n{config}\napunte a tu carpeta de Yuri's Revenge, la que contiene ra2md.mix y ra2.mix con el resto del juego, y vuelve a iniciar VERA20K.
