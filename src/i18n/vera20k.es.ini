VERA:ModsFolderReadme=Los mods de VERA20K van en esta carpeta.\n\nCrea una carpeta para cada mod y pon dentro sus archivos, con los mismos nombres que en el juego original: rulesmd.ini, artmd.ini, expandmd50.mix, imágenes, modelos, sonidos y mapas.\n\nPara jugar con un mod, inicia el juego, abre Opciones, pulsa Mods, elige el mod y pulsa Usar este mod. Elige ahí Sin mod para jugar sin ninguno. Tu juego original nunca se modifica.\n\nMás información: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md
