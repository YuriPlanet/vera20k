VERA:SettingsFolderUnusableText=VERA20K guarda VERA.INI y VERARULES.INI en su carpeta de ajustes:\n{folder}\n\nNo ha podido crearlos, escribirlos ni leerlos ahí. Asegúrate de que se puede escribir en esa carpeta, o haz que [paths] settings_dir de {config} apunte a una carpeta en la que puedas escribir.\n\nRegistro: {log}
