VERA:GraphicsAdviceWindows=Necesita DirectX 12 o Vulkan. Actualiza el controlador gráfico de NVIDIA, AMD o Intel. Las máquinas virtuales y las sesiones de escritorio remoto a menudo no tienen ese controlador.
VERA:GraphicsAdviceMac=Necesita gráficos Metal. Actualiza macOS; las máquinas virtuales a menudo no admiten Metal.
VERA:GraphicsAdviceLinux=Necesita un controlador Vulkan. Instala los paquetes de Vulkan de tu distribución (por ejemplo, mesa-vulkan-drivers en Debian y Ubuntu, vulkan-radeon o vulkan-intel en Arch, o el controlador propio de NVIDIA) y actualiza tu controlador gráfico. Las máquinas virtuales a menudo no admiten Vulkan.
VERA:GraphicsLostTitle=El controlador gráfico se detuvo
VERA:GraphicsLostText=VERA20k tiene que cerrarse porque el controlador gráfico dejó de responder o se reinició. Actualizar el controlador puede ayudar.
