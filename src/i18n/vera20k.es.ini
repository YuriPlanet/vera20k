VERA:NoLogFile=No se ha podido escribir ningún archivo de registro.

; El cuadro al arrancar con el renderizador por software del sistema, que dibuja
; con el procesador cuando ninguna tarjeta gráfica y controlador sirven; el
; arranque sigue mientras se muestra. {adapter} es el nombre del renderizador,
; como Microsoft Basic Render Driver, y {advice} uno de los tres consejos
; gráficos de arriba.
VERA:SoftwareRendererTitle=VERA20k funcionará muy lento
VERA:SoftwareRendererText=VERA20k no ha encontrado ninguna tarjeta gráfica y controlador que pueda usar, así que dibuja con el procesador ({adapter}). El juego irá muy lento y puede tardar varios minutos en arrancar.\n\n{advice}

VERA:GraphicsApiRefusedTitle=VERA20k no ha podido iniciarse con {api}
