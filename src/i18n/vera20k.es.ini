; VERA20k Online: los mensajes de chat propios del lobby, de VERA20k y del
; matchbot (docs/lobby-protocol.md). El lobby envía la clave y los valores de
; cada frase, y su inglés en vera20k.en.ini debe coincidir exactamente con el
; del propio lobby. Las frases se unen con Sentences; las listas, con los
; patrones ListAnd ("a, b y c": dos elementos, luego cada uno antes de los dos
; últimos y luego los dos últimos) y ListUnit ("a, b, c"). {side} es un equipo
; (Team) o el nombre de un jugador, {os} una puntuación, {badge} una insignia
; (los nombres LobbyBadge de arriba), {reason} por qué una partida no es
; clasificatoria o no se ha puntuado (las frases Unranked, NotRated y Capped) y
; {when} InMinutes o InAboutHours.
VERA:LobbySentences={first} {second}
VERA:LobbyListAndPair={first} y {second}
VERA:LobbyListAndMiddle={first}, {second}
VERA:LobbyListAndEnd={first} y {second}
