; El texto de README.txt en la carpeta Mods. Deja como están los nombres de archivo, [paths], config.toml y la línea mod =, salvo las palabras entre comillas.
VERA:ModsFolderReadme=Los mods de VERA20K van en esta carpeta.\n\nCrea una carpeta para cada mod y pon dentro sus archivos, con los mismos nombres que en el juego original: rulesmd.ini, artmd.ini, expandmd50.mix, imágenes, modelos, sonidos y mapas.\n\nPara jugar con un mod, añade esta línea debajo de [paths] en config.toml e inicia el juego:\n\nmod = "el nombre de la carpeta"\n\nQuita la línea para jugar sin mod. Tu juego original nunca se modifica.\n\nMás información: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md

