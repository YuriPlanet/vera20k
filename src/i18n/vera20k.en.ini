; VERA20k's own interface text, English. Every VERA: label lives here first;
; other languages translate it in vera20k.<language>.ini. See src/i18n/mod.rs.
; README.md in this folder explains how to translate. When you add or reword a
; line here, change it in every other language file in the same pull request.

