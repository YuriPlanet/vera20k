; Main menu: VERA's Language button and its status-line help. The Options
; page's Language list uses them too; its rows are each language's own name.
VERA:Language=Language
VERA:LanguageHelp=Choose the language of the menus, the battle text and the game's own text.
; The main menu's notice when the Options page's artwork is missing.
VERA:OptionsArtworkMissing=Could not load the retail Options artwork.

; Options: VERA's own captions, then their status-line help.
VERA:Zoom=Zoom
VERA:ZoomHelp=How big battles look. Auto picks the best size for your screen.
VERA:Display=Display
VERA:DisplayHelp=Which screen the game opens on. Auto follows the system.
VERA:HouseColorStrength=Team Color Strength
VERA:HouseColorStrengthHelp=How strongly team colours stand out, from 1 for the original bands to 10 for the boldest. The next battle uses it.
VERA:FullScreen=Full Screen
VERA:FullScreenHelp=Fill the whole screen. Untick it to play in a window.
VERA:OriginalShape=Original 4:3 Shape
VERA:OriginalShapeHelp=Battles keep the original 4:3 shape, with bars on wide screens.
VERA:RenderInterpolation=Render Interpolation
VERA:RenderInterpolationHelp=Smooth motion between simulation frames. Adds one frame of visual latency; does not increase simulation speed.
VERA:YrOriginalStyle=Original YR Style
VERA:YrOriginalStyleHelp=Use Yuri's Revenge's loading screen and menu movie, plus the Skirmish and multiplayer lobby backgrounds.
VERA:ShiftQueue=Shift-Click Batch Queue
VERA:ShiftQueueHelp=Unit cameos: Shift-click queues several, Ctrl-click builds endlessly, Alt-click builds next, Shift-right-click cancels all.
VERA:CustomEndGameBanner=Custom End Game Banner
VERA:CustomEndGameBannerHelp=Show the victory or defeat picture a rules set gives your country over the battlefield, and start its music with it. Untick to keep the standard banner and theme.
VERA:CustomEndGameScore=Custom End Game Score
VERA:CustomEndGameScoreHelp=Use the same country picture as the score screen's background and its music as the score theme. Untick to keep the standard score screen.
VERA:CustomEndGameMovie=Custom End Game Movie
VERA:CustomEndGameMovieHelp=Let a beaten computer commander's losing clip finish before the victory or defeat picture and the score screen. Skirmish only. Untick to show them at once, which cuts the clip.
VERA:Sidebar=Sidebar
VERA:SidebarHelp=How big the sidebar and bottom bar are in battles.
VERA:HealthBars=Health Bars
VERA:HealthBarsHelp=When units show a health bar. Original is the hovered unit and the selection; All Units shows every unit you can see; All Units, Not Full hides the full-health ones.
VERA:VeraIcon=VERA Icon
VERA:VeraIconHelp=Show VERA's own icon instead of Red Alert 2's red star on the game window, taskbar and Dock.
VERA:HdRadar=HD Radar
VERA:HdRadarHelp=Draw the radar at the screen's full resolution when the sidebar is enlarged, so each map cell shows.
VERA:SmoothSidebar=Smooth Sidebar
VERA:SmoothSidebarHelp=Lightly smooth the sidebar's pictures and buttons with xBR when the sidebar is enlarged. Text stays sharp.
VERA:HdMapPreviews=HD Map Previews
VERA:HdMapPreviewsHelp=Show a sharp picture of the whole map in Skirmish, LAN and online games, drawn the first time each map is shown. Untick for the map's own small preview.
VERA:OriginalFont=Original Font
VERA:OriginalFontHelp=Draw text in the game's own pixel font, scaled evenly. Characters it lacks still use the new fonts.
VERA:RightClickOrders=Right-Click Orders
VERA:RightClickOrdersHelp=Left-click to select; right-click to give orders.
VERA:MouseWheelZoom=Mouse Wheel Zoom
VERA:MouseWheelZoomHelp=Use the mouse wheel to zoom battles in or out. Turning this off restores the normal view distance.
VERA:LockCursor=Lock Cursor to Window
VERA:LockCursorHelp=Keep the mouse inside the game window. Ctrl+Alt+L frees it until you click in the game.
VERA:FpsCounter=FPS Counter
VERA:FpsCounterHelp=Show frames per second in the top-left corner. Off at every start; Ctrl+Alt+F also switches it.
VERA:SkipIntro=Skip Intro
VERA:SkipIntroHelp=Start straight at the main menu, without the logo, the splash picture or the first-start intro movie. Applies at the next start.
VERA:WolTestService=Offline Internet Test Service
VERA:WolTestServiceHelp=Internet opens with stand-in servers, lobbies and players, for testing its screens.
VERA:CheckForUpdates=Check for Updates
VERA:CheckForUpdatesHelp=Check for a newer VERA20K now, even one you skipped.
