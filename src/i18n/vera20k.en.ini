; VERA20k's own interface text, English. Every VERA: label lives here first;
; other languages translate it in vera20k.<language>.ini. See src/i18n/mod.rs.

[Strings]
; Multiplayer shared pause (Options menu button and window status line).
VERA:PauseAllPlayers=Pause All Players
VERA:ResumeAllPlayers=Resume All Players
VERA:Pausing=Pausing...
VERA:Resuming=Resuming...
VERA:PauseRequested=Pause requested - waiting for the relay
VERA:ResumeRequested=Resume requested - waiting for the relay
VERA:FinishingPause=Finishing the shared pause frame
VERA:PausedForAllPlayers=Paused for all players - Pause or Options to resume
VERA:ReturnToGame=Return to Game

; Network recovery (window status line).
VERA:Reconnecting=Reconnecting - waiting for connection; Quit to leave
VERA:ReconnectPassLapsed=Reconnecting - VERA20k Online cannot renew this match's game server pass; Quit to leave
VERA:CatchingUp=Catching up - {frames} frames behind
VERA:Rejoining=Rejoining the match - {frames} frames behind
; Chat line a game sends once it has caught up in a shared pause.
VERA:CaughtUp=Caught up, ready to continue.

; Skirmish setup page: Save Setup and Load Setup keep one setup per map
; (buttons, then their status-line help).
VERA:SaveSetup=Save Setup
VERA:LoadSetup=Load Setup
VERA:SaveSetupHelp=Save the players and options for this map
VERA:LoadSetupHelp=Restore the players and options saved for this map

; VERA20k Online login page: accounts (buttons, then their status-line
; help; each button opens its popup).
VERA:PlayAsGuest=Play as Guest
VERA:CreateAccount=Create Account
VERA:ForgotPassword=Forgot Password
VERA:LoginHelp=Sign in to your account with its password
VERA:PlayAsGuestHelp=Play unranked under a username, without an account
VERA:CreateAccountHelp=Create an account with a username, an email and a password
VERA:ForgotPasswordHelp=Mail a code to your account's email to choose a new password
VERA:DeleteAccount=Delete Account
VERA:DeleteAccountHelp=Delete your account for good, with its email and ranked games
; The login page's info pane: the news panel's heading, the lobby's
; activity on its right, what it says without posts, and the rules panel's
; heading and rules, one per line.
VERA:LatestNews=Latest news
VERA:PlayersOnline=Players online: {count}
VERA:RecentGames=Games in the last 24 hours: {count}
VERA:NewsLoading=Loading the news...
VERA:NewsUnavailable=The news is unavailable right now.
VERA:OnlineRules=Online rules
VERA:OnlineRulesText=Be respectful: no insults, threats, hate speech or harassment.\nPlay fair: no cheats, hacks or bug exploits.\nKeep chat clean: no spam, flooding or advertising.\nKeep personal details private, yours and everyone else's.\nChoose a decent username that does not impersonate anyone.\nReport abuse to contact@vera20k.org.
; The account popups' field captions.
VERA:Username=Username
VERA:Password=Password
VERA:RememberPassword=Remember password
VERA:Email=Email
VERA:ConfirmPassword=Confirm password
VERA:NewPassword=New password
VERA:Code=Code

; The online lobby's player card, which a click on a name in the player
; list opens: its captions (with Username), the season's rank and record,
; its buttons and their status-line help. {name} is the player's name. Your
; own card has Change Country in Message's place.
VERA:Country=Country
VERA:Season=Season
VERA:SeasonRank=Rank {rank}, OS {os}
VERA:Record=Record
VERA:WonLost={wins} won, {losses} lost
VERA:Message=Message
VERA:FullProfile=Full Profile
VERA:ChangeCountry=Change Country
VERA:MessageHelp=Send {name} a private message
VERA:AddBuddyHelp=Add {name} to your buddy list
VERA:RemoveBuddyHelp=Remove {name} from your buddy list
VERA:FullProfileHelp=Open {name}'s ranked profile on vera20k.org
VERA:ChangeCountryHelp=Choose the country other players see on your card
