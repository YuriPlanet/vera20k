VERA:GraphicsAdviceMac=It needs Metal graphics. Update macOS; virtual machines often have no Metal support.
VERA:GraphicsAdviceLinux=It needs a Vulkan driver. Install your distribution's Vulkan packages (for example mesa-vulkan-drivers on Debian and Ubuntu, vulkan-radeon or vulkan-intel on Arch, or NVIDIA's own driver) and update your graphics driver. Virtual machines often have no Vulkan support.
VERA:GraphicsLostTitle=The graphics driver stopped
VERA:GraphicsLostText=VERA20k has to close because the graphics driver stopped responding or was reset. Updating the driver can help.
VERA:GraphicsLostSaved=Your game was saved as "{name}".
