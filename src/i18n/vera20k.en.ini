; VERA20k Online: the lobby's own chat lines, from VERA20k and the matchbot
; (docs/lobby-protocol.md). The lobby sends each sentence's key and values,
; and its English here must read exactly as the lobby's own. Sentences join
; with Sentences; lists with the ListAnd patterns ("a, b and c": two items,
; then each before the last two, then the last two) and ListUnit ("a, b, c").
; {side} is a team (Team) or a player's name, {os} a rating, {badge} a
; badge (the LobbyBadge names above), {reason} why a game is unranked or
; was not rated (the Unranked, NotRated and Capped phrases) and {when}
; InMinutes or InAboutHours.
