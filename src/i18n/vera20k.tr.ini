; VERA20k Online: lobinin kendi sohbet satırları, VERA20k ve eşleştirme botu tarafından gönderilir (docs/lobby-protocol.md). Lobi her cümlenin anahtarını ve değerlerini gönderir; vera20k.en.ini içindeki İngilizce metin lobinin kendi metniyle birebir aynı olmalıdır. Cümleler Sentences ile, listeler ListAnd kalıplarıyla ("a, b ve c": iki öğe, sonra son ikiden önceki her öğe, sonra son iki öğe) ve ListUnit ile ("a, b, c") birleşir. {side} bir takım (Team) ya da bir oyuncunun adıdır; {os} bir puan, {badge} bir rozet (yukarıdaki LobbyBadge adları), {reason} bir oyunun neden derecesiz olduğu ya da neden puanlanmadığı (Unranked, NotRated ve Capped ifadeleri), {when} ise InMinutes ya da InAboutHours ifadesidir.
