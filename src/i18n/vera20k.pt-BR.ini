VERA:SettingsFolderUnusableText=O VERA20K guarda VERA.INI e VERARULES.INI na pasta de configurações:\n{folder}\n\nNão foi possível criá-los, gravá-los ou lê-los lá. Verifique se é possível gravar nessa pasta, ou defina [paths] settings_dir em {config} como uma pasta em que você possa gravar.\n\nLog: {log}
