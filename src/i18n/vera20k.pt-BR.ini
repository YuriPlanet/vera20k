VERA:GameFilesAdviceWindows=1. Copie o vera20k.exe para a sua pasta de Red Alert 2: Yuri's Revenge e inicie-o lá.\n\n2. Ou defina [paths] ra2_dir no config.toml, na pasta de onde você o inicia ou ao lado do vera20k.exe:\n{config}
