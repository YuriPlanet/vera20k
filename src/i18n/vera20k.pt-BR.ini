; O texto do README.txt na pasta Mods. Mantenha os nomes de arquivo, [paths], config.toml e a linha mod = como estão, exceto as palavras entre aspas.
VERA:ModsFolderReadme=Os mods do VERA20K ficam nesta pasta.\n\nCrie uma pasta para cada mod e coloque os arquivos dele dentro, com os mesmos nomes do jogo original: rulesmd.ini, artmd.ini, expandmd50.mix, imagens, modelos, sons e mapas.\n\nPara jogar com um mod, adicione esta linha abaixo de [paths] no config.toml e inicie o jogo:\n\nmod = "o nome da pasta"\n\nRemova a linha para jogar sem mod. Seu jogo original nunca é alterado.\n\nMais: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md

