VERA:ConfigUnreadableText=O VERA20K não conseguiu ler o arquivo de configurações:\n{config}\n\nEle precisa ser texto simples salvo em UTF-8. Corrija o problema indicado abaixo, ou mova o arquivo para outro lugar e inicie o VERA20K de novo sem ele.\n\nLog: {log}
