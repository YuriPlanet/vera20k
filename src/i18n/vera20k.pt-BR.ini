; VERA20k Online: as linhas de chat do próprio lobby, vindas do VERA20k e do matchbot
; (docs/lobby-protocol.md). O lobby envia a chave e os valores de cada frase, e o texto
; em inglês de vera20k.en.ini deve ser idêntico ao do próprio lobby. As frases se juntam
; com Sentences; as listas, com os modelos ListAnd ("a, b e c": dois itens, depois cada
; um antes dos dois últimos, depois os dois últimos) e ListUnit ("a, b, c").
; {side} é uma equipe (Team) ou o nome de um jogador, {os} um índice, {badge} uma
; insígnia (os nomes LobbyBadge acima), {reason} por que uma partida não é ranqueada ou
; não foi computada (as frases Unranked, NotRated e Capped) e {when}
; InMinutes ou InAboutHours.
VERA:LobbySentences={first} {second}
VERA:LobbyListAndPair={first} e {second}
VERA:LobbyListAndMiddle={first}, {second}
VERA:LobbyListAndEnd={first} e {second}
VERA:LobbyListUnit={first}, {second}
