VERA:GraphicsAdviceWindows=Ele precisa de DirectX 12 ou Vulkan. Atualize o driver de vídeo da NVIDIA, AMD ou Intel. Máquinas virtuais e sessões de área de trabalho remota muitas vezes não têm esse driver.
VERA:GraphicsAdviceMac=Ele precisa de gráficos Metal. Atualize o macOS; máquinas virtuais muitas vezes não têm suporte a Metal.
VERA:GraphicsAdviceLinux=Ele precisa de um driver Vulkan. Instale os pacotes Vulkan da sua distribuição (por exemplo mesa-vulkan-drivers no Debian e Ubuntu, vulkan-radeon ou vulkan-intel no Arch, ou o driver da própria NVIDIA) e atualize o driver de vídeo. Máquinas virtuais muitas vezes não têm suporte a Vulkan.
