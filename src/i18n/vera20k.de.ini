; LAN- und Online-Räume: im Teams-Fenster der Button Team-Farben des Hosts, der
; jedem Team einen eigenen Farbbereich gibt, bei zwei Teams warm gegen kalt.
; Jeder Spieler behält eine eigene Farbe und kann sie ändern.
VERA:TeamColors=Team-Farben
