VERA:MatchStartCancelled=Dieses Match wurde abgebrochen, weil ein anderer Spieler gegangen ist oder sein Spiel es nicht starten konnte. Falls das öfter passiert, prüft, ob alle dieselben, unveränderten Spieldateien haben.

