VERA:GraphicsAdviceWindows=Es braucht DirectX 12 oder Vulkan. Aktualisiere deinen Grafiktreiber von NVIDIA, AMD oder Intel. Virtuelle Maschinen und Remotedesktop-Sitzungen haben oft keinen solchen Treiber.
VERA:GraphicsAdviceMac=Es braucht Metal-Grafik. Aktualisiere macOS; virtuelle Maschinen unterstützen Metal oft nicht.
VERA:GraphicsAdviceLinux=Es braucht einen Vulkan-Treiber. Installiere die Vulkan-Pakete deiner Distribution (zum Beispiel mesa-vulkan-drivers unter Debian und Ubuntu, vulkan-radeon oder vulkan-intel unter Arch, oder den eigenen Treiber von NVIDIA) und aktualisiere deinen Grafiktreiber. Virtuelle Maschinen unterstützen Vulkan oft nicht.
VERA:StartFailedTitle=VERA20k konnte nicht starten
VERA:NoLogFile=Es konnte keine Logdatei geschrieben werden.

