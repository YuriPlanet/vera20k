; die das Spiel nicht verwenden konnte: die Nachrichtenzeile, einmal. {where} ist Abschnitt und Schlüssel.
VERA:LayoutFileProblem=veraui.ini: {where} wurde nicht verwendet. Die Logdatei listet auf, was zu beheben ist.
; Netzwerk-Match: das Fenster, das es beendet. Der eigene Fehler von VERA20k, dann der Ort der
; Logdatei ({path}) als zweiter Absatz; ein Spielserver, der ein neueres VERA20k braucht
; ({url} ist die Download-Seite); ein verlorener Online-Spielserver.
