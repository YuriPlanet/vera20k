; Netzwerk-Match: Nachrichtenzeilen, wenn der Spielserver das Match für einen Spieler
; verlangsamt, dessen Computer nicht mithält ({name}, oder die zweite Zeile, wenn der
; Name unbekannt ist), dann wenn es wieder mit voller Geschwindigkeit läuft.
VERA:PlayerSlowingGame={name} bremst das Spiel aus.
VERA:SomeoneSlowingGame=Ein Spieler bremst das Spiel aus.
VERA:GameSpeedNormal=Die Spielgeschwindigkeit ist wieder normal.
