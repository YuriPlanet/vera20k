VERA:ModsFolderReadme=Mods für VERA20K kommen in diesen Ordner.\n\nLege für jede Mod einen eigenen Ordner an und lege ihre Dateien hinein, unter denselben Namen wie im Originalspiel: rulesmd.ini, artmd.ini, expandmd50.mix, Bilder, Modelle, Sounds und Karten.\n\nUm eine Mod zu spielen, starte das Spiel, öffne die Optionen, klicke auf „Mods“, wähle die Mod aus und klicke auf „Mod verwenden“. Wähle dort „Keine Mod“, um ohne Mod zu spielen. Dein Originalspiel wird nie verändert.\n\nMehr: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md
