; VERA20k Online: die eigenen Chatzeilen der Lobby, von VERA20k und dem Matchbot
; (docs/lobby-protocol.md). Die Lobby sendet Schlüssel und Werte jedes Satzes, und
; der englische Text in vera20k.en.ini muss genau dem der Lobby entsprechen. Sätze verbindet
; Sentences, Listen verbinden die ListAnd-Muster („a, b und c“: zwei Einträge,
; dann jeder vor den letzten zweien, dann die letzten zwei) und ListUnit („a, b, c“).
; {side} ist ein Team (Team) oder der Name eines Spielers, {os} eine Wertung, {badge} ein
; Abzeichen (die LobbyBadge-Namen oben), {reason} der Grund, warum ein Spiel ungewertet ist oder
; nicht gewertet wurde (die Phrasen Unranked, NotRated und Capped), und {when}
; InMinutes oder InAboutHours.
