VERA:GameFilesAdviceWindows=1. 把 vera20k.exe 复制到你的《红色警戒 2：尤里的复仇》文件夹中，然后从那里启动它。\n\n2. 或者在 config.toml 中设置 [paths] ra2_dir。config.toml 可以放在你启动它时所在的文件夹中，也可以放在 vera20k.exe 旁边：\n{config}
VERA:GameFilesAdviceUnix=请在配置文件\n{config}\n中把 [paths] ra2_dir 设为你的《尤里的复仇》文件夹，也就是包含 ra2md.mix、ra2.mix 和游戏其余文件的文件夹，然后重新启动 VERA20K。
