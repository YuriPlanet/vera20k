; VERA20k 界面文字，简体中文。标签与 vera20k.en.ini 相同；缺少的标签显示英文。
; ra2md.csf 中已有的同名标签优先；这里的文字只在 CSF 缺少该标签时使用。说明见 src/i18n/mod.rs。

[Strings]
; 多人共享暂停（选项菜单按钮和窗口状态行）。
VERA:PauseAllPlayers=暂停所有玩家
VERA:ResumeAllPlayers=恢复所有玩家
VERA:Pausing=正在暂停...
VERA:Resuming=正在恢复...
VERA:PauseRequested=已请求暂停 - 正在等待中继服务器
VERA:ResumeRequested=已请求恢复 - 正在等待中继服务器
VERA:FinishingPause=正在完成共享暂停帧
VERA:PausedForAllPlayers=所有玩家已暂停 - 按暂停键或打开选项以恢复
VERA:ReturnToGame=返回游戏

; 网络恢复（窗口状态行）。
VERA:Reconnecting=正在重新连接 - 等待连接；选择“退出”可离开
VERA:ReconnectPassLapsed=正在重新连接 - VERA20k Online 无法续期本局的游戏服务器通行证；请选择“退出”离开
VERA:CatchingUp=正在追帧 - 落后 {frames} 帧
VERA:Rejoining=正在重新加入对局 - 落后 {frames} 帧
; 游戏在共享暂停中追上进度后发送的聊天消息。
VERA:CaughtUp=已追上进度，可以继续。

; 遭遇战设置页面：“保存设置”和“载入设置”为每张地图保存一套设置（按钮，然后是状态行说明）。
VERA:SaveSetup=保存设置
VERA:LoadSetup=载入设置
VERA:SaveSetupHelp=为此地图保存玩家和游戏选项
VERA:LoadSetupHelp=恢复为此地图保存的玩家和游戏选项

; VERA20k 在线登录页面：账号（按钮，然后是状态行说明；每个按钮打开自己的弹窗）。
VERA:PlayAsGuest=游客登录
VERA:CreateAccount=创建账号
VERA:ForgotPassword=忘记密码
VERA:LoginHelp=用密码登录你的账号
VERA:PlayAsGuestHelp=不使用账号，以一个用户名进行非排位游戏
VERA:CreateAccountHelp=用用户名、电子邮件和密码创建账号
VERA:ForgotPasswordHelp=向你账号的电子邮件发送验证码，以设置新密码
VERA:DeleteAccount=删除账号
VERA:DeleteAccountHelp=永久删除你的账号及其电子邮件和排位赛记录
; 登录页面的信息栏：新闻栏标题、其右侧的大厅动态、没有新闻时的提示，以及规则栏的标题和规则（每行一条）。
VERA:LatestNews=最新新闻
VERA:PlayersOnline=在线玩家：{count}
VERA:RecentGames=过去 24 小时的对局：{count}
VERA:NewsLoading=正在载入新闻...
VERA:NewsUnavailable=暂时无法获取新闻。
VERA:OnlineRules=在线规则
VERA:OnlineRulesText=互相尊重：不辱骂、不威胁、不发表仇恨言论、不骚扰他人。\n公平游戏：不作弊、不使用外挂、不利用漏洞。\n保持聊天整洁：不刷屏、不发广告。\n保护个人信息，包括你自己和他人的。\n选择得体的用户名，不冒充他人。\n举报不当行为请发邮件至 contact@vera20k.org。
; 账号弹窗的栏位标题。
VERA:Username=用户名
VERA:Password=密码
VERA:RememberPassword=记住密码
VERA:Email=电子邮件
VERA:ConfirmPassword=确认密码
VERA:NewPassword=新密码
VERA:Code=验证码

; 在线大厅的玩家资料卡（点击玩家列表中的名字打开）：栏位标题（以及用户名）、本赛季的排名和战绩、按钮及其状态栏说明。{name} 是玩家的名字。你自己的资料卡在“私信”的位置显示“更改国家/地区”。
VERA:Country=国家/地区
VERA:Season=赛季
VERA:SeasonRank=第 {rank} 名，OS {os}
VERA:Record=战绩
VERA:WonLost={wins} 胜 {losses} 负
VERA:Message=私信
VERA:FullProfile=完整资料
VERA:ChangeCountry=更改国家/地区
VERA:MessageHelp=给 {name} 发送私信
VERA:AddBuddyHelp=将 {name} 加为好友
VERA:RemoveBuddyHelp=将 {name} 从好友列表中移除
VERA:FullProfileHelp=在 vera20k.org 上打开 {name} 的排位资料
VERA:ChangeCountryHelp=选择其他玩家在你的资料卡上看到的国家/地区
