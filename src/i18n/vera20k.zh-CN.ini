; VERA20k 界面文字，简体中文。标签与 vera20k.en.ini 相同；缺少的标签显示英文。
; 这里的文字优先于 ra2md.csf 中的同名标签，所以也能翻译游戏自身的文字。说明见 src/i18n/mod.rs。

[Language]
Name=简体中文

[Strings]
; 多人共享暂停（选项菜单按钮和窗口状态行）。
VERA:PauseAllPlayers=暂停所有玩家
VERA:ResumeAllPlayers=恢复所有玩家
VERA:Pausing=正在暂停...
VERA:Resuming=正在恢复...
VERA:PauseRequested=已请求暂停 - 正在等待中继服务器
VERA:ResumeRequested=已请求恢复 - 正在等待中继服务器
VERA:FinishingPause=正在完成共享暂停帧
VERA:PausedForAllPlayers=所有玩家已暂停 - 按暂停键或打开选项以恢复
VERA:ReturnToGame=返回游戏

; 网络恢复（窗口状态行）。
VERA:Reconnecting=正在重新连接 - 等待连接；选择“退出”可离开
VERA:ReconnectPassLapsed=正在重新连接 - VERA20k Online 无法续期本局的游戏服务器通行证；请选择“退出”离开
VERA:CatchingUp[other]=正在追帧 - 落后 {count} 帧
VERA:Rejoining[other]=正在重新加入对局 - 落后 {count} 帧
; 游戏在共享暂停中追上进度后发送的聊天消息。
VERA:CaughtUp=已追上进度，可以继续。

; 遭遇战设置页面：“保存设置”和“载入设置”为每张地图保存一套设置（按钮，然后是状态行说明）。
VERA:SaveSetup=保存设置
VERA:LoadSetup=载入设置
VERA:SaveSetupHelp=为此地图保存玩家和游戏选项
VERA:LoadSetupHelp=恢复为此地图保存的玩家和游戏选项

; VERA20k 在线登录页面：账号（按钮，然后是状态行说明；每个按钮打开自己的弹窗）。
VERA:PlayAsGuest=游客登录
VERA:CreateAccount=创建账号
VERA:ForgotPassword=忘记密码
VERA:LoginHelp=用密码登录你的账号
VERA:PlayAsGuestHelp=不使用账号，以一个用户名进行非排位游戏
VERA:CreateAccountHelp=用用户名、电子邮件和密码创建账号
VERA:ForgotPasswordHelp=向你账号的电子邮件发送验证码，以设置新密码
VERA:DeleteAccount=删除账号
VERA:DeleteAccountHelp=永久删除你的账号及其电子邮件和排位赛记录
; 登录页面的信息栏：新闻栏标题、其右侧的大厅动态、没有新闻时的提示，以及规则栏的标题和规则（每行一条）。
VERA:LatestNews=最新新闻
VERA:PlayersOnline=在线玩家：{count}
VERA:RecentGames=过去 24 小时的对局：{count}
VERA:NewsLoading=正在载入新闻...
VERA:NewsUnavailable=暂时无法获取新闻。
VERA:OnlineRules=在线规则
VERA:OnlineRulesText=互相尊重：不辱骂、不威胁、不发表仇恨言论、不骚扰他人。\n公平游戏：不作弊、不使用外挂、不利用漏洞。\n保持聊天整洁：不刷屏、不发广告。\n保护个人信息，包括你自己和他人的。\n选择得体的用户名，不冒充他人。\n举报不当行为请发邮件至 contact@vera20k.org。
; 账号弹窗的栏位标题。
VERA:Username=用户名
VERA:Password=密码
VERA:RememberPassword=记住密码
VERA:Email=电子邮件
VERA:ConfirmPassword=确认密码
VERA:NewPassword=新密码
VERA:Code=验证码

; 在线大厅的玩家资料卡（点击玩家列表中的名字打开）：栏位标题（以及用户名）、本赛季的排名和战绩、按钮及其状态栏说明。{name} 是玩家的名字。你自己的资料卡在“私信”的位置显示“更改国家/地区”。
VERA:Country=国家/地区
VERA:Season=赛季
VERA:SeasonRank=第 {rank} 名，OS {os}
VERA:Record=战绩
VERA:WonLost={wins} 胜 {losses} 负
VERA:Message=私信
VERA:FullProfile=完整资料
VERA:ChangeCountry=更改国家/地区
VERA:MessageHelp=给 {name} 发送私信
VERA:AddBuddyHelp=将 {name} 加为好友
VERA:RemoveBuddyHelp=将 {name} 从好友列表中移除
VERA:FullProfileHelp=在 vera20k.org 上打开 {name} 的排位资料
VERA:ChangeCountryHelp=选择其他玩家在你的资料卡上看到的国家/地区

; 主菜单：VERA 的“语言”按钮及其状态行说明。选项页的语言列表也使用它们；列表各行是各语言自己的名称。
VERA:Language=语言
VERA:LanguageHelp=选择菜单、战斗文字和游戏自身文字所用的语言。
; 选项页美术资源缺失时主菜单显示的提示。
VERA:OptionsArtworkMissing=无法加载原版选项页的美术资源。

; 选项：VERA 自己的控件名称，以及它们的状态行说明。
VERA:Zoom=缩放
VERA:ZoomHelp=战斗画面的大小。“自动”会为你的屏幕选择最合适的大小。
VERA:Display=显示器
VERA:DisplayHelp=游戏在哪个屏幕上打开。“自动”跟随系统。
VERA:HouseColorStrength=队伍颜色强度
VERA:HouseColorStrengthHelp=队伍颜色的醒目程度，从 1（原版色带）到 10（最鲜明）。下一场战斗生效。
VERA:FullScreen=全屏
VERA:FullScreenHelp=占满整个屏幕。取消勾选则在窗口中游戏。
VERA:OriginalShape=原版 4:3 比例
VERA:OriginalShapeHelp=战斗保持原版的 4:3 比例，宽屏两侧留黑边。
VERA:RenderInterpolation=渲染插值
VERA:RenderInterpolationHelp=在模拟帧之间平滑运动。会增加一帧画面延迟；不会提高模拟速度。
VERA:YrOriginalStyle=原版尤里的复仇风格
VERA:YrOriginalStyleHelp=使用尤里的复仇的载入画面和菜单动画，以及遭遇战和多人游戏大厅的背景。
VERA:ShiftQueue=Shift 点击批量排队
VERA:ShiftQueueHelp=单位图标：Shift 点击一次排队多个，Ctrl 点击无限建造，Alt 点击下一个建造，Shift 右键全部取消。
VERA:CustomEndGameBanner=自定义结局横幅
VERA:CustomEndGameBannerHelp=在战场上显示规则为你的国家设定的胜利或失败图片，并同时播放其音乐。取消勾选则保留标准横幅和主题音乐。
VERA:CustomEndGameScore=自定义结算画面
VERA:CustomEndGameScoreHelp=用同一张国家图片作为结算画面的背景，并用其音乐作为结算主题音乐。取消勾选则保留标准结算画面。
VERA:CustomEndGameMovie=自定义结局动画
VERA:CustomEndGameMovieHelp=让被击败的电脑指挥官播完失败片段，再显示胜利或失败图片和结算画面。仅限遭遇战。取消勾选则立即显示，片段会被打断。
VERA:Sidebar=侧边栏
VERA:SidebarHelp=战斗中侧边栏和底栏的大小。
VERA:HealthBars=生命条
VERA:HealthBarsHelp=单位何时显示生命条。“原版”为鼠标悬停的单位和选中的单位；“所有单位”显示你能看到的每个单位；“所有单位，非满血”不显示满血的单位。
VERA:VeraIcon=VERA 图标
VERA:VeraIconHelp=在游戏窗口、任务栏和程序坞上显示 VERA 自己的图标，而不是红色警戒 2 的红星。
VERA:HdRadar=高清雷达
VERA:HdRadarHelp=侧边栏放大时以屏幕的完整分辨率绘制雷达，让每个地图格子都清晰可见。
VERA:SmoothSidebar=平滑侧边栏
VERA:SmoothSidebarHelp=侧边栏放大时用 xBR 轻度平滑其中的图片和按钮。文字保持清晰。
VERA:HdMapPreviews=高清地图预览
VERA:HdMapPreviewsHelp=在遭遇战、局域网和在线游戏中显示整张地图的清晰图片，每张地图第一次显示时绘制。取消勾选则显示地图自带的小预览图。
VERA:OriginalFont=原版字体
VERA:OriginalFontHelp=用游戏自带的像素字体显示文字，并均匀缩放。它缺少的字符仍使用新字体。
VERA:RightClickOrders=右键下令
VERA:RightClickOrdersHelp=左键选择；右键下达命令。
VERA:MouseWheelZoom=鼠标滚轮缩放
VERA:MouseWheelZoomHelp=用鼠标滚轮放大或缩小战斗画面。关闭后恢复正常视距。
VERA:LockCursor=鼠标锁定在窗口内
VERA:LockCursorHelp=让鼠标保持在游戏窗口内。按 Ctrl+Alt+L 可释放，直到你再次点击游戏画面。
VERA:FpsCounter=帧率计数器
VERA:FpsCounterHelp=在左上角显示每秒帧数。每次启动时关闭；按 Ctrl+Alt+F 也可切换。
VERA:SkipIntro=跳过片头
VERA:SkipIntroHelp=直接进入主菜单，不播放标志动画、启动画面或首次启动的片头动画。下次启动时生效。
VERA:WolTestService=离线互联网测试服务
VERA:WolTestServiceHelp=互联网使用替代的服务器、大厅和玩家，用于测试其界面。
VERA:CheckForUpdates=检查更新
VERA:CheckForUpdatesHelp=立即检查是否有更新的 VERA20K，包括你跳过的版本。
; 缩放列表的各行：缩放比例，以及战斗画面的游戏像素大小。
VERA:ZoomAuto=自动 ({width}x{height})
VERA:ZoomPercent={percent}% ({width}x{height})
; 显示器列表的各行：系统的选择，然后是每个屏幕的大小，以及系统报告的刷新率。
VERA:DisplayAuto=自动
VERA:DisplayScreen=屏幕 {number}：{width}x{height}
VERA:DisplayScreenRate=屏幕 {number}：{width}x{height} {rate}Hz
; 侧边栏和生命条列表的各行。
VERA:SidebarNormal=正常
VERA:SidebarLarge=大
VERA:SidebarExtraLarge=特大
VERA:HealthBarsOriginal=原版
VERA:HealthBarsAll=所有单位
VERA:HealthBarsNotFull=所有单位，非满血
; 原版没有名称的两个页面的名称，以及每个页面按钮的状态行说明。Browser 结尾的是浏览器版本的说明，该版本没有高清地图预览和更新程序。
VERA:Controls=操作
VERA:DeveloperOptions=开发者选项
VERA:DisplayPageHelp=缩放、屏幕、窗口比例、队伍颜色以及战斗的绘制方式。
VERA:GameplayPageHelp=细节、难度、目标线、隐藏物体、排队和结局画面。
VERA:InterfacePageHelp=语言、侧边栏大小和平滑、高清雷达和地图预览、生命条、提示、VERA 图标和字体。
VERA:InterfacePageHelpBrowser=语言、侧边栏大小和平滑、高清雷达、生命条、提示、VERA 图标和字体。
VERA:AudioPageHelp=音乐、音效和语音音量。
VERA:ControlsPageHelp=滚动速度、右键下令、鼠标滚轮缩放和鼠标锁定。
VERA:DeveloperPageHelp=帧率计数器、跳过片头和检查更新。
VERA:DeveloperPageHelpBrowser=帧率计数器和跳过片头。
; 游戏内选项菜单中的显示设置组。
VERA:DisplayGroup=显示

; 首次启动时在系统对话框中询问游戏文件夹，此时还未读取任何游戏文件。
VERA:GameFolderFound=使用这个《尤里的复仇》游戏文件夹吗？
VERA:GameFolderFoundAt=VERA20k 在这里找到了游戏：
VERA:UseThisFolder=使用此文件夹
VERA:ChooseAnotherFolder=选择其他文件夹…
VERA:Quit=退出
VERA:ChooseGameFolder=请选择《尤里的复仇》游戏文件夹（包含 ra2md.mix 和 ra2.mix 的文件夹）。
VERA:ChooseGameFolderAgain=该文件夹中没有 ra2md.mix 和 ra2.mix。请重新选择《尤里的复仇》游戏文件夹。
