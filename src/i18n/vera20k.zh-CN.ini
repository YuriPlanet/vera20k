; VERA20k 界面文字，简体中文。标签与 vera20k.en.ini 相同；缺少的标签显示英文。
; 这里的标签也会覆盖 ra2md.csf 中的同名文字。说明见 src/i18n/mod.rs。

[Strings]
; 多人共享暂停（选项菜单按钮和窗口状态行）。
VERA:PauseAllPlayers=暂停所有玩家
VERA:ResumeAllPlayers=恢复所有玩家
VERA:Pausing=正在暂停...
VERA:Resuming=正在恢复...
VERA:PauseRequested=已请求暂停 - 正在等待中继服务器
VERA:ResumeRequested=已请求恢复 - 正在等待中继服务器
VERA:FinishingPause=正在完成共享暂停帧
VERA:PausedForAllPlayers=所有玩家已暂停 - 按暂停键或打开选项以恢复
VERA:ReturnToGame=返回游戏

; 网络恢复（窗口状态行）。
VERA:Reconnecting=正在重新连接 - 等待连接；选择“退出”可离开
VERA:ReconnectPassLapsed=正在重新连接 - VERA20k Online 无法续期本局的游戏服务器通行证；请选择“退出”离开
VERA:CatchingUp=正在追帧 - 落后 {frames} 帧
VERA:Rejoining=正在重新加入对局 - 落后 {frames} 帧
