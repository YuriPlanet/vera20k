; 选项页面（主菜单）和 Esc 菜单的“显示”组：VERA 自己的标题及各自的状态行说明，然后是列表行、“显示”组的标题和各页面按钮的说明。{number} 是屏幕编号，{size} 是它的分辨率和刷新率。
VERA:OptionsZoom=缩放
VERA:OptionsZoomHelp=战斗画面显示的大小。“自动”会为你的屏幕选择最合适的大小。
VERA:OptionsSidebar=侧边栏
VERA:OptionsSidebarHelp=战斗中侧边栏和底栏的大小。
VERA:OptionsFullScreen=全屏
VERA:OptionsFullScreenHelp=铺满整个屏幕。取消勾选则在窗口中游戏。
VERA:OptionsOriginalShape=原始 4:3 比例
VERA:OptionsOriginalShapeHelp=战斗画面保持原始的 4:3 比例，宽屏两侧留出黑边。
VERA:OptionsYrOriginalStyle=尤复原版风格
VERA:OptionsYrOriginalStyleHelp=使用尤里的复仇的载入画面和菜单影片，以及遭遇战和多人游戏大厅的背景。
VERA:OptionsRenderInterpolation=渲染插值
VERA:OptionsRenderInterpolationHelp=在模拟帧之间平滑显示运动。会增加一帧画面延迟，不会提高模拟速度。
VERA:OptionsMouseWheelZoom=鼠标滚轮缩放
VERA:OptionsMouseWheelZoomHelp=用鼠标滚轮放大或缩小战斗画面。关闭后恢复正常视距。
VERA:OptionsRightClickOrders=右键命令
VERA:OptionsRightClickOrdersHelp=左键选择，右键下达命令。
VERA:OptionsLockCursor=鼠标锁定在窗口内
VERA:OptionsLockCursorHelp=让鼠标保持在游戏窗口内。按 Ctrl+Alt+L 可释放鼠标，直到你再次点击游戏画面。
VERA:OptionsVeraIcon=VERA 图标
VERA:OptionsVeraIconHelp=在游戏窗口、任务栏和程序坞上显示 VERA 自己的图标，而不是红色警戒 2 的红星。
VERA:OptionsHdRadar=高清雷达
VERA:OptionsHdRadarHelp=侧边栏放大时，以屏幕的完整分辨率绘制雷达，让每个地图格子都能显示出来。
VERA:OptionsSmoothSidebar=平滑侧边栏
VERA:OptionsSmoothSidebarHelp=侧边栏放大时，用 xBR 轻度平滑侧边栏的图片和按钮。文字保持清晰。
VERA:OptionsHdMapPreviews=高清地图预览
VERA:OptionsHdMapPreviewsHelp=在遭遇战、局域网和在线游戏中显示整张地图的清晰图片，每张地图第一次显示时绘制。取消勾选则使用地图自带的小预览图。
VERA:OptionsShiftQueue=Shift 点击批量排队
VERA:OptionsControls=控制
VERA:OptionsDeveloperOptions=开发者选项
VERA:OptionsWolTestService=离线互联网测试服务
VERA:OptionsWolTestServiceHelp=“互联网”会用替代的服务器、大厅和玩家打开，用于测试其界面。
VERA:OptionsSkipIntro=跳过片头
VERA:OptionsSkipIntroHelp=直接进入主菜单，不播放标志、启动画面或首次启动的片头影片。下次启动时生效。
VERA:OptionsFpsCounter=FPS 计数器
VERA:OptionsFpsCounterHelp=在左上角显示每秒帧数。每次启动时关闭；也可按 Ctrl+Alt+F 切换。
VERA:OptionsCustomEndGameBanner=自定义胜负横幅
VERA:OptionsCustomEndGameBannerHelp=在战场上显示规则为你的国家设定的胜利或失败图片，并同时播放其音乐。取消勾选则保留标准横幅和主题音乐。
VERA:OptionsCustomEndGameScore=自定义得分界面
VERA:OptionsCustomEndGameScoreHelp=将同一张国家图片用作得分界面的背景，并将其音乐用作得分主题音乐。取消勾选则保留标准得分界面。
VERA:OptionsCustomEndGameMovie=自定义结局影片
VERA:OptionsCustomEndGameMovieHelp=先让被击败的电脑指挥官播完失败片段，再显示胜利或失败图片和得分界面。仅限遭遇战。取消勾选则立即显示，片段会被打断。
VERA:OptionsShiftQueueHelp=单位图标：Shift+点击排入多个，Ctrl+点击无限生产，Alt+点击插到下一个生产，Shift+右键取消全部。
VERA:OptionsDisplay=显示器
VERA:OptionsDisplayHelp=游戏在哪个屏幕上打开。“自动”跟随系统设置。
VERA:OptionsHealthBars=血条
VERA:OptionsHealthBarsHelp=单位何时显示血条。“原版”只显示鼠标悬停和选中的单位；“所有单位”显示你能看到的每个单位；“所有单位（满血除外）”不显示满血的单位。
VERA:OptionsHouseColorStrength=队伍颜色强度
VERA:OptionsHouseColorStrengthHelp=队伍颜色的醒目程度，从 1（原版色带）到 10（最醒目）。下一场战斗生效。
VERA:OptionsCheckForUpdates=检查更新
VERA:OptionsCheckForUpdatesHelp=立即检查是否有更新版本的 VERA20K，包括你跳过的版本。
VERA:OptionsAuto=自动
VERA:OptionsSidebarNormal=普通
VERA:OptionsSidebarLarge=大
VERA:OptionsSidebarExtraLarge=特大
VERA:OptionsHealthBarsOriginal=原版
VERA:OptionsHealthBarsAllUnits=所有单位
VERA:OptionsHealthBarsNotFull=所有单位（满血除外）
VERA:OptionsScreen=屏幕 {number}：{size}
VERA:OptionsDisplayGroup=显示
VERA:OptionsDisplayPageHelp=缩放、屏幕、窗口比例、队伍颜色和战斗画面的绘制方式。
VERA:OptionsGameplayPageHelp=细节、难度、目标线、隐藏物体、排队生产和结束画面。
VERA:OptionsInterfacePageHelp=侧边栏大小和平滑、高清雷达和地图预览、血条、工具提示和 VERA 图标。
VERA:OptionsInterfacePageHelpNoPreviews=侧边栏大小和平滑、高清雷达、血条、工具提示和 VERA 图标。
VERA:OptionsAudioPageHelp=音乐、音效和语音的音量。
VERA:OptionsControlsPageHelp=滚动速度、右键命令、鼠标滚轮缩放和鼠标锁定。
VERA:OptionsDeveloperPageHelp=FPS 计数器、跳过片头和检查更新。
VERA:OptionsDeveloperPageHelpNoUpdates=FPS 计数器和跳过片头。
