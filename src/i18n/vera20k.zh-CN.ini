VERA:GraphicsFailedText=VERA20k 找不到可以使用的显卡和驱动程序。\n\n{advice}\n\n{log}\n\n详细信息：{error}
VERA:GraphicsAdviceWindows=它需要 DirectX 12 或 Vulkan。请从 NVIDIA、AMD 或 Intel 更新你的显卡驱动程序。虚拟机和远程桌面会话通常没有这样的驱动程序。
VERA:GraphicsAdviceMac=它需要 Metal 图形支持。请更新 macOS；虚拟机通常不支持 Metal。
VERA:GraphicsAdviceLinux=它需要 Vulkan 驱动程序。请安装你的发行版的 Vulkan 软件包（例如 Debian 和 Ubuntu 上的 mesa-vulkan-drivers，Arch 上的 vulkan-radeon 或 vulkan-intel，或者 NVIDIA 自己的驱动程序），并更新你的显卡驱动程序。虚拟机通常不支持 Vulkan。
VERA:GraphicsLostTitle=显卡驱动程序已停止工作
VERA:GraphicsLostText=显卡驱动程序停止响应或被重置，VERA20k 必须关闭。更新驱动程序可能会有帮助。
VERA:GraphicsLostSaved=你的游戏已保存为“{name}”。
VERA:GraphicsLostDetails=详细信息：{error}
VERA:GraphicsLostRetry=请再次启动 VERA20k：届时它将通过 {api} 绘制。
VERA:StartFailedTitle=VERA20k 无法启动
VERA:NoLogFile=无法写入日志文件。

; 使用系统软件渲染器启动时的提示框：没有可用的显卡和驱动程序时，由处理器绘制画面；提示框显示期间启动会继续。{adapter} 是渲染器的名称，例如 Microsoft Basic Render Driver，{advice} 是上面三段图形建议之一。
VERA:SoftwareRendererTitle=VERA20k 将运行得非常慢
VERA:SoftwareRendererText=VERA20k 找不到可以使用的显卡和驱动程序，因此改用处理器绘制画面（{adapter}）。游戏会非常慢，启动可能需要几分钟。\n\n{advice}

VERA:GraphicsApiRefusedTitle=VERA20k 无法通过 {api} 启动
VERA:GraphicsApiRefusedText=VERA.INI 要求使用 {api}（[VERA] 节下的 GraphicsAPI 行），但 {api} 无法在这台电脑上启动。VERA20k 改为通过 {used} 绘制。\n\n从 VERA.INI 中删除该行，即可不再显示此消息。\n\n{log}

