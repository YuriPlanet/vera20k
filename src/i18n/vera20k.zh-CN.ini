VERA:ConfigUnreadable=无法读取 config.toml
VERA:ConfigUnreadableText=VERA20K 无法读取设置文件：\n{config}\n\n该文件必须是以 UTF-8 编码保存的纯文本。请修正下面指出的问题，或者把该文件移走，再重新启动 VERA20K。\n\n日志：{log}
VERA:SettingsFolderUnusable=无法使用设置文件夹
VERA:SettingsFolderUnusableText=VERA20K 把 VERA.INI 保存在设置文件夹中：\n{folder}\n\n但无法在那里创建、写入或读取这个文件。请确保该文件夹可以写入，或者在 {config} 中把 [paths] settings_dir 设为一个你可以写入的文件夹。\n\n日志：{log}
; 找不到游戏文件，或者找到了部分文件但无法加载游戏菜单时的标题，然后是正文；{advice} 是后面两段建议之一：Windows 的一段，或 macOS 和 Linux 的一段。Windows 的步骤保留开头的“1.”和“2.”。
VERA:GameFilesNotFound=未找到游戏文件
VERA:GameMenuUnavailable=无法加载游戏菜单
VERA:GameFilesNeededText=VERA20K 需要《红色警戒 2：尤里的复仇》才能运行。\n\n{advice}\n\n游戏文件：{game_files}\n日志：{log}
VERA:GameFilesAdviceWindows=1. 把 vera20k.exe 复制到你的《红色警戒 2：尤里的复仇》文件夹中，然后从那里启动它。\n\n2. 或者在 config.toml 中设置 [paths] ra2_dir。config.toml 可以放在你启动它时所在的文件夹中，也可以放在 vera20k.exe 旁边：\n{config}
VERA:GameFilesAdviceUnix=请在配置文件\n{config}\n中把 [paths] ra2_dir 设为你的《尤里的复仇》文件夹，也就是包含 ra2md.mix、ra2.mix 和游戏其余文件的文件夹，然后重新启动 VERA20K。
