; المباراة الشبكية: أسطر الرسائل حين يُبطئ خادم اللعبة المباراة من أجل لاعب لا يستطيع الكمبيوتر لديه المواكبة ({name}، أو السطر الثاني حين يكون الاسم مجهولًا)، ثم حين تعود إلى سرعتها الكاملة.
VERA:PlayerSlowingGame={name} يُبطئ اللعبة.
VERA:SomeoneSlowingGame=أحد اللاعبين يُبطئ اللعبة.
VERA:GameSpeedNormal=عادت سرعة اللعبة إلى طبيعتها.
; المباراة الشبكية: سطر الرسالة حين تُعطى الأوامر أسرع مما ترسلها الشبكة.
VERA:CommandsStillSending=ما زالت الأوامر قيد الإرسال. حاول مجددًا بعد قليل.
; مباراة يحتوي ملف veraui.ini فيها (تخطيط واجهة التعديل) على سطر لم تستطع اللعبة
; استخدامه: سطر الرسائل، مرة واحدة. {where} هو القسم والمفتاح.
VERA:LayoutFileProblem=veraui.ini: لم يُستخدم {where}. يسرد ملف السجل ما يجب إصلاحه.
