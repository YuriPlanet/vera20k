VERA:StartRelayNotReachedByOther=تعذّر على لعبة لاعب آخر الوصول إلى خادم اللعبة.
VERA:StartLatencyCheckFailed=تعذّر على لعبة أحد اللاعبين إكمال فحص اتصالها باللاعبين الآخرين.
VERA:StartPlayerLeft=غادر أحد اللاعبين قبل بدء اللعبة.
VERA:StartPlayerCancelled=ألغى أحد اللاعبين بدء اللعبة.
VERA:WatchCouldNotStart=تعذّر بدء مشاهدة هذه المباراة.
VERA:WatchedMatchOver=انتهت المباراة التي كنت تشاهدها.
VERA:FinishingPreviousMatch=جارٍ إعادة الاتصال لإنهاء المباراة السابقة قبل اللعب مجددًا.
VERA:OnlineSessionEndedWhileLoading=انتهت الجلسة عبر الإنترنت أثناء تحميل الخريطة.
VERA:OnlineRoomClosedWhileLoading=أُغلقت الغرفة على الإنترنت أثناء تحميل الخريطة.
VERA:OnlinePlayerLeftWhileLoading=غادر لاعب الغرفة على الإنترنت أثناء تحميل الخريطة.
; نقل الخريطة في غرفة اللعب على الإنترنت: سبب توقفه، ثم المربع الذي يعرض خريطة تنقص اللاعب ({map} اسمها، و{count} عدد لاعبيها، و{size} حجمها بالكيلوبايت)؛ ويضيف مربع الخريطة المخصصة مكان حفظها.
VERA:MapTransferInterrupted=توقف نقل الخريطة لأن الاتصال بـVERA20k Online ظل يفشل. انضم إلى اللعبة مجددًا للمحاولة مرة أخرى.
VERA:MapTransferFailed=فشل نقل الخريطة أو التحقق من ملفات التضمين. انضم مجددًا بعد التحقق من الخريطة وملفات التضمين التي تحتاجها.
VERA:RoomMapRetry=إعادة المحاولة
VERA:RoomMapRetryPrompt=تعذّر إكمال تنزيل {map} أو التحقق منها. هل تريد إعادة المحاولة؟
