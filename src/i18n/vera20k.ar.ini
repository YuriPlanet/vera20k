VERA:PerformanceStats=إحصاءات الأداء
VERA:PerformanceStatsHelp=عرض معدل الإطارات وحمل المعالج وGPU أعلى اليسار. معطّلة عند كل تشغيل؛ ويبدّلها Ctrl+Alt+F أيضًا.
