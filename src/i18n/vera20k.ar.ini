VERA:OnlineFull=خدمة VERA20k Online ممتلئة حاليًا. يُرجى المحاولة لاحقًا.
VERA:OnlineBusy=خدمة VERA20k Online مشغولة حاليًا. يُرجى المحاولة بعد دقيقة.
VERA:NameHasAccount=لهذا الاسم حساب. أدخل كلمة مروره، أو اختر اسم مستخدم آخر.
VERA:WrongPassword=كلمة المرور خاطئة.
VERA:NoSuchAccount=لا يوجد حساب بهذا الاسم.
