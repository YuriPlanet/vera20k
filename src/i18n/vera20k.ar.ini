VERA:ModNeedsNewer=يحتاج {mod} إلى VERA20K {needs} أو أحدث، وهذا VERA20K {version}.\n\nبدأت اللعبة هذه المرة من دون هذا المود.
VERA:ModSkipped=لم يبدأ {mod} في المرة السابقة، لذلك بدأت اللعبة هذه المرة من دونه.\n\nشغّل اللعبة مجددًا لتجربة المود مرة أخرى.
