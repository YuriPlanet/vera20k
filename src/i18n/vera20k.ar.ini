VERA:ReplayFailed=فشلت الإعادة: {error} — Esc للخروج
VERA:ReplayPlaying=الإعادة — التحكم بالكاميرا متاح؛ Esc للخروج
VERA:ReplayEnded=انتهت الإعادة — التحكم بالكاميرا متاح؛ Esc للخروج

