; ردهة LAN: رسائل في دردشتها. {host} اسم المضيف الذي ينتظره لاعب عائد من مباراة.
VERA:LanWaitingForHost=بانتظار أن يفتح {host} غرفة اللعب مجددًا...
VERA:LanHostDidNotReturn=لم يفتح {host} غرفة اللعب مجددًا.
VERA:LanJoinNoAnswer=لم تستجب اللعبة. ربما أُغلقت، أو ربما يحجب جدار حماية ألعاب LAN.
