; VERA20k Online: رسائل الردهة نفسها في الدردشة، من VERA20k ومن بوت المطابقة (docs/lobby-protocol.md). ترسل الردهة مفتاح كل جملة وقيمها، ويجب أن يطابق نصها الإنجليزي في vera20k.en.ini نص الردهة نفسها تمامًا. تُوصل الجمل بنمط Sentences، والقوائم بأنماط ListAnd («أ، ب وج»: عنصران، ثم كل عنصر قبل الأخيرين، ثم الأخيران) وبنمط ListUnit («أ، ب، ج»). {side} فريق (Team) أو اسم لاعب، و{os} تقييم، و{badge} شارة (أسماء LobbyBadge أعلاه)، و{reason} سبب كون المباراة غير مصنَّفة أو عدم احتسابها (عبارات Unranked وNotRated وCapped)، و{when} هو InMinutes أو InAboutHours.
