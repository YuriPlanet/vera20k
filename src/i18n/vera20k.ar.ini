; نص ملف README.txt في مجلد Mods. أبقِ أسماء الملفات و[paths] وconfig.toml وسطر mod = كما هي، ما عدا الكلمات داخل علامتي التنصيص.
VERA:ModsFolderReadme=توضع مودات VERA20K في هذا المجلد.\n\nأنشئ مجلدًا لكل مود وضع ملفاته فيه بالأسماء نفسها التي في اللعبة الأصلية: rulesmd.ini وartmd.ini وexpandmd50.mix والصور والنماذج والأصوات والخرائط.\n\nلتلعب بمود، أضف هذا السطر تحت [paths] في config.toml ثم شغّل اللعبة:\n\nmod = "اسم المجلد"\n\nاحذف السطر لتلعب من دون مود. لعبتك الأصلية لا تتغير أبدًا.\n\nللمزيد: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md

