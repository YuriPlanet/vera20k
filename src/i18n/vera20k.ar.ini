VERA:WatchersFull=لدى هذه المباراة كل المشاهدين الذين تتسع لهم.

; دردشة غرفة اللعب على الإنترنت: تقدّم البدء وسبب توقفه، وسبب توقف تحميل الخريطة (ثم تظهر الغرفة مجددًا).
VERA:ConfirmingFinalSettings=بانتظار أن تؤكد لعبة كل لاعب الإعدادات النهائية.
VERA:OnlineRequestMismatch=طلب الردهة لا يطابق إعداد اللعبة الحالي.
VERA:ChoicesNotAcknowledged=لم يؤكد المضيف استلام اختيارات اللاعبين. راجع الإعدادات وحاول مجددًا.
VERA:ChoicesRefused=لم يتمكن المضيف من قبول اختيارات اللاعبين هذه. راجع الإعدادات وحاول مجددًا.
VERA:HostSettingsUnavailable=أحدث إعدادات المضيف غير متاحة. غادر الغرفة ثم انضم إليها مجددًا.
VERA:SetupOperationUnavailable=عملية الإعداد هذه عبر الإنترنت غير متاحة للخريطة المحددة.
VERA:SettingsNotAgreed=تعذّر الاتفاق على إعدادات اللعبة النهائية. اضغط «بدء اللعبة» مجددًا.
VERA:SettingsNotPublished=تعذّر نشر الإعدادات النهائية. اضغط «بدء اللعبة» مجددًا.
VERA:SettingsChangedWhileStarting=تغيّرت إعدادات اللعبة أثناء البدء. اضغط «بدء اللعبة» مجددًا.
VERA:PlayersNotReadyInTime=لم تكن لعبة بعض اللاعبين جاهزة في الوقت المحدد. اضغط «بدء اللعبة» مجددًا.
VERA:StartLobbyBusy=ردهة الإنترنت مشغولة أو لا تستجيب. اضغط «بدء اللعبة» مجددًا.
VERA:StartRefusedSetup=تعذّر بدء المباراة. تحقّق من خريطة كل لاعب وقواعده وإصداره وجاهزيته.
