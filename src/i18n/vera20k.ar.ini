VERA:LobbyGamesHelp=عرض الألعاب التي يمكنك الانضمام إليها أو مشاهدتها

; زر الانضمام السريع في الردهة على الإنترنت وصف التصفية تحت الألعاب: تلميح البحث
; ومساعدته، ومربعا إخفاء الألعاب الممتلئة والمقفلة.
VERA:JoinAnyGame=انضمام سريع
VERA:JoinAnyGameHelp=انضم إلى أول لعبة في القائمة فيها مقعد فارغ وبلا كلمة مرور، أو أنشئ لعبة إن لم توجد
VERA:LobbySearchHint=ابحث عن الألعاب والخرائط
VERA:LobbySearchHelp=اكتب جزءًا من اسم اللعبة أو خريطتها لعرض تلك الألعاب فقط
