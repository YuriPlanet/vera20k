; شرح مربع معاينة الخريطة في سطر الحالة في شاشات إعداد المناوشة و«اختيار الخريطة» وLAN والإنترنت حين تعرض النقرة الخريطة كبيرة: التلميح وحده، ثم بعد شرح المربع نفسه ({help}).
VERA:ClickToEnlarge=انقر للتكبير.
