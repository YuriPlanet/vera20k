VERA:MatchInternalError=واجه VERA20k خطأً داخليًا، لذا لا يمكن متابعة هذه المباراة. لم يفقد اللاعبون التزامن.
VERA:LogFileDetails=التفاصيل في ملف السجل:\n{path}
VERA:MatchNeedsNewerVera=تتطلب هذه المباراة عبر الإنترنت إصدارًا أحدث من VERA20k. نزّله من {url}
VERA:GameServerConnectionFailed=فشل الاتصال بخادم لعبة VERA20k، لذا لا يمكن متابعة هذه المباراة.
VERA:MatchStartMismatch=لا يمكن بدء هذه المباراة لأن لعبتك لا تطابق لعبة لاعب آخر. تأكد من أن لدى الجميع ملفات اللعبة نفسها دون تعديل، ثم حاول مرة أخرى.
VERA:MatchStartCancelled=أُلغيت هذه المباراة لأن لاعبًا آخر غادر أو تعذّر على لعبته بدؤها. إذا تكرر ذلك، فتأكد من أن لدى الجميع ملفات اللعبة نفسها دون تعديل.

; بطاقة نتيجة المعركة حين يتعذّر عرض شاشة النتائج: العنوان، ثم التفاصيل في حالة النصر والهزيمة والمغادرة عبر «إلغاء المهمة».
