; مباراة يحتوي ملف veraui.ini فيها (تخطيط واجهة التعديل) على سطر لم تستطع اللعبة
; استخدامه: سطر الرسائل، مرة واحدة. {where} هو القسم والمفتاح.
VERA:LayoutFileProblem=veraui.ini: لم يُستخدم {where}. يسرد ملف السجل ما يجب إصلاحه.
; المباراة الشبكية: المربع الذي ينهيها. خطأ VERA20k نفسه، ثم مكان ملف السجل ({path}) في فقرة ثانية؛ وخادم لعبة يتطلب VERA20k أحدث ({url} صفحة التنزيل)؛ وفقدان خادم اللعبة على الإنترنت.
VERA:MatchInternalError=واجه VERA20k خطأً داخليًا، لذا لا يمكن متابعة هذه المباراة. لم يفقد اللاعبون التزامن.
VERA:LogFileDetails=التفاصيل في ملف السجل:\n{path}
VERA:MatchNeedsNewerVera=تتطلب هذه المباراة عبر الإنترنت إصدارًا أحدث من VERA20k. نزّله من {url}
VERA:FederationLost=انقطع الاتصال بين خوادم اللعبة. انتهت المباراة بلا فائز. يمكنك بدء مباراة جديدة من الردهة.
VERA:GameServerConnectionFailed=فشل الاتصال بخادم لعبة VERA20k، لذا لا يمكن متابعة هذه المباراة.
VERA:MatchStartMismatch=لا يمكن بدء هذه المباراة لأن لعبتك لا تطابق لعبة لاعب آخر. تأكد من أن لدى الجميع الإصدار نفسه من VERA20k وملفات اللعبة نفسها دون تعديل، ثم حاول مرة أخرى. وفي المباراة التي تبدأ من مشغّل ألعاب، يجب أيضًا أن يتطابق لدى الجميع تشوّه التضاريس وحد الأسلحة الخارقة.
VERA:LauncherShowsMismatch=يعرض مشغّل الألعاب بالتفصيل ما الذي يختلف.
VERA:MatchStartCancelled=أُلغيت هذه المباراة لأن لاعبًا آخر غادر أو تعذّر على لعبته بدؤها. إذا تكرر ذلك، فتأكد من أن لدى الجميع ملفات اللعبة نفسها دون تعديل.

; بطاقة نتيجة المعركة حين يتعذّر عرض شاشة النتائج: العنوان، ثم التفاصيل في حالة النصر والهزيمة والمغادرة عبر «إلغاء المهمة».
VERA:YouAreVictorious=لقد انتصرت!
VERA:YouHaveLost=لقد خسرت
VERA:EnemyForcesDefeated=هُزمت كل قوات العدو.
VERA:YourForcesEliminated=أُبيدت قواتك.
VERA:YouLeftTheBattle=غادرت المعركة.

; سطر الحالة فوق الإعادة: التحميل، والفشل ({error} يذكر السبب)، والتشغيل، والتشغيل حتى النهاية.
VERA:LoadingReplay=جارٍ تحميل الإعادة
VERA:ReplayFailed=فشلت الإعادة: {error} — Esc للخروج
VERA:ReplayPlaying=الإعادة — التحكم بالكاميرا متاح؛ Esc للخروج
VERA:ReplayEnded=انتهت الإعادة — التحكم بالكاميرا متاح؛ Esc للخروج

; مربعات VERA20k Online: مربع تسجيل الدخول حين لا تستجيب الردهة، والمربع فوق الردهة حين تتوقف عن الاستجابة، ومربع تسجيل الدخول حين تتطلب الردهة VERA20k أحدث ولا تذكر سببًا خاصًا بها ({url} مكان الحصول عليه).
VERA:OnlineCantConnect=تعذّر الاتصال بـVERA20k Online. ربما تكون الخدمة متوقفة، أو تحقّق من اتصالك بالإنترنت.
VERA:OnlineConnectionLost=انقطع الاتصال بـVERA20k Online. ربما تكون الخدمة متوقفة، أو تحقّق من اتصالك بالإنترنت.
VERA:OnlineUpdateRequired=حدّث VERA20k لاستخدام اللعب الجماعي الآمن عبر الإنترنت. {url}
; رسائل رفض الردهة حين لا تقدّم رسالة خاصة بها، في مربع تسجيل الدخول أو في سطر الحالة في نافذة الحساب المنبثقة.
VERA:OnlineMaintenance=خدمة VERA20k Online متوقفة للصيانة. يُرجى المحاولة لاحقًا.
VERA:OnlineFull=خدمة VERA20k Online ممتلئة حاليًا. يُرجى المحاولة لاحقًا.
VERA:OnlineBusy=خدمة VERA20k Online مشغولة حاليًا. يُرجى المحاولة بعد دقيقة.
VERA:NameHasAccount=لهذا الاسم حساب. حاول اللعب كضيف مرة أخرى أو سجّل الدخول.
VERA:WrongPassword=كلمة المرور خاطئة.
VERA:NoSuchAccount=لا يوجد حساب بهذا الاسم.
VERA:AccountLocked=محاولات كثيرة جدًا بكلمة مرور خاطئة. حاول مجددًا لاحقًا، أو استخدم «نسيت كلمة المرور».
VERA:TooManyTries=محاولات كثيرة جدًا. يُرجى المحاولة لاحقًا.
VERA:OnlineRefusedEntry=رفضت خدمة VERA20k Online ذلك. تحقّق مما أدخلته.
; سطر الحالة في نوافذ الحساب المنبثقة: ما تطلبه كل نافذة، ثم أثناء انتظار طلب وبعد حذف حساب. {email} هو المكان الذي أُرسل إليه الرمز و{name} اسم مستخدم الحساب.
VERA:SignInRemembered=يتذكّر هذا الكمبيوتر تسجيل دخول هذا الحساب، لذا لا حاجة إلى كلمة مرور.
VERA:SignInForgotten=نسي هذا الكمبيوتر تسجيل الدخول. أدخل كلمة مرور الحساب.
VERA:RegisterPrompt=اختر اسم مستخدم وكلمة مرور من 8 إلى 64 حرفًا.
VERA:VerifyPrompt=أدخل الرمز الذي أرسلناه إلى {email}.
VERA:ForgotPrompt=أدخل اسم المستخدم لحسابك، وسنرسل رمزًا إلى بريده الإلكتروني.
VERA:ResetPrompt=إذا كان {name} حسابًا موجودًا، فقد أُرسل رمز إلى بريده الإلكتروني. اختر كلمة مرور جديدة.
VERA:DeletePrompt=هل تريد حذف حسابك وتقييماته نهائيًا؟ للتأكيد، أدخل اسم المستخدم أو البريد الإلكتروني المسجّل وكلمة المرور الحالية.
VERA:DeleteUseUsername=يتطلب حذف حسابك في هذه الردهة إدخال اسم المستخدم.
VERA:DeleteNameUnavailable=لم تؤكد الردهة أي حساب حُذف. حاول تسجيل الدخول بكلمة المرور قبل المحاولة مجددًا.
VERA:ContactingOnline=جارٍ الاتصال بـVERA20k Online...
VERA:AccountDeleted=حُذف الحساب {name} مع بريده الإلكتروني وكلمة مروره وتقييماته.

; دردشة ردهة الإنترنت: رسالة اليوم من VERA حين لا ترسل الردهة رسالة ({page} أمر المراسلة في اللعبة، مثل /page)، والسطر تحتها، والأسطر عند دخول غرفة لعب ضيفًا ({host} مضيفها، و{room} الاسم الذي أعطاه لها المضيف) أو مضيفًا لها، وتنبيهات VERA.
VERA:JoinedGame=انضممت إلى لعبة {host}. سيبدؤها {host} حين يحضر الجميع.
VERA:JoinedNamedGame=انضممت إلى لعبة {host} ({room}). سيبدؤها {host} حين يحضر الجميع.
VERA:HostRoomHint=ينضم اللاعبون وهم جاهزون. اضغط «بدء اللعبة» حين يحضر الجميع.
VERA:NowHost=أنت المضيف الآن.
VERA:NewHost={name} هو المضيف الآن.
VERA:Lobby=الردهة
VERA:BackToRoom=العودة إلى الغرفة
VERA:VisitingLobby=ما زلت في {room}. اضغط «العودة إلى الغرفة» للرجوع.
VERA:NoLongerInRoom=لم تعد في غرفة {room}.
VERA:VisitedRoomClosed=أُغلقت {room}.
VERA:VisitFailed=تعذّر الذهاب إلى الردهة. ما زلت في الغرفة.
VERA:OnlineNotResponding=ردهة الإنترنت لا تستجيب. جارٍ إعادة المحاولة.
VERA:OnlineRespondingAgain=عادت ردهة الإنترنت إلى الاستجابة.
VERA:OnlineRefreshFailed=تعذّر تحديث ردهة الإنترنت.
VERA:WatchListStale=تعذّر تحديث قائمة المباريات المتاحة للمشاهدة. تجري إعادة المحاولة.
VERA:WatchListUpdated=قائمة المباريات المتاحة للمشاهدة محدّثة من جديد.
VERA:InvalidLobbyUpdate=أرسل الخادم تحديثًا غير صالح للردهة.
VERA:OnlineRequestRefused=لم يُقبل الطلب عبر الإنترنت.
VERA:OnlineServiceRefused=رفضت خدمة اللعب عبر الإنترنت الطلب.
; سطر غرفة الإنترنت حين تكون ردهة الإنترنت أقدم من «الفرق» فترفض فرق المضيف: تستمر الغرفة و«الفرق» متوقفة.
VERA:TeamsNotTaken=ردهة الإنترنت لا تدعم «الفرق» حاليًا، لذا أُوقفت «الفرق».
VERA:HostRulesNotTaken=ردهة الإنترنت لا تستطيع مشاركة «تشوّه التضاريس» حاليًا، لذا تُلعب هذه الغرفة بدونه.
VERA:SuperweaponLimitNotTaken=ردهة الإنترنت لا تستطيع مشاركة «حد الأسلحة الخارقة» حاليًا، لذا تُلعب هذه الغرفة بدونه.
VERA:BigRandomMapNotTaken=ردهة الإنترنت لا تستطيع قبول الخرائط العشوائية لأكثر من ثمانية لاعبين حاليًا، لذا اختر خريطة أصغر.
VERA:RulesDiffer=ملفات القواعد مختلفة في ألعاب اللاعبين.
VERA:RulesDifferChanges=لعبتك تغيّر اللعبة الأصلية بـ: {changes}.
VERA:RulesDifferOriginal=لعبتك تلعب اللعبة الأصلية، لذا لدى لاعب آخر مود أو ملفات لعبة متغيّرة أو إعداد مختلف لأحد الامتدادات أو وضع RA2.
VERA:RulesChangeMod=المود {name}
VERA:RulesChangeIniRoots=ملفات INI المذكورة في config.toml
VERA:RulesChangeRa2=وضع RA2 في الخيارات
VERA:RulesChangeAres=ضبط Ares على {setting} في الخيارات
VERA:RulesChangeKratos=تم تفعيل Kratos
; سطر غرفة الإنترنت حين تكون ردهة الإنترنت أقدم من «الطابور» فترفضه: تستمر الغرفة بلا طابور ويواصل المتفرجون المشاهدة.
VERA:QueueNotTaken=ردهة الإنترنت لا تدعم «الطابور» حاليًا، لذا أُوقف.
VERA:BuildingQueueNotTaken=ردهة الإنترنت لا تستطيع مشاركة طابور إنتاج المباني حاليًا، لذا تلعب هذه الغرفة بدونه.
; سطر غرفة الإنترنت حين تكون ردهة الإنترنت أقدم من «المشاهدة» فترفضها: تستمر الغرفة ولا يستطيع أحد مشاهدة مبارياتها.
VERA:WatchingNotTaken=ردهة الإنترنت لا تسمح حاليًا بمشاهدة مباريات هذه الغرفة، لذا أُوقفت «المشاهدة».
; بعد مباراة عبر الإنترنت: مربع الانتظار ريثما تعود غرفة اللعب، وسطر الردهة حين تُغلق بدلًا من ذلك.
VERA:ReturningToRoom=جارٍ العودة إلى غرفة اللعب...
VERA:GameRoomClosed=أُغلقت غرفة اللعب.
; مربع «إنشاء لعبة» في ردهة الإنترنت: عناوينه، وشرح «مباراة مصنَّفة» في سطر الحالة، واسم الغرفة الذي يبدأ به ({nickname} اسم اللاعب)، والمربع حين تحمل غرفة أخرى هذا الاسم. «الاسم» زر الفرز في قائمتي الألعاب واللاعبين.
VERA:RoomName=اسم الغرفة
VERA:MaxPlayers=أقصى عدد للاعبين
VERA:AllowSpectators=السماح بالمتفرجين
VERA:RankedGame=مباراة مصنَّفة
VERA:RankedGameHelp=احتساب مباريات هذه الغرفة في قيمة OS أثناء موسم جارٍ
; مربع «المشاهدة»: هل يمكن للاعبين في ردهة الإنترنت مشاهدة مباريات هذه الغرفة، بتأخير دقيقتين عن لاعبيها أو لا أحد أو دون تأخير. كل نقرة تعرض القيمة التالية. ويضيف الشرح أن الردهة تسمح دائمًا بمشاهدة المباريات المصنَّفة، ولا تسمح أبدًا بمشاهدة غرفة لها كلمة مرور.
VERA:Watching=المشاهدة
VERA:WatchingDelayed=بتأخير دقيقتين
VERA:WatchingOff=إيقاف
VERA:WatchingLive=مباشرة
VERA:WatchingHelp=يمكن للآخرين المشاهدة: المصنَّفة دائمًا، والغرف ذات كلمة المرور أبدًا
VERA:DefaultRoomName=لعبة {nickname}
VERA:RoomNameTaken=اسم الغرفة هذا مستخدم بالفعل. اختر اسمًا آخر.
VERA:SortName=الاسم

; زر العرض في ردهة الإنترنت: يبدّل قائمة الألعاب بالدردشة واللاعبين ثم يعيدها، ويحمل اسم العرض الذي سيظهر بعده. {count} هو عدد الرسائل التي وصلت أثناء عرض الألعاب. والدردشة هي أيضًا عنوان الدردشة.
