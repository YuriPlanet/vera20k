VERA:Kick=طرد
VERA:RemoveSlot=إزالة خانة
; غرف لعب LAN والإنترنت: مربعات اختيار VERA الخاصة في «خيارات اللعبة»، تحت مربعات اللعبة، ثم زر الخريطة (عنوانه في اللعبة نفسها «تخصيص المعركة»).
VERA:DestroyableBridges=جسور قابلة للتدمير
VERA:InGameAllying=التحالف داخل اللعبة
VERA:NoYuri=بلا يوري
VERA:NoFrance=بلا فرنسا
VERA:NoSpy=بلا جواسيس
VERA:NoStolenTech=بلا تقنية مسروقة
