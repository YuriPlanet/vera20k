; مربعات رسائل النظام نفسه حين يتوقف VERA20k أو يتعذّر تشغيله: كل عنوان ثم نصه. {panic} الخطأ الداخلي، و{advice} نصيحة الرسوميات لهذا النظام (أحد النصوص الثلاثة بعده)، و{error} السبب، و{log} سطر السجل: LogFileDetails، أو NoLogFile حين لا يوجد سجل.
VERA:CrashTitle=توقف VERA20k
VERA:CrashText=واجه VERA20k خطأً داخليًا ويجب أن يُغلق.\n\n{panic}\n\n{log}
VERA:GraphicsFailedTitle=تعذّر على VERA20k تشغيل الرسوميات
VERA:GraphicsFailedText=لم يجد VERA20k بطاقة رسوميات وتعريفًا يمكنه استخدامهما.\n\n{advice}\n\n{log}\n\nالتفاصيل: {error}
VERA:GraphicsAdviceWindows=يحتاج إلى DirectX 12 أو Vulkan. حدّث تعريف بطاقة الرسوميات من NVIDIA أو AMD أو Intel. غالبًا لا يتوفر هذا التعريف في الأجهزة الافتراضية وجلسات سطح المكتب البعيد.
VERA:GraphicsAdviceMac=يحتاج إلى رسوميات Metal. حدّث macOS؛ فالأجهزة الافتراضية غالبًا لا تدعم Metal.
VERA:GraphicsAdviceLinux=يحتاج إلى تعريف Vulkan. ثبّت حزم Vulkan لتوزيعتك (مثل mesa-vulkan-drivers على Debian وUbuntu، أو vulkan-radeon أو vulkan-intel على Arch، أو تعريف NVIDIA الرسمي) وحدّث تعريف بطاقة الرسوميات. غالبًا لا تدعم الأجهزة الافتراضية Vulkan.
VERA:StartFailedTitle=تعذّر تشغيل VERA20k
VERA:NoLogFile=تعذّرت كتابة ملف السجل.

