VERA:RandomMapRoomLimit=عدد لاعبي هذه الخريطة أكبر مما تسمح به غرفة اللعب عبر الشبكة.
VERA:RandomMapGenerateFailed=تعذّر إنشاء هذه الخريطة. حاول مجددًا أو اختر خريطة أخرى.
VERA:OnlineMaps=خرائط الإنترنت
VERA:AddFavorite=إضافة إلى المفضلة
VERA:RemoveFavorite=إزالة من المفضلة
VERA:Favorites=المفضلة
