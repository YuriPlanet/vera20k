VERA:LobbyTeamSeats[other]=الفريق {team}: عدد اللاعبين {count}
VERA:LobbyAiCount=الذكاء الاصطناعي: {count}
VERA:LobbyRoomCapacity=في الغرفة: {count}/{max}
