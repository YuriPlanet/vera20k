VERA:ModsFolderReadme=توضع مودات VERA20K في هذا المجلد.\n\nأنشئ مجلدًا لكل مود وضع ملفاته فيه بالأسماء نفسها التي في اللعبة الأصلية: rulesmd.ini وartmd.ini وexpandmd50.mix والصور والنماذج والأصوات والخرائط.\n\nلتلعب بمود، شغّل اللعبة وافتح «الخيارات» واضغط «المودات»، ثم اختر المود واضغط «استخدم هذا المود». اختر «من دون مود» هناك لتلعب من دون مود. لعبتك الأصلية لا تتغير أبدًا.\n\nللمزيد: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md
