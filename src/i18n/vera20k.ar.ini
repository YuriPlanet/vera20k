; مفاتيح VERA الخاصة في خيارات لوحة المفاتيح. يأخذ كلٌّ منها اسمه من عنوان الإعداد نفسه في الخيارات (VERA:PerformanceStats وVERA:LockCursor وVERA:FullScreen)؛ وهذه أوصافها.
