; VERA20k Online: собственные строки лобби в чате, от VERA20k и матчбота
; (docs/lobby-protocol.md). Лобби присылает метку и значения каждого предложения;
; английский текст здесь должен читаться в точности как текст самого лобби.
; Предложения соединяет Sentences, списки — шаблоны ListAnd («a, b и c»: два
; элемента, затем каждый перед последними двумя, затем последние два) и ListUnit
; («a, b, c»). {side} — команда (Team) или имя игрока, {os} — рейтинг, {badge} —
; звание (названия LobbyBadge выше), {reason} — почему игра не рейтинговая или
; не учтена (фразы Unranked, NotRated и Capped), а {when} — InMinutes или
; InAboutHours.
VERA:LobbySentences={first} {second}
VERA:LobbyListAndPair={first} и {second}
VERA:LobbyListAndMiddle={first}, {second}
VERA:LobbyListAndEnd={first} и {second}
