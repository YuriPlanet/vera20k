VERA:MatchStartMismatch=Этот матч не может начаться: твоя игра не совпадает с игрой другого игрока. Проверь, что у всех одинаковые неизменённые файлы игры, и попробуй снова.
VERA:MatchStartCancelled=Матч отменён: другой игрок вышел, или его игра не смогла начать матч. Если это повторяется, проверь, что у всех одинаковые неизменённые файлы игры.

; Карточка итога боя, когда экран итогов не может открыться: заголовок, затем
