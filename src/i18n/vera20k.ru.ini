; запуститься: каждый заголовок, затем его текст. {panic} — внутренняя ошибка,
; {advice} — совет по графике для этой системы (один из трёх ниже), {error} —
; причина, а {log} — строка журнала: LogFileDetails или NoLogFile, если журнала нет.
VERA:CrashTitle=Работа VERA20k прекращена
