VERA:ModSkipped=В прошлый раз {mod} не запустился, поэтому сейчас игра запущена без него.\n\nЗапусти игру ещё раз, чтобы снова попробовать этот мод.
VERA:ModStartFailed=Не удалось загрузить мод {mod}. Закрой игру и запусти её снова, чтобы играть без него.
; Текст файла README.txt в папке Mods. Имена файлов, [paths], config.toml и строку mod = оставь как есть, кроме слов в кавычках.
VERA:ModsFolderReadme=Моды для VERA20K кладут в эту папку.\n\nСоздай для каждого мода отдельную папку и положи в неё файлы мода под теми же именами, что и в оригинальной игре: rulesmd.ini, artmd.ini, expandmd50.mix, изображения, модели, звуки и карты.\n\nЧтобы играть с модом, добавь в config.toml под [paths] эту строку и запусти игру:\n\nmod = "название папки"\n\nУбери строку, чтобы играть без мода. Оригинальная игра никогда не изменяется.\n\nПодробнее: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md

