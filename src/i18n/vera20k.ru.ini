; место файла журнала ({path}) вторым абзацем; игровой сервер, которому нужна более
; новая версия VERA20k ({url} — страница загрузки); потеря сетевого игрового сервера.
VERA:MatchInternalError=В VERA20k произошла внутренняя ошибка, поэтому матч не может продолжаться. Рассинхронизации между игроками не было.
VERA:LogFileDetails=Подробности — в файле журнала:\n{path}
VERA:MatchNeedsNewerVera=Для этого сетевого матча нужна более новая версия VERA20k. Скачай её: {url}
