; заголовок, затем его текст. {config} — путь к config.toml, {folder} — к папке
; настроек, {game_files} — к папке игры, а {log} — к файлу журнала.
VERA:ConfigUnreadable=Не удалось прочитать config.toml
VERA:ConfigUnreadableText=VERA20K не удалось прочитать свой файл настроек:\n{config}\n\nЭто должен быть обычный текст в кодировке UTF-8. Исправь проблему, указанную ниже, или убери файл и снова запусти VERA20K без него.\n\nЖурнал: {log}
VERA:SettingsFolderUnusable=Не удаётся использовать папку настроек
VERA:SettingsFolderUnusableText=VERA20K хранит VERA.INI и VERARULES.INI в своей папке настроек:\n{folder}\n\nНе удалось создать, записать или прочитать их там. Убедись, что в эту папку можно записывать, или задай в {config} параметр [paths] settings_dir — папку, доступную для записи.\n\nЖурнал: {log}
