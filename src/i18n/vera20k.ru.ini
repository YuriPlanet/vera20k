VERA:GraphicsFailedText=Не найдены видеокарта и драйвер, которые может использовать VERA20k.\n\n{advice}\n\n{log}\n\nПодробности: {error}
VERA:GraphicsAdviceWindows=Нужен DirectX 12 или Vulkan. Обнови драйвер видеокарты с сайта NVIDIA, AMD или Intel. В виртуальных машинах и сеансах удалённого рабочего стола такого драйвера часто нет.
VERA:GraphicsAdviceMac=Нужна графика Metal. Обнови macOS; в виртуальных машинах поддержки Metal часто нет.
VERA:GraphicsAdviceLinux=Нужен драйвер Vulkan. Установи пакеты Vulkan своего дистрибутива (например, mesa-vulkan-drivers в Debian и Ubuntu, vulkan-radeon или vulkan-intel в Arch либо собственный драйвер NVIDIA) и обнови драйвер видеокарты. В виртуальных машинах поддержки Vulkan часто нет.
VERA:StartFailedTitle=Не удалось запустить VERA20k
VERA:NoLogFile=Файл журнала записать не удалось.

