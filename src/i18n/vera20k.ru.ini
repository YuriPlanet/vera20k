VERA:MissingMapOfferKept[few]=У тебя нет карты {map} ({count} игрока, {size} КБ). Скачать её, чтобы сыграть в этой игре? Карта сохранится в папке Maps программы VERA20k.
VERA:MissingMapOfferKept[many]=У тебя нет карты {map} ({count} игроков, {size} КБ). Скачать её, чтобы сыграть в этой игре? Карта сохранится в папке Maps программы VERA20k.
VERA:MissingMapOfferKept[other]=У тебя нет карты {map} ({count} игрока, {size} КБ). Скачать её, чтобы сыграть в этой игре? Карта сохранится в папке Maps программы VERA20k.
