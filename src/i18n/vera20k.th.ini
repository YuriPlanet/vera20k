; คำอธิบายศึกร่วมมือ
NAME:COOPDESC1=- เขตปลอดทหารเท็กซัส - \n อเมริกันปะทะโซเวียตทางตะวันตกเฉียงใต้ของสหรัฐฯ ผู้เล่นต้องผลักดันโซเวียตและพันธมิตรคิวบาออกจากที่ราบเท็กซัส ศึกจบลงด้วยการทำลายป้อมรัสเซียที่อยู่ติดชายแดนเม็กซิโก ระดับความยาก: ง่าย
NAME:COOPDESC2=- แนวรบยุโรป - \n เคาะประตูหน้าของโซเวียตในยุโรปตะวันออก ผู้เล่นเลือกฝ่ายสัมพันธมิตรอังกฤษ ฝรั่งเศส หรือเยอรมนี การรบจบลงด้วยการโจมตีข้ามชายแดนรัสเซียที่ด่านหน้าสำคัญของโซเวียต ระดับความยาก: ง่าย
NAME:COOPDESC3=- ผู้พิทักษ์ตะวันออก - \n สาธารณรัฐเกาหลีต้องยับยั้งการรุกรานของโซเวียตในเอเชียตะวันออกเฉียงใต้ ศึกจบลงด้วยกองกำลังเกาหลีบุกชายฝั่งที่เต็มไปด้วยหิมะทางตะวันออกของรัสเซีย ระดับความยาก: ปานกลาง
NAME:COOPDESC4=- ขุนศึกแอฟริกา - \n ยึดแหล่งน้ำมันในแอฟริกาเหนือ ผู้เล่นควบคุมฝ่ายอิรักและลิเบีย รบกับสัมพันธมิตรยุโรป ระดับความยาก: ปานกลาง
NAME:COOPDESC5=- พายุแดง - \n ผู้เล่นเลือกฝ่ายสัมพันธมิตรอเมริกันและยุโรปเพื่อรบกับรัสเซียในทะเลเหนือและทั่วยุโรปเหนือ ศึกจบลงด้วยการรบทางเรืออันตระการตาในทะเลบอลติกอันหนาวเย็น ระดับความยาก: ยาก
NAME:COOPDESC11=ฐานของโซเวียตในคิวบาเป็นภัยต่อสหรัฐฯ แผ่นดินใหญ่ จึงต้องกำจัดให้สิ้น ผู้บัญชาการ 1 จะเข้าควบคุมกองบัญชาการกองทัพอากาศลับของเราใกล้ชายฝั่ง ผู้บัญชาการ 2 จะรักษากรุงฮาวานา
NAME:COOPDESC12=ยูริตั้งฐานในเนินเขาฮอลลีวูดได้สำเร็จ ผู้บัญชาการ 1 จะดูแลพื้นที่รอบสนามบิน LAX ผู้บัญชาการ 2 จะควบคุมโรงไฟฟ้าและแหล่งน้ำมันทางตะวันออกของทางด่วน
NAME:COOPDESC13=คุณขับไล่ยูริและพันธมิตรรัสเซียกลับเข้าไปในสหภาพโซเวียตได้สำเร็จ ถึงเวลาจัดการพวกเขาให้จบ ผู้บัญชาการ ตั้งฐานและยุติสงครามนี้
NAME:COOPDESC21=อเมริกันเชื่อว่ายึดซีแอตเทิลไว้ได้ บดขยี้แนวป้องกันของพวกเขาแล้วเราจะไปสู่สมรภูมิที่รุ่งโรจน์กว่า ผู้บัญชาการ 1 จะคุมกองกำลังเรือของเรา ส่วนผู้บัญชาการ 2 เตรียมการบุกด้วยยานเกราะ
NAME:COOPDESC22=ยูริผู้ทรยศกำลังฟื้นกำลังในทะเลทรายอียิปต์ ผู้บัญชาการ 1 จะดูแลฐานเก่าของเราตามแม่น้ำไนล์ ผู้บัญชาการ 2 ต้องปกป้องแหล่งน้ำมันของเราทางใต้แนวหน้าของยูริ
NAME:COOPDESC23=ดูเหมือนป่าดำของเยอรมนีจะเป็นที่มั่นสุดท้ายของศัตรูทั้งสอง ทั้งคู่ตามหาห้องแล็บของไอน์สไตน์ด้วยความหวังว่าจะรอด หน่วยข่าวกรองระบุตำแหน่งเครื่องปฏิกรณ์นิวเคลียร์ที่จ่ายไฟให้แล็บของไอน์สไตน์แล้ว ตั้งมั่นให้ดีแล้วออกตามล่าและทำลายศัตรูของรัฐโซเวียตให้สิ้นซาก
NAME:COOPDESC31=สัมพันธมิตรสร้างแนวป้องกันรอบทำเนียบขาวอันล้ำค่า พวกเขาซ่อนหลังเทคโนโลยีเหมือนเด็กขี้ขลาด ตั้งฐานของคุณและยุติความพยายามอันโง่เขลาของพวกเขา
NAME:COOPDESC32=กองทัพแดงขโมยเทคโนโลยีปริซึมของสัมพันธมิตรไปได้ และกำลังพยายามพัฒนาหอปริซึมของตนเองที่ศูนย์วิจัยลับลึกในป่ายูคาทาน เราจะโจมตีฐานของพวกเขาอย่างไม่ทันตั้งตัวและบดขยี้ความหวังสุดท้ายของโซเวียต ผู้บัญชาการ 1 จะเริ่มทางเหนือของแหล่งน้ำมันเล็ก ๆ ผู้บัญชาการ 2 จะเริ่มทางตะวันออกของสนามบินท้องถิ่น
NAME:COOPDESC33=สัมพันธมิตรและโซเวียตรวมกำลังต่อต้านเรา พวกเขารวบรวมกำลังสุดท้ายไว้ที่ลอนดอน ผู้บัญชาการ 1 จะควบคุมแท่นขุดน้ำมันของเราในเมือง ผู้บัญชาการ 2 จะควบคุมโรงพยาบาลฝั่งตรงข้ามแม่น้ำเทมส์ ชัยชนะครั้งนี้จะทำให้ยูริครองโลก
NAME:COOPDESC41=หลังการรุกรานของโซเวียต ยูริได้ตั้งฐานสองแห่งใจกลางนครนิวยอร์ก กองทัพแดงซึ่งหลุดจากการควบคุมของยูริได้เป็นพันธมิตรกับอเมริกันเพื่อปราบผู้ทรยศ

