; {needs} และ {version} คือเวอร์ชันของ VERA20K
VERA:ModNeedsNewer={mod} ต้องใช้ VERA20K {needs} ขึ้นไป แต่นี่คือ VERA20K {version}\n\nครั้งนี้เกมเริ่มโดยไม่ใช้ม็อดนี้
VERA:ModSkipped=ครั้งที่แล้ว {mod} เริ่มไม่สำเร็จ ครั้งนี้เกมจึงเริ่มโดยไม่ใช้ม็อดนี้\n\nเริ่มเกมอีกครั้งเพื่อลองใช้ม็อดนี้ใหม่
VERA:ModStartFailed=โหลดม็อด {mod} ไม่ได้ ปิดเกมแล้วเริ่มใหม่อีกครั้งเพื่อเล่นโดยไม่ใช้ม็อดนี้
; ข้อความของ README.txt ในโฟลเดอร์ Mods คงชื่อไฟล์ [paths] config.toml และบรรทัด mod = ไว้ตามเดิม ยกเว้นคำในเครื่องหมายคำพูด
VERA:ModsFolderReadme=ม็อดของ VERA20K ให้ใส่ไว้ในโฟลเดอร์นี้\n\nสร้างโฟลเดอร์หนึ่งโฟลเดอร์ต่อหนึ่งม็อด แล้วใส่ไฟล์ของม็อดไว้ข้างใน โดยใช้ชื่อเดียวกับในเกมต้นฉบับ: rulesmd.ini, artmd.ini, expandmd50.mix, รูปภาพ, โมเดล, เสียง และแผนที่\n\nถ้าจะเล่นม็อด ให้เพิ่มบรรทัดนี้ใต้ [paths] ใน config.toml แล้วเริ่มเกม:\n\nmod = "ชื่อโฟลเดอร์"\n\nลบบรรทัดนี้ออกเพื่อเล่นโดยไม่มีม็อด เกมต้นฉบับของคุณจะไม่ถูกแก้ไขเลย\n\nดูเพิ่มเติม: https://github.com/YuriPlanet/vera20k/blob/main/docs/modding.md

