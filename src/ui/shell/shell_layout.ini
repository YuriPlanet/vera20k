; The shell dialogs' control rects (read by src/ui/shell/layout_data.rs).
;
; [<dialog>] holds one dialog; <id>=<Rule>,x,y,w,h one control: its resource
; template (DLU unless the rule says pixels) and the rule that places it.
; Ids are hex resource ids, or the page's own ids (0xFFxx) for statics the
; template leaves at 0xFFFF: 0xFF00 + n for the template's n-th such static.
;
; Front-end rules (vera20k_gui::shell::descriptor::AnchorRule::named):
;   Resource      the template converted to pixels (dlu_rect)
;   ChildWindow   the common resized child window (child_window, +1 w/h)
;   StatusLine    status line 0x695 (0x0060B550)
;   RightAnchor   right-panel static (0x0060B1D0)
;   Button        a stacked owner-draw button snapped to its tile
;   BackButton    the column's final tile (template not read)
;   Heading       heading 0x694 (+1 w/h, then +7 y/+1 h, 0x0060BD17)
;   LowHeading    heading 0x694 moved only +1 y (0x0060BCE4)
;   TallHeading   heading 0x694 of a 108x11 template (+7 y, no +1 h)
;   PanelChild    right-panel child with the +1 w/h window, no fix-up
;   MapText       game type / map name (+1 w/h, inset 14)
;   Monitor       monitor 0x71C (+1 w/h, inset 37)
;   Px            pixels on the 800x600 dialog, already placed
;   Centred       pixels from the dialog's corner at the half-margins beyond 800x600
;   ComboFace     a combo's ChildWindow cut to its closed face
;   NewEdit       a NewEdit's ChildWindow after its init inset (0x00614CCF)
;   Preview       right-anchored (RightAnchor), keeping its ChildWindow size
;   None          (overlay sections) the control is not shown
; In-game rules (a running game's right-panel shell):
;   SideButton    a sidebar row (0x0060B000 active branch)
;   LowerButton   the lower button above SIDE3 (0x0060B350; template not read)
;   Child         an ordinary child (0x0060B7A0 active branch)
;   Title, StatusLine  0x694 / 0x695 (template not read)

