; The built-in veraui.ini: the original sidebar as two layouts
; (docs/interface-layout.md). It is the bottom layer: a mod's veraui.ini and
; the player's own layout write their values over the layout its side starts
; from, so every number here is a key's original value. GDI is the allied
; position table, Nod the one the Soviets and Yuri use (gamemd 0x006A5090,
; 0x006A5130, 0x00652E50); Phobos' Sidebar.GDIPositions picks either for
; any side.

