; The built-in veraui.ini: the original match interface as a tree of parts
; (docs/interface-layout.md). It is the bottom layer: a mod's veraui.ini and
; the player's own layout write over it, so every value here is the
; original's.
;
; GDI is the allied position table and Nod the one the Soviets and Yuri use
; (gamemd 0x006A5090, 0x006A5130, 0x00652E50); Phobos' Sidebar.GDIPositions
; picks either for any side. A layout of a mod's file that names no Base=
; starts from the table its side uses.
;
; Key@Allied, Key@Soviet and Key@Yuri hold for that side's pictures only.

[Colors]
SideText=164,210,255
SideText@Soviet=255,255,0
SideText@Yuri=255,255,0
LabelStrip=0,0,0,175

[GDI.Screen]
Type=Screen
Parts=Field,Side,Bar

; ---- The battlefield and what lies over it ----

[GDI.Field]
Type=Battlefield
Parts=Messages,Timers,Banner,Powers,Tooltip

[GDI.Messages]
Type=Box
Hold=TopLeft
X=0
Y=0
Width=Rest
Height=Rest

[GDI.Timers]
Type=Box
Hold=TopLeft
X=0
Y=0
Width=Rest
Height=Rest

[GDI.Banner]
Type=Box
Hold=TopLeft
X=0
Y=0
Width=Rest
Height=Rest

; Phobos' superweapon column, moved from its own place.
[GDI.Powers]
