; VERA20k's lobby colours after Yuri's Revenge's eight. See docs/skirmish-colors.md.
;
; [SkirmishColors] is the list a lobby offers after the eight, in order, at most
; 22 names. A rules INI with its own [SkirmishColors] (a mod's rulesmd.ini,
; VERARULES.INI) replaces this list.
;
; Each name is a [Colors] entry: Hue,Saturation,Value, each 0-255. A name the
; rules [Colors] defines takes the rules' values; the values below are used only
; for a name the rules leave out.

